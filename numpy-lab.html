        { v: 'sin', label: 'sin(라디안)', kind: 'u', fn: Math.sin, py: 'np.sin(a)' },
        { v: 'cos', label: 'cos(라디안)', kind: 'u', fn: Math.cos, py: 'np.cos(a)' },
        { v: 'arcsin', label: 'arcsin', kind: 'u', fn: Math.asin, py: 'np.arcsin(a)' },
        { v: 'deg2rad', label: 'deg2rad', kind: 'u', fn: function (x) { return x * Math.PI / 180; }, py: 'np.deg2rad(a)' },
        { v: 'rad2deg', label: 'rad2deg', kind: 'u', fn: function (x) { return x * 180 / Math.PI; }, py: 'np.rad2deg(a)' },
        { v: 'power', label: 'power(n제곱)', kind: 'power', py: 'np.power(a, n)' },
        { v: 'clip', label: 'clip(자르기)', kind: 'clip', py: 'np.clip(a, lo, hi)' },
        { v: 'gcd', label: 'gcd(vs 12)', kind: 'u', fn: function (x) { return gcdOf(x, 12); }, py: 'np.gcd(a, 12)' },
        { v: 'lcm', label: 'lcm(vs 12)', kind: 'u', fn: function (x) { return lcmOf(x, 12); }, py: 'np.lcm(a, 12)' },
        { v: 'cumsum', label: 'cumsum', kind: 'cumsum', py: 'np.cumsum(a)' }
      ];
      function funcOf(v) { for (var i = 0; i < FUNCS.length; i++) if (FUNCS[i].v === v) return FUNCS[i]; return FUNCS[0]; }

      (function () {
        var state = { input: 'range', fnv: 'sqrt', n: 2, lo: -1, hi: 1 };
        var host = el('div');
        var extraHost = el('div');

        function inputArr() {
          return state.input === 'range' ? ND.arange(-3, 4, 1, 'float64') : ND.linspace(0, 360, 13);
        }

        function computeResult(a) {
          var f = funcOf(state.fnv);
          if (f.kind === 'power') return ND.ops.pow(a, state.n);
          if (f.kind === 'clip') return ND.unop(a, function (x) { return Math.min(state.hi, Math.max(state.lo, x)); });
          if (f.kind === 'cumsum') return ND.cumsum(a);
          return ND.unop(a, f.fn);
        }

        function buildExtra() {
          UI.clear(extraHost);
          var f = funcOf(state.fnv);
          if (f.kind === 'power') {
            extraHost.appendChild(UI.controls([UI.slider({
              label: 'n', min: -3, max: 5, step: 1, value: state.n,
              format: function (v) { return String(v); },
              onChange: function (v) { state.n = v; rebuild(); }
            })]));
          } else if (f.kind === 'clip') {
            extraHost.appendChild(UI.controls([
              UI.slider({ label: 'lo', min: -3, max: 3, step: 1, value: state.lo, format: function (v) { return String(v); }, onChange: function (v) { state.lo = v; rebuild(); } }),
              UI.slider({ label: 'hi', min: -3, max: 3, step: 1, value: state.hi, format: function (v) { return String(v); }, onChange: function (v) { state.hi = v; rebuild(); } })
            ]));
          }
        }

        function rebuild() {
          UI.clear(host);
          var a = inputArr();
          var r = computeResult(a);
          var xs = a.flatValues();

          host.appendChild(UI.code((state.input === 'range' ? 'a = np.arange(-3, 4)' : 'a = np.linspace(0, 360, 13)') + '\n' + funcOf(state.fnv).py));
          host.appendChild(UI.out(ND.format(r)));
          host.appendChild(UI.lineChart({
            series: [{ name: funcOf(state.fnv).label, values: r.flatValues() }],
            x: xs, xLabel: '입력값', yLabel: '출력값'
          }));
          host.appendChild(UI.table(
            [{ k: 'i', label: '입력', num: true }, { k: 'o', label: '출력', num: true }],
            xs.map(function (xv, i) { return { i: fmtN(xv), o: fmtN(r.flatValues()[i]) }; })
          ));
        }

        var inputSeg = UI.seg({
          label: '입력 배열', value: state.input,
          options: [{ value: 'range', label: 'np.arange(-3, 4)' }, { value: 'deg', label: 'np.linspace(0, 360, 13)' }],
          onChange: function (v) { state.input = v; rebuild(); }
        });
        var fnSeg2 = UI.seg({
          label: '함수', value: state.fnv,
          options: FUNCS.map(function (f) { return { value: f.v, label: f.label }; }),
          onChange: function (v) { state.fnv = v; buildExtra(); rebuild(); }
        });

        buildExtra();
        rebuild();

        root.appendChild(UI.card({
          kicker: '시뮬레이터',
          title: '함수 적용기',
          note: '함수를 골라 입력 배열에 적용해 보라. 입력 → 출력 대응을 그래프와 표로 함께 보여 준다. ' +
            '<code>sqrt</code>·<code>log</code> 에 음수나 0을 넣으면 실제 NumPy 처럼 <code>nan</code>·<code>-inf</code> 가 나온다.',
          body: [UI.controls([inputSeg, fnSeg2]), extraHost, host]
        }));
      })();

      // 도(deg) vs 라디안(rad)
      root.appendChild(el('h3', { class: 'h-sub', text: '삼각함수는 라디안을 쓴다' }));
      (function () {
        var wrongVal = Math.sin(30);
        var rightVal = Math.sin(30 * Math.PI / 180);
        root.appendChild(el('p', {
          html: '<code>np.sin(30)</code> 은 <b>sin 30°</b> 가 아니다. NumPy 의 삼각함수는 항상 <b>라디안</b> 입력을 기대한다. ' +
            '30 을 그대로 넣으면 "30 라디안(약 1719°)의 sin" 을 계산하는 것이다.'
        }));
        root.appendChild(UI.code('np.sin(30)                  # 30 라디안의 sin — 원하는 값이 아니다\nnp.sin(np.deg2rad(30))       # 30°를 라디안으로 바꾼 뒤 sin — sin 30° = 0.5'));
        root.appendChild(UI.table(
          [{ k: 'e', label: '식' }, { k: 'v', label: '값' }, { k: 'm', label: '의미' }],
          [
            { e: 'np.sin(30)', v: UI.round2(wrongVal), m: '30 라디안의 sin — 도(°) 로 계산한 게 아니다' },
            { e: 'np.sin(np.deg2rad(30))', v: UI.round2(rightVal), m: 'sin 30° — 원하던 값' }
          ]));
        root.appendChild(UI.callout('trap',
          '각도(°) 를 넣고 싶으면 반드시 <code>np.deg2rad()</code> 로 먼저 라디안으로 바꿔야 한다. ' +
          '이걸 잊는 것이 과학고 학생이 삼각함수를 쓸 때 가장 흔히 저지르는 실수다.'));
      })();

      // 은행가 반올림
      root.appendChild(el('h3', { class: 'h-sub', text: 'np.round 는 은행가 반올림이다' }));
      (function () {
        var xs = [0.5, 1.5, 2.5, 3.5];
        root.appendChild(el('p', {
          html: '학교에서 배운 반올림은 0.5 를 항상 위로 올린다. <b>NumPy 의 <code>np.round</code> 는 다르다</b> — ' +
            '.5 를 만나면 <b>가까운 짝수</b>로 반올림한다("은행가 반올림", banker’s rounding).'
        }));
        root.appendChild(UI.code('np.round([0.5, 1.5, 2.5, 3.5])'));
        root.appendChild(UI.table(
          [{ k: 'x', label: '입력', num: true }, { k: 'np', label: 'np.round(x)', num: true }, { k: 'js', label: 'JS Math.round(x) (참고)', num: true }],
          xs.map(function (x) { return { x: x, np: bankersRound(x).toFixed(1), js: Math.round(x).toFixed(1) }; })
        ));
        root.appendChild(UI.callout('trap',
          '<code>np.round(0.5)</code> → <b>0.0</b>, <code>np.round(2.5)</code> → <b>2.0</b> 이다(모두 가까운 짝수로). ' +
          '자바스크립트의 <code>Math.round</code> 는 반대로 .5 를 항상 위로 올린다(<code>Math.round(0.5) === 1</code>). ' +
          '두 언어가 서로 다른 규칙을 쓴다는 것을 알아 두지 않으면 반올림 결과가 안 맞는 버그를 만든다.'));
      })();

      // exp 표기
      (function () {
        var big = ND.unop(arr5, Math.exp);
        root.appendChild(el('h3', { class: 'h-sub', text: 'np.exp 의 큰 수는 지수 표기로 나온다' }));
        root.appendChild(UI.code('np.exp(arr5)'));
        root.appendChild(UI.out(ND.format(big)));
        root.appendChild(UI.callout('tip',
          '값이 커지면 NumPy 는 출력을 <b>지수 표기</b>(<code>1.23e+05</code> 같은 형태)로 자동 전환한다. ' +
          '출력 형식만 그런 것이고 값 자체가 바뀌는 것은 아니다. ' +
          '표기 방식은 <code>np.set_printoptions(precision=…, suppress=True)</code> 로 조절할 수 있다 ' +
          '(<code>suppress=True</code> 는 지수 표기를 끄고 일반 소수로 보여 준다).'));
      })();

      // pi, e
      root.appendChild(UI.statRow([
        { k: 'np.pi', v: Math.PI.toFixed(10) },
        { k: 'np.e', v: Math.E.toFixed(10) }
      ]));

      // 과제 3번 추천 조합
      root.appendChild(el('h3', { class: 'h-sub', text: '과제 3번(수학 함수 예제)에 참고할 조합' }));
      root.appendChild(el('p', {
        html: '과제는 <b>학생이 직접 5개를 골라야</b> 한다. 여기서는 조합 하나만 완성 예제로 보여 준다 — 그대로 베끼지 말고 참고만 하라.'
      }));
      (function () {
        var s16 = ND.array([16, 25, 36]);
        var sq = ND.unop(s16, Math.sqrt);
        var rr = [2.5, 3.5].map(bankersRound);
        var cosv = Math.cos(60 * Math.PI / 180);
        var powv = ND.ops.pow(ND.arange(1, 6), 2);
        var cumv = ND.cumsum(ND.arange(1, 6));
        root.appendChild(UI.table(
          [{ k: 'f', label: '함수' }, { k: 'c', label: '코드' }, { k: 'r', label: '결과' }],
          [
            { f: 'sqrt', c: 'np.sqrt([16, 25, 36])', r: ND.format(sq) },
            { f: 'round', c: 'np.round([2.5, 3.5])', r: '[' + rr.join('. ') + '.]' },
            { f: 'cos + deg2rad', c: 'np.cos(np.deg2rad(60))', r: UI.round2(cosv) },
            { f: 'power', c: 'np.power(np.arange(1, 6), 2)', r: ND.format(powv) },
            { f: 'cumsum', c: 'np.cumsum(np.arange(1, 6))', r: ND.format(cumv) }
          ]));
      })();

      /* ===================================================================== 퀴즈 */

      root.appendChild(el('h2', { class: 'h-sec', text: '확인 문제' }));
      root.appendChild(UI.quiz([
        {
          q: 'shape <code>(3, 4)</code> 인 배열에 <code>np.sum(a, axis=1)</code> 을 하면 결과의 shape 는?',
          choices: ['<code>(4,)</code>', '<code>(3,)</code>', '<code>(3, 4)</code>', '스칼라 (shape 없음)'],
          answer: 1,
          explain: 'axis=1 은 shape 튜플의 <b>1번째 자리(값 4)</b>가 사라진다는 뜻이다. 남는 것은 0번째 자리인 3 뿐이므로 결과 shape 는 <code>(3,)</code> 이다.'
        },
        {
          q: 'shape <code>(3, 4)</code> 인 배열에 <code>a.sum(axis=0, keepdims=True)</code> 를 하면 결과의 shape 는?',
          choices: ['<code>(4,)</code>', '<code>(1, 4)</code>', '<code>(3, 1)</code>', '<code>(3, 4)</code>'],
          answer: 1,
          explain: 'axis=0 이 사라지는 대신 keepdims=True 는 그 자리를 <b>지우지 않고 크기 1 로 남긴다.</b> 그래서 <code>(3, 4)</code> 의 0번째 자리가 1 이 되어 <code>(1, 4)</code> 다.'
        },
        {
          q: '<code>np.round(2.5)</code> 의 결과는?',
          choices: ['<code>2.0</code>', '<code>3.0</code>', '<code>2</code> (정수)', '에러가 난다'],
          answer: 0,
          explain: 'NumPy 의 반올림은 은행가 반올림이라 .5 는 <b>가까운 짝수</b>로 간다. 2 와 3 중 짝수인 2 로 반올림되어 <code>2.0</code> 이다.'
        },
        {
          q: '2차원 배열 <code>a</code>(shape (3,4))에 대해 <code>a.argmax()</code>(axis 없이)가 돌려주는 것은?',
          choices: [
            '최댓값이 있는 (행, 열) 튜플',
            '배열을 1차원으로 편 뒤의 평평한 위치 하나(정수)',
            '최댓값 그 자체',
            '축마다 하나씩, 총 2개의 위치'
          ],
          answer: 1,
          explain: 'axis 를 주지 않은 <code>argmax</code> 는 배열 전체를 1차원으로 편 뒤의 <b>평평한 인덱스</b> 하나만 준다. ' +
            '(행, 열) 위치로 되돌리려면 <code>np.unravel_index(idx, a.shape)</code> 를 따로 써야 한다.'
        }
      ], { id: 'axis' }));
    }
  });
})();

</script>
<script>
/* ===== webapp/src/modules/ch09-condition.js ===== */
/* ===========================================================================
 * ch09-condition.js — 9장 "조건, 논리, 결측치"
 * 원본 수업 노트북 셀 132~149 + 파일 입출력(155~160) 대응.
 *
 * 이 장의 축: 조건은 값이 아니라 "배열"로 돌아온다(마스크). 그 마스크를
 * all/any 로 한 마디로 줄이고, & | ~ 로 조합하고, where 로 값을 고르고,
 * nan 이 섞이면 무엇이 무너지는지를 전부 엔진으로 계산해 보여준다.
 * 화면의 숫자는 하나도 하드코딩하지 않았다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el, D = window.LabData;

  /* ------------------------------------------------------------ 공용 도구 */

  var DATA = (D && D.inflammation) ? D.nd('inflammation') : null;

  var OPS = {
    lt: { sym: '<',  fn: function (a, b) { return ND.ops.lt(a, b); } },
    le: { sym: '<=', fn: function (a, b) { return ND.ops.le(a, b); } },
    gt: { sym: '>',  fn: function (a, b) { return ND.ops.gt(a, b); } },
    ge: { sym: '>=', fn: function (a, b) { return ND.ops.ge(a, b); } },
    eq: { sym: '==', fn: function (a, b) { return ND.ops.eq(a, b); } },
    ne: { sym: '!=', fn: function (a, b) { return ND.ops.ne(a, b); } }
  };
  var OP_OPTS = [
    { value: 'lt', label: '<' }, { value: 'le', label: '<=' },
    { value: 'gt', label: '>' }, { value: 'ge', label: '>=' },
    { value: 'eq', label: '==' }, { value: 'ne', label: '!=' }
  ];

  /** 0차원 ND → NumPy 출력 문자열 */
  function sc(nd) { return ND.format(nd); }

  function isnanOf(a) { return ND.unop(a, function (x) { return isNaN(x); }, 'bool'); }
  function isfiniteOf(a) { return ND.unop(a, function (x) { return isFinite(x); }, 'bool'); }
  function isinfOf(a) { return ND.unop(a, function (x) { return !isFinite(x) && !isNaN(x); }, 'bool'); }

  /** np.array_equal — shape 와 모든 값이 정확히 같은가 */
  function arrayEqual(a, b) {
    if (a.ndim !== b.ndim) return false;
    for (var i = 0; i < a.ndim; i++) if (a.shape[i] !== b.shape[i]) return false;
    var av = a.flatValues(), bv = b.flatValues();
    for (var j = 0; j < av.length; j++) if (av[j] !== bv[j]) return false;
    return true;
  }

  /** np.allclose — 부동소수 오차를 허용한 비교 */
  function allClose(a, b, rtol, atol) {
    rtol = (rtol === undefined) ? 1e-5 : rtol;
    atol = (atol === undefined) ? 1e-8 : atol;
    var av = a.flatValues(), bv = b.flatValues();
    if (av.length !== bv.length) return false;
    for (var i = 0; i < av.length; i++) {
      if (!(Math.abs(av[i] - bv[i]) <= atol + rtol * Math.abs(bv[i]))) return false;
    }
    return true;
  }

  function TF(b) { return b ? 'True' : 'False'; }

  function panel(kind, title, body) {
    return el('div', null, [
      el('div', { class: 'panel-t' + (kind ? ' ' + kind : ''), text: title }),
      body
    ]);
  }
  function opMark(t) { return el('span', { class: 'op', text: t }); }

  /** np.where(cond) 가 돌려주는 "튜플" 문자열을 실제로 만들어 본다 */
  function whereTupleStr(mask) {
    var hits = mask.indices().filter(function (ix) { return !!mask.get(ix); });
    var parts = [];
    for (var d = 0; d < mask.ndim; d++) {
      var vals = hits.map(function (ix) { return ix[d]; });
      parts.push(vals.length
        ? ND.format(ND.array(vals, 'int64'), { mode: 'repr' })
        : 'array([], dtype=int64)');
    }
    return '(' + parts.join(', ') + (mask.ndim === 1 ? ',' : '') + ')';
  }

  /* =======================================================================
   * 시뮬레이터 ① 조건 검사기 — all / any / axis
   * ===================================================================== */

  function simChecker() {
    var srcOpts = [
      { value: 'a10', label: 'np.arange(10)' },
      { value: 'a110', label: 'np.arange(1, 10)' }
    ];
    if (DATA) srcOpts.push({ value: 'inf', label: '관절염 6×8' });

    var st = { src: 'a10', op: 'lt', thr: 10, axis: 'none' };
    var view = el('div');

    function makeArr() {
      if (st.src === 'a110') return ND.arange(1, 10);
      if (st.src === 'inf' && DATA) return DATA.idx('0:6, 0:8').copy();
      return ND.arange(10);
    }
    function srcCode() {
      if (st.src === 'a110') return 'arr = np.arange(1, 10)';
      if (st.src === 'inf') return 'arr = data[0:6, 0:8]        # 관절염 데이터 일부';
      return 'arr = np.arange(10)';
    }

    function rebuild() {
      UI.clear(view);
      var a = makeArr();
      var op = OPS[st.op];
      var cond = 'arr ' + op.sym + ' ' + st.thr;
      var axArg = st.axis === 'none' ? '' : ', axis=' + st.axis;
      var axisNum = st.axis === 'none' ? null : parseInt(st.axis, 10);

      view.appendChild(UI.code(
        srcCode() + '\n' +
        'mask = ' + cond + '\n' +
        'np.all(mask' + axArg + ')\n' +
        'np.any(mask' + axArg + ')'
      ));

      var mask = op.fn(a, st.thr);
      var nBad = ND.sum(ND.ops.not(mask)).toNested();

      view.appendChild(el('div', { class: 'flow' }, [
        panel('a', 'arr — 조건을 만족한 칸은 파랑, 깬 칸은 빨강', UI.grid(a, {
          axisLabels: true,
          highlight: function (idx) { return mask.get(idx) ? 'a' : 'err'; }
        })),
        opMark('→'),
        panel('', 'mask = ' + cond + '  (bool 배열)', UI.grid(mask, {
          axisLabels: true,
          highlight: function (idx) { return mask.get(idx) ? 'a' : 'err'; }
        }))
      ]));
      view.appendChild(el('p', { class: 'small muted', html:
        '마스크의 shape 는 ' + ND.shapeStr(mask.shape) + ' — 원본과 똑같다. dtype 은 <b>' +
        mask.dtype + '</b>. 조건은 참·거짓 하나가 아니라 <b>배열</b>로 돌아온다.' }));

      if (axisNum === null) {
        view.appendChild(UI.statRow([
          { k: 'np.all(mask)', v: sc(ND.all(mask)), sub: '전부 만족?' },
          { k: 'np.any(mask)', v: sc(ND.any(mask)), sub: '하나라도 만족?' },
          { k: '조건을 깬 원소', v: nBad + ' 개', sub: '전체 ' + a.size + ' 개 중' }
        ]));
      } else {
        var okAll, okAny;
        try {
          okAll = ND.all(mask, axisNum);
          okAny = ND.any(mask, axisNum);
        } catch (e) {
          view.appendChild(UI.errBlock(e.message));
          view.appendChild(UI.callout('why',
            '1차원 배열에는 축이 <code>axis=0</code> 하나뿐이다. 없는 축을 부르면 NumPy 는 ' +
            '그대로 <b>AxisError</b> 를 낸다. 배열 <b>arr</b> 을 관절염 6×8 로 바꾸면 ' +
            'axis=1 도 살아난다.'));
          return;
        }
        view.appendChild(el('div', { class: 'flow' }, [
          panel('r', 'np.all(mask, axis=' + axisNum + ')  →  ' + ND.shapeStr(okAll.shape),
            UI.grid(okAll, { axisLabels: true,
              highlight: function (idx) { return okAll.get(idx) ? 'r' : 'err'; } })),
          panel('r', 'np.any(mask, axis=' + axisNum + ')  →  ' + ND.shapeStr(okAny.shape),
            UI.grid(okAny, { axisLabels: true,
              highlight: function (idx) { return okAny.get(idx) ? 'r' : 'err'; } }))
        ]));
        view.appendChild(el('p', { class: 'small muted', html:
          '축을 지정하면 그 축이 <b>사라진다</b>: ' + ND.shapeStr(mask.shape) + ' → ' +
          ND.shapeStr(okAll.shape) + '. axis=1 은 "행마다 한 칸", axis=0 은 "열마다 한 칸" 이다.' }));
        view.appendChild(UI.out(
          'np.all(mask, axis=' + axisNum + ') → ' + ND.format(okAll) + '\n' +
          'np.any(mask, axis=' + axisNum + ') → ' + ND.format(okAny)));
      }
    }

    var ctl = UI.controls([
      UI.seg({ label: '배열 arr', options: srcOpts, value: st.src,
        onChange: function (v) { st.src = v; rebuild(); } }),
      UI.select({ label: '연산자', options: OP_OPTS, value: st.op,
        onChange: function (v) { st.op = v; rebuild(); } }),
      UI.slider({ label: '임계값', min: 0, max: 20, step: 1, value: st.thr,
        format: function (v) { return String(v); },
        onChange: function (v) { st.thr = v; rebuild(); } }),
      UI.seg({ label: 'axis',
        options: [{ value: 'none', label: '전체(None)' }, { value: '0', label: 'axis=0' }, { value: '1', label: 'axis=1' }],
        value: st.axis, onChange: function (v) { st.axis = v; rebuild(); } })
    ]);

    rebuild();

    return UI.card({
      kicker: '시뮬레이터',
      title: '조건 검사기 — 어느 원소가 조건을 깼는가',
      note: '조건을 만들면 마스크가 생기고, <b>np.all</b> 과 <b>np.any</b> 가 그 마스크를 하나의 ' +
            '참·거짓으로 줄인다. 조건을 깬 칸은 빨강으로 표시된다. axis 를 바꾸면 행별·열별 검사가 된다.',
      body: [ctl, view]
    });
  }

  /* =======================================================================
   * 시뮬레이터 ② 조건 조합기 — & | 와 괄호
   * ===================================================================== */

  function simCombiner() {
    if (!DATA) return null;
    var N = 16;
    var sub = DATA.idx('0:' + N).copy();             // 환자 16명 × 40일
    var dayOpts = [0, 5, 10, 15, 20, 25, 30, 35].map(function (d) {
      return { value: String(d), label: 'day ' + d };
    });

    var st = {
      d1: 5, o1: 'gt', t1: 2,
      d2: 20, o2: 'ge', t2: 12,
      join: 'and'
    };
    var view = el('div');
    var errHost = el('div');

    function condStr(day, op, thr) {
      return 'data[:' + N + ', ' + day + '] ' + OPS[op].sym + ' ' + thr;
    }

    function rebuild() {
      UI.clear(view);
      UI.clear(errHost);

      var col1 = sub.idx(':, ' + st.d1);
      var col2 = sub.idx(':, ' + st.d2);
      var m1 = OPS[st.o1].fn(col1, st.t1);
      var m2 = OPS[st.o2].fn(col2, st.t2);
      var joined = st.join === 'and' ? ND.ops.and(m1, m2) : ND.ops.or(m1, m2);
      var joinSym = st.join === 'and' ? '&' : '|';

      view.appendChild(UI.code(
        'c1 = (' + condStr(st.d1, st.o1, st.t1) + ')\n' +
        'c2 = (' + condStr(st.d2, st.o2, st.t2) + ')\n' +
        'mask = c1 ' + joinSym + ' c2                # np.logical_' +
          (st.join === 'and' ? 'and' : 'or') + '(c1, c2) 와 같다\n' +
        'np.where(mask)[0]                 # 조건을 만족한 환자 번호'
      ));

      var vals = ND.stack([col1, col2], 1);          // (16, 2)
      view.appendChild(el('div', { class: 'flow' }, [
        panel('', '값  [열0 = day ' + st.d1 + ', 열1 = day ' + st.d2 + ']', UI.grid(vals, {
          axisLabels: true,
          highlight: function (idx) {
            if (idx[1] === 0) return m1.get([idx[0]]) ? 'a' : 'dim';
            return m2.get([idx[0]]) ? 'b' : 'dim';
          }
        })),
        opMark('→'),
        panel('a', '조건 1', UI.grid(m1.reshape([N, 1]), {
          highlight: function (idx) { return m1.get([idx[0]]) ? 'a' : 'dim'; }
        })),
        opMark(joinSym),
        panel('b', '조건 2', UI.grid(m2.reshape([N, 1]), {
          highlight: function (idx) { return m2.get([idx[0]]) ? 'b' : 'dim'; }
        })),
        opMark('='),
        panel('r', '결합 mask', UI.grid(joined.reshape([N, 1]), {
          highlight: function (idx) { return joined.get([idx[0]]) ? 'r' : 'dim'; }
        }))
      ]));
      view.appendChild(UI.legend([
        { color: 'var(--s1)', label: '조건 1 이 참' },
        { color: 'var(--s2)', label: '조건 2 이 참' },
        { color: 'var(--s3)', label: '결합 결과가 참' }
      ]));

      var picked = ND.whereIdx(joined);
      var means = ND.mean(sub, 1);
      var pickedMeans = ND.maskSelect(means, joined);
      view.appendChild(UI.out(
        'np.where(mask)[0] → ' + ND.format(picked, { mode: 'repr' }) + '\n' +
        'mask.sum()        → ' + sc(ND.sum(joined)) + '  (환자 ' + N + '명 중)\n' +
        'data[:' + N + '][mask].mean(axis=1) → ' + ND.format(pickedMeans)));
      view.appendChild(el('p', { class: 'small muted', html:
        '마지막 줄이 조건에 걸린 환자들의 40일 평균 염증 수치다. 참고로 16명 전체 평균은 <b>' +
        sc(ND.mean(sub)) + '</b> 이다.' }));
    }

    var ctl1 = UI.controls([
      UI.select({ label: '조건 1 · 열', options: dayOpts, value: String(st.d1),
        onChange: function (v) { st.d1 = parseInt(v, 10); rebuild(); } }),
      UI.select({ label: '연산자', options: OP_OPTS, value: st.o1,
        onChange: function (v) { st.o1 = v; rebuild(); } }),
      UI.slider({ label: '임계값', min: 0, max: 20, step: 1, value: st.t1,
        format: function (v) { return String(v); },
        onChange: function (v) { st.t1 = v; rebuild(); } }),
      UI.seg({ label: '결합', options: [{ value: 'and', label: '& (그리고)' }, { value: 'or', label: '| (또는)' }],
        value: st.join, onChange: function (v) { st.join = v; rebuild(); } })
    ]);
    var ctl2 = UI.controls([
      UI.select({ label: '조건 2 · 열', options: dayOpts, value: String(st.d2),
        onChange: function (v) { st.d2 = parseInt(v, 10); rebuild(); } }),
      UI.select({ label: '연산자', options: OP_OPTS, value: st.o2,
        onChange: function (v) { st.o2 = v; rebuild(); } }),
      UI.slider({ label: '임계값', min: 0, max: 20, step: 1, value: st.t2,
        format: function (v) { return String(v); },
        onChange: function (v) { st.t2 = v; rebuild(); } })
    ]);

    var traps = el('div', { class: 'chips' }, [
      UI.btn('c1 and c2 로 쓰면?', function () {
        UI.clear(errHost);
        errHost.appendChild(UI.code('mask = c1 and c2'));
        errHost.appendChild(UI.errBlock(
          'The truth value of an array with more than one element is ambiguous. ' +
          'Use a.any() or a.all()', 'ValueError'));
        errHost.appendChild(UI.callout('why',
          '파이썬의 <code>and</code> 는 왼쪽 값을 <b>하나의 참·거짓</b>으로 판정하려 한다. ' +
          '그런데 c1 은 원소가 ' + N + '개인 배열이다. "16개가 참이냐"는 질문에 답이 없으므로 ' +
          'NumPy 는 거부하고, <code>.all()</code> 이나 <code>.any()</code> 로 줄이라고 알려 준다. ' +
          '원소별로 묶고 싶으면 <b>&</b> 를 써야 한다.'));
      }),
      UI.btn('괄호를 빼면?', function () {
        UI.clear(errHost);
        errHost.appendChild(UI.code(
          'arr6 = np.arange(10)\n' +
          'arr6 > 2 & arr6 < 5      # 괄호 없음'));
        errHost.appendChild(UI.errBlock(
          'The truth value of an array with more than one element is ambiguous. ' +
          'Use a.any() or a.all()', 'ValueError'));
        errHost.appendChild(UI.callout('trap',
          '<code>&</code> 는 비교 연산자보다 <b>우선순위가 높다</b>. 그래서 파이썬은 이 식을 ' +
          '<code>arr6 &gt; (2 &amp; arr6) &lt; 5</code> 로 읽고, 이어서 연쇄 비교로 풀어 ' +
          '<code>and</code> 를 쓰다가 위 에러를 낸다. 실수 배열이라면 <code>2 &amp; arr</code> ' +
          '자체가 불가능해 <b>TypeError</b>(bitwise_and not supported) 가 난다. ' +
          '조건마다 괄호를 씌우는 것은 선택이 아니라 <b>필수</b>다.'));
      }),
      UI.btn('지우기', function () { UI.clear(errHost); })
    ]);

    rebuild();

    return UI.card({
      kicker: '시뮬레이터',
      title: '조건 조합기 — & 와 | 로 두 조건을 묶는다',
      note: '관절염 데이터 앞 16명을 대상으로, 서로 다른 두 날짜(열)에 조건을 걸어 본다. ' +
            '조건 1(파랑)·조건 2(주황)·결합(초록) 마스크가 나란히 갱신된다. ' +
            '아래 버튼은 학생들이 가장 많이 내는 두 에러를 실제 메시지로 보여 준다.',
      body: [ctl1, ctl2, view, traps, errHost]
    });
  }

  /* =======================================================================
   * 시뮬레이터 ③ where 시각화
   * ===================================================================== */

  function simWhere() {
    var st = { dim: '1d', op: 'lt', thr: 35, mode: '3', tv: '1', fv: '0' };
    var view = el('div');
    var tvCtl, fvCtl;

    function makeArr() {
      if (st.dim === '2d') {
        return DATA ? DATA.idx('0:5, 0:8').copy() : ND.arange(40).reshape([5, 8]);
      }
      return ND.array([10, 20, 30, 40, 50, 60]);
    }
    function srcName() { return st.dim === '2d' ? 'data[0:5, 0:8]' : 'temp4'; }

    /** '1' · 'a' · 'a*2' · 'a+5' 같은 입력을 실제 값/배열로 */
    function parseSide(s, a) {
      s = String(s).trim();
      if (s === '') throw new ND.NDError('빈 칸은 값이 될 수 없다.');
      if (s === 'a') return a;
      if (s === '-a') return ND.ops.mul(a, -1);
      var m = /^a\s*\*\s*(-?[0-9]*\.?[0-9]+)$/.exec(s);
      if (m) return ND.ops.mul(a, parseFloat(m[1]));
      m = /^a\s*([+-])\s*([0-9]*\.?[0-9]+)$/.exec(s);
      if (m) {
        return m[1] === '+' ? ND.ops.add(a, parseFloat(m[2])) : ND.ops.sub(a, parseFloat(m[2]));
      }
      if (/^-?[0-9]*\.?[0-9]+$/.test(s)) return parseFloat(s);
      throw new ND.NDError("여기에는 숫자나 a, a*2, a+5, -a 같은 식만 쓸 수 있다: '" + s + "'");
    }

    function rebuild() {
      UI.clear(view);
      var a = makeArr();
      var op = OPS[st.op];
      var cond = 'a ' + op.sym + ' ' + st.thr;
      var mask = op.fn(a, st.thr);

      if (st.mode === '1') {
        view.appendChild(UI.code(
          'a = ' + srcName() + '\n' +
          'np.where(' + cond + ')          # 인자 1개 → 인덱스\n' +
          'np.where(' + cond + ')[0]'
        ));
        view.appendChild(el('div', { class: 'flow' }, [
          panel('a', 'a — 조건이 참인 칸이 파랑', UI.grid(a, {
            axisLabels: true, showIndex: st.dim === '1d',
            highlight: function (idx) { return mask.get(idx) ? 'a' : 'b'; }
          })),
          opMark('→'),
          panel('', 'mask (bool)', UI.grid(mask, {
            axisLabels: true,
            highlight: function (idx) { return mask.get(idx) ? 'a' : 'b'; }
          }))
        ]));
        var tup = whereTupleStr(mask);
        var flat = ND.whereIdx(mask);
        view.appendChild(UI.out(
          'np.where(' + cond + ')\n' + tup + '\n\n' +
          'np.where(' + cond + ')[0]\n' +
          (mask.ndim === 1
            ? ND.format(flat, { mode: 'repr' })
            : ND.format(ND.array(mask.indices().filter(function (ix) { return !!mask.get(ix); })
                .map(function (ix) { return ix[0]; }), 'int64'), { mode: 'repr' }) + '   # 행 번호만')));
        view.appendChild(UI.callout('trap',
          '결과 맨 끝의 쉼표를 보라 — <code>' + UI.esc(tup) + '</code> 는 배열이 아니라 ' +
          '<b>배열이 든 튜플</b>이다. 축이 ' + mask.ndim + '개니까 배열도 ' + mask.ndim +
          '개 들어 있다. 그래서 실제로 인덱스를 쓰려면 거의 항상 ' +
          '<code>np.where(...)[0]</code> 처럼 꺼내 써야 한다.'));
        return;
      }

      var X, Y;
      try {
        X = parseSide(st.tv, a);
        Y = parseSide(st.fv, a);
      } catch (e) {
        view.appendChild(UI.errBlock(e.message, 'ValueError'));
        return;
      }
      var res;
      try {
        res = ND.where(mask, X, Y);
      } catch (e) {
        view.appendChild(UI.errBlock(e.message));
        return;
      }

      view.appendChild(UI.code(
        'a = ' + srcName() + '\n' +
        'np.where(' + cond + ', ' + st.tv + ', ' + st.fv + ')   # 인자 3개 → 값을 고른 배열'
      ));
      view.appendChild(el('div', { class: 'flow' }, [
        panel('a', 'a', UI.grid(a, {
          axisLabels: true,
          highlight: function (idx) { return mask.get(idx) ? 'a' : 'b'; }
        })),
        opMark('→'),
        panel('', 'mask = ' + cond, UI.grid(mask, {
          axisLabels: true,
          highlight: function (idx) { return mask.get(idx) ? 'a' : 'b'; }
        })),
        opMark('→'),
        panel('r', '결과 — 색은 값을 가져온 쪽', UI.grid(res, {
          axisLabels: true,
          highlight: function (idx) { return mask.get(idx) ? 'a' : 'b'; }
        }))
      ]));
      view.appendChild(UI.legend([
        { color: 'var(--s1)', label: '조건이 참 → 참값(' + st.tv + ') 에서 가져왔다' },
        { color: 'var(--s2)', label: '조건이 거짓 → 거짓값(' + st.fv + ') 에서 가져왔다' }
      ]));
      view.appendChild(UI.out(ND.format(res) + '\n' +
        'shape ' + ND.shapeStr(res.shape) + ' · dtype ' + res.dtype));
      var xIsArr = (X instanceof ND.ND), yIsArr = (Y instanceof ND.ND);
      view.appendChild(el('p', { class: 'small muted', html:
        '참값은 ' + (xIsArr ? '<b>배열</b>' : '<b>스칼라</b>') + ', 거짓값은 ' +
        (yIsArr ? '<b>배열</b>' : '<b>스칼라</b>') + '. 스칼라는 브로드캐스팅으로 ' +
        ND.shapeStr(mask.shape) + ' 만큼 늘어난다 — 그래서 숫자와 배열을 섞어 써도 된다.' }));
    }

    var ctl = UI.controls([
      UI.seg({ label: '배열', options: [{ value: '1d', label: 'temp4 (1차원)' }, { value: '2d', label: '관절염 5×8' }],
        value: st.dim, onChange: function (v) { st.dim = v; st.thr = v === '2d' ? 10 : 35; thrCtl.setValue(st.thr); rebuild(); } }),
      UI.seg({ label: '사용법', options: [{ value: '1', label: '인자 1개 → 인덱스' }, { value: '3', label: '인자 3개 → 값' }],
        value: st.mode, onChange: function (v) { st.mode = v; rebuild(); } }),
      UI.select({ label: '연산자', options: OP_OPTS, value: st.op,
        onChange: function (v) { st.op = v; rebuild(); } })
    ]);
    var thrCtl = UI.slider({ label: '임계값', min: 0, max: 60, step: 5, value: st.thr,
      format: function (v) { return String(v); },
      onChange: function (v) { st.thr = v; rebuild(); } });
    tvCtl = UI.textInput({ label: '참값 (x)', value: st.tv,
      onChange: function (v) { st.tv = v; rebuild(); } });
    fvCtl = UI.textInput({ label: '거짓값 (y)', value: st.fv,
      onChange: function (v) { st.fv = v; rebuild(); } });
    var ctl2 = UI.controls([thrCtl, tvCtl, fvCtl]);
    var preset = UI.chips([
      { value: '1|0', label: '1 / 0  (깃발 세우기)' },
      { value: 'a|0', label: 'a / 0  (통과 못한 값은 0)' },
      { value: '0|a', label: '0 / a  (조건에 걸린 값만 지우기)' },
      { value: 'a*2|a', label: 'a*2 / a  (조건부 두 배)' }
    ], function (v) {
      var p = v.split('|');
      st.mode = '3';
      st.tv = p[0]; st.fv = p[1];
      tvCtl.setValue(p[0]); fvCtl.setValue(p[1]);
    });

    rebuild();

    return UI.card({
      kicker: '시뮬레이터',
      title: 'where 시각화 — 인덱스도 되고 값도 된다',
      note: '<b>인자 1개</b>면 조건이 참인 자리의 <b>인덱스(튜플)</b>, <b>인자 3개</b>면 조건에 따라 ' +
            '값을 고른 <b>새 배열</b>이 나온다. 참값·거짓값 칸에는 숫자뿐 아니라 ' +
            '<code>a</code>, <code>a*2</code>, <code>a+5</code>, <code>-a</code> 도 쓸 수 있다.',
      body: [ctl, ctl2, preset, view]
    });
  }

  /* =======================================================================
   * 시뮬레이터 ④ nan 전파 실험실
   * ===================================================================== */

  function simNanLab() {
    var base = DATA
      ? DATA.idx('0, 15:23').copy()
      : ND.array([4, 7, 7, 12, 18, 6, 13, 11], 'float64');
    var st = { nan: {} };
    var view = el('div');

    function current() {
      var a = base.copy();
      Object.keys(st.nan).forEach(function (k) { if (st.nan[k]) a.set([parseInt(k, 10)], NaN); });
      return a;
    }

    function cellHtml(txt, bad) {
      return bad ? '<b style="color:var(--critical)">' + txt + '</b>' : txt;
    }

    function rebuild() {
      UI.clear(view);
      var a = current();
      var nanMask = isnanOf(a);
      var keep = ND.ops.not(nanMask);
      var clean = ND.maskSelect(a, keep);
      var nNan = ND.sum(nanMask).toNested();

      view.appendChild(el('p', { class: 'small', html:
        '칸을 <b>클릭</b>하면 그 값이 nan(측정 실패)이 된다. 다시 누르면 되돌아온다. ' +
        '현재 nan ' + nNan + '개 / ' + a.size + '개.' }));
      view.appendChild(UI.grid(a, {
        showIndex: true, cellSize: 46,
        highlight: function (idx) { return isNaN(a.get(idx)) ? 'err' : 'a'; },
        label: function (idx, val) { return isNaN(val) ? 'nan' : UI.fmtCell(val, 'float64'); },
        onClick: function (idx) {
          var k = String(idx[0]);
          st.nan[k] = !st.nan[k];
          rebuild();
        }
      }));
      view.appendChild(el('div', { class: 'chips' }, [
        UI.btn('한 칸만 nan (index 2)', function () { st.nan = { '2': true }; rebuild(); }),
        UI.btn('전부 nan', function () {
          st.nan = {};
          for (var i = 0; i < base.size; i++) st.nan[String(i)] = true;
          rebuild();
        }),
        UI.btn('모두 되돌리기', function () { st.nan = {}; rebuild(); }, { primary: true })
      ]));

      view.appendChild(UI.code(
        'np.isnan(a)          # nan 인 자리 찾기\n' +
        'a[~np.isnan(a)]      # nan 을 빼고 남은 값 (사본)\n' +
        'np.sum(a), np.nansum(a)'));
      view.appendChild(el('div', { class: 'flow' }, [
        panel('', 'np.isnan(a)', UI.grid(nanMask, {
          highlight: function (idx) { return nanMask.get(idx) ? 'err' : 'a'; }
        })),
        opMark('→'),
        panel('r', 'a[~np.isnan(a)]  ' + ND.shapeStr(clean.shape),
          UI.grid(clean, { highlight: function () { return 'r'; } }))
      ]));

      function row(name, nanName, f) {
        var raw, cln;
        try { raw = sc(f(a)); } catch (e) { raw = '에러'; }
        try { cln = clean.size ? sc(f(clean)) : 'nan'; } catch (e) { cln = 'nan'; }
        return {
          f: name,
          v: cellHtml(raw, raw === 'nan'),
          nf: nanName,
          nv: cellHtml(cln, cln === 'nan')
        };
      }
      var rows = [
        row('np.sum(a)', 'np.nansum(a)', function (x) { return ND.sum(x); }),
        row('np.mean(a)', 'np.nanmean(a)', function (x) { return ND.mean(x); }),
        row('np.max(a)', 'np.nanmax(a)', function (x) { return ND.max(x); }),
        row('np.min(a)', 'np.nanmin(a)', function (x) { return ND.min(x); }),
        row('np.std(a)', 'np.nanstd(a)', function (x) { return ND.std(x, null, 0); })
      ];
      view.appendChild(UI.table([
        { k: 'f', label: '보통 함수' },
        { k: 'v', label: '결과', num: true, raw: true },
        { k: 'nf', label: 'nan 을 건너뛰는 함수' },
        { k: 'nv', label: '결과', num: true, raw: true }
      ], rows));

      if (nNan === 0) {
        view.appendChild(UI.callout('tip',
          'nan 이 하나도 없으면 두 줄의 값이 같다. 이제 위 격자에서 칸 하나만 눌러 보라 — ' +
          '<b>왼쪽 열 전체가 한꺼번에 nan 이 된다.</b>'));
      } else if (clean.size === 0) {
        view.appendChild(UI.callout('trap',
          '전부 nan 이면 걸러낼 값이 남지 않는다. 이때 <code>np.nansum</code> 은 <b>0.0</b> 을 ' +
          '돌려주지만 <code>np.nanmean</code> 은 nan + RuntimeWarning, ' +
          '<code>np.nanmax</code> 는 아예 <b>ValueError</b> 를 낸다. ' +
          '"결측치를 무시한다"는 말이 "결측치가 없는 것처럼 된다"는 뜻은 아니다.'));
      } else {
        view.appendChild(UI.callout('why',

/* ===== webapp/src/modules/ch10-project.js ===== */
/* ===========================================================================
 * ch10-project.js — 10장 종합 실습: 관절염 데이터 분석
 * 실습 과제 2번 전체를 살아 있는 대시보드로 만든다.
 * 화면의 모든 숫자는 D.nd('inflammation') 을 ND 엔진으로 그 자리에서 계산한 값이다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el, D = window.LabData;

  /* 색 배정 — 모든 장 공통 */
  var C_A = 'var(--s1)';          // 주 계열 / 선택된 것
  var C_B = 'var(--s2)';          // 두 번째 계열
  var C_R = 'var(--s3)';          // 결과
  var C_REF = 'var(--ink-muted)'; // 참고용 배경 계열

  /* ------------------------------------------------------------ 작은 도구 */

  function sc(nd) { return nd.toNested(); }                 // 0차원 ND → 숫자
  function py(v) { return ND.fmtScalar(v, 'float64'); }     // 파이썬 float 표기: 18.0
  function fx(v, n) { return Number(v).toFixed(n === undefined ? 2 : n); }
  function ivals(nd) { return nd.toNested(); }              // 1차원 ND → JS 배열

  /** np.round — 은행가 반올림(round half to even) */
  function npRound(v, dec) {
    dec = dec || 0;
    var f = Math.pow(10, dec), x = v * f;
    var fl = Math.floor(x), diff = x - fl, r;
    if (diff === 0.5) r = (fl % 2 === 0) ? fl : fl + 1;
    else r = Math.round(x);
    return r / f;
  }

  /** 학교에서 배운 반올림(0.5 는 무조건 올림) */
  function schoolRound(v, dec) {
    dec = dec || 0;
    var f = Math.pow(10, dec);
    return Math.floor(v * f + 0.5) / f;
  }

  /** 0~n-1 정수 배열 */
  function seq(n) { var a = [], i; for (i = 0; i < n; i++) a.push(i); return a; }

  /** 1차원 배열을 한 줄 격자로 */
  function rowGrid(nd, opts) {
    opts = opts || {};
    return UI.grid(nd, {
      axisLabels: opts.axisLabels !== false,

      highlight: opts.highlight,
      label: opts.label
    });

  /** 문자열을 정해진 폭으로 (아스키 정렬용) */
  function padL(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }
  function padR(s, n) { s = String(s); while (s.length < n) s = s + ' '; return s; }
  function bar(n) { var s = ''; while (s.length < n) s += '█'; return s; }

  /** 엔진이 던지는 에러를 학생에게 그대로 보여 준다 */
  function tryBlock(fn) {

      }

      var pSlider = UI.slider({
        label: '환자', min: 0, max: nP - 1, step: 1, value: 4,

      });

      root.appendChild(UI.card({
        kicker: '시뮬레이터',

              '<b>y축은 0~20 으로 고정</b>했다 — 환자를 바꿔도 눈금이 그대로여서 서로 직접 비교할 수 있다. ' +
              '눈금이 매번 달라지는 그래프는 비교에 쓸 수 없다.',
        body: [
          UI.controls([pSlider]),
          UI.chips([
            { value: '4', label: '5번째 환자 = data[4]' },
            { value: '0', label: '첫 번째 환자 = data[0]' },
            { value: String(bestP), label: '평균이 가장 높은 환자 = data[' + bestP + ']' },
            { value: String(worstP), label: '평균이 가장 낮은 환자 = data[' + worstP + ']' },
            { value: String(flatIdx[0]), label: '전체 최댓값을 기록한 환자 = data[' + flatIdx[0] + ']' }
          ], function (v) {
            sim2.p = parseInt(v, 10);

            s2Rebuild();
          }),
          UI.callout('trap',
            '프리셋 첫 버튼을 다시 보라. <b>"5번째 환자"는 <code>data[4]</code></b> 다. ' +
            '슬라이더 라벨이 <code>data[4]</code> 인데 통계 카드에는 "5번째 환자"라고 적힌다 — ' +
            '이 두 표기를 나란히 두고 익숙해져라.'),
          UI.code(
            'row = data[p]                 # p번 환자의 40일, shape (' + nD + ',)\n' +
            'row.max(), row.argmax()       # 최고 염증과 그 날짜\n' +
            'row.mean(), row.std()\n' +
            '(row >= 15).sum()             # 15 이상인 날 수'),
          s2Host,
          UI.btn('10.1 히트맵에서 이 환자 줄 보기', function () {
            heatBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
          })
        ]
      }));

      s2Rebuild();

      /* ========================================= 시뮬레이터 ③ 축 방향 비교 */

      root.appendChild(el('h2', { class: 'h-sec', text: '시뮬레이터 ③ 축 방향 비교기 (axis=0 vs axis=1)' }));

      var AXIS_FN = {
        mean: { label: '평균 mean', call: function (a, ax) { return ND.mean(a, ax); },
          i0: '그 날짜에 모인 ' + nP + '명의 평균 염증', i1: '그 환자의 ' + nD + '일 평균 염증' },
        max: { label: '최댓값 max', call: function (a, ax) { return ND.max(a, ax); },
          i0: '그 날짜에 가장 높았던 값', i1: '그 환자가 기록한 최고 염증' },
        std: { label: '표준편차 std', call: function (a, ax) { return ND.std(a, ax); },
          i0: '그 날짜에 환자들이 얼마나 흩어져 있었나', i1: '그 환자의 40일이 얼마나 출렁였나' },
        argmax: { label: '최댓값의 위치 argmax', call: function (a, ax) { return ND.argmax(a, ax); },
          i0: '그 날짜에 가장 높았던 <b>환자 번호</b>', i1: '그 환자가 가장 아팠던 <b>날짜</b>' }
      };

      var sim3 = { fn: 'mean' };
      var s3Host = el('div');

      function axisPanel(ax, spec) {
        var r = spec.call(data, ax);
        var vals = ivals(r);
        var head = ax === 0
          ? 'axis=0 — 행(환자)을 뭉갠다 → 날짜별'

        return el('div', { style: {
          border: '1px solid var(--border)', borderRadius: '10px', padding: '.9rem 1rem'
        } }, [
          el('div', { class: 'card-title', text: head }),

          UI.shapeBadge(r),
          el('p', { class: 'small', html:

          el('p', { class: 'small', html:
            '앞 6개: <code>' + UI.esc(ND.format(r.idx(':6'))) + '</code>' })
        ]);
      }

      function s3Rebuild() {
        UI.clear(s3Host);
        var spec = AXIS_FN[sim3.fn];
        var r0 = spec.call(data, 0), r1 = spec.call(data, 1);

        s3Host.appendChild(el('div', { style: {
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '.9rem'
        } }, [axisPanel(0, spec), axisPanel(1, spec)]));

        s3Host.appendChild(el('h3', { class: 'h-sub',
          text: 'axis=0 → 길이 ' + r0.shape[0] + ' (날짜별)' }));
        s3Host.appendChild(UI.lineChart({
          series: [{ name: spec.label + ' · axis=0', values: ivals(r0), color: C_A }],
          x: days, xLabel: 'day', yLabel: spec.label, height: 200, yMin: 0
        }));

        s3Host.appendChild(el('h3', { class: 'h-sub',
          text: 'axis=1 → 길이 ' + r1.shape[0] + ' (환자별)' }));
        s3Host.appendChild(UI.lineChart({
          series: [{ name: spec.label + ' · axis=1', values: ivals(r1), color: C_B }],
          x: pats, xLabel: '환자', yLabel: spec.label, height: 200, yMin: 0
        }));
      }

      root.appendChild(UI.card({
        kicker: '시뮬레이터',
        title: '같은 데이터, 같은 함수, 다른 축',
        note: '함수를 바꿔 보라. <b>어느 축을 지웠는지</b>에 따라 결과의 길이와 뜻이 완전히 달라진다. ' +
              '두 곡선의 모양이 닮은 데가 하나도 없다는 것을 눈으로 확인하라.',
        body: [
          UI.controls([
            UI.select({
              label: '함수', value: 'mean',
              options: Object.keys(AXIS_FN).map(function (k) {
                return { value: k, label: AXIS_FN[k].label };
              }),
              onChange: function (v) { sim3.fn = v; s3Rebuild(); }
            })
          ]),
          s3Host,
          UI.callout('why',
            '<b>축을 지정하면 그 축이 사라진다.</b> ' + ND.shapeStr(data.shape) + ' 에서 ' +
            'axis=0 을 지우면 (' + nD + ',) 가 남고, axis=1 을 지우면 (' + nP + ',) 가 남는다. ' +
            '그래서 결과의 shape 만 보면 "날짜별인가 환자별인가"를 바로 판단할 수 있다. ' +
            '축 번호를 외우려 하지 말고 <b>결과 길이가 ' + nD + '이냐 ' + nP + '이냐</b>로 확인하는 습관을 들여라(8장).'),
          el('p', { html: '없는 축을 지우려 하면 어떻게 되는지도 보자. 2차원 배열의 축은 0 과 1 뿐이다.' }),
          UI.code('data.mean(axis=2)'),
          tryBlock(function () { return UI.out(ND.format(ND.mean(data, 2))); })
        ]
      }));

      s3Rebuild();

      /* ================================================ 10.3 스스로 해 보기 */

      root.appendChild(el('h2', { class: 'h-sec', text: '10.3 스스로 해 보기' }));
      root.appendChild(el('p', { html:
        '과제에 없는 질문 다섯 개다. <b>먼저 스스로 코드를 써 본 다음</b> 제목을 눌러 풀이를 펼쳐라. ' +
        '숫자는 모두 이 페이지가 계산한 값이니, 네 결과와 다르면 어느 쪽이 틀렸는지 따져 보면 된다.' }));

      /* ① 환자별 평균으로 정규화 */
      var rowMeanK = ND.reduce(data, { op: 'mean', axis: 1, keepdims: true });
      var norm = ND.ops.sub(data, rowMeanK);
      var normRowMeanMax = 0;
      (function () {
        var v = ivals(ND.mean(norm, 1)), i;

      })();

      root.appendChild(UI.fold(
        '① 각 환자의 평균을 0으로 맞추기 (정규화) — data - data.mean(axis=1, keepdims=True)',
        el('div', null, [
          el('p', { html:
            '환자마다 체질이 달라 기준선이 다르다면, 각자의 평균을 빼서 <b>변화만</b> 남기는 것이 공정하다. ' +
            '먼저 <code>keepdims</code> 없이 해 보면 왜 필요한지 알 수 있다.' }),
          UI.code('data - data.mean(axis=1)      # 이게 될까?'),
          tryBlock(function () { return UI.out(ND.format(ND.ops.sub(data, ND.mean(data, 1)))); }),
          el('p', { html:
            '<code>data.mean(axis=1)</code> 의 shape 는 ' + ND.shapeStr(ND.mean(data, 1).shape) + ' 다. ' +
            '브로드캐스팅은 shape 를 <b>오른쪽부터</b> 맞추므로 (' + nP + ',) 는 (1, ' + nP + ') 로 취급된다. ' +
            '그러면 열 개수가 ' + nD + ' 대 ' + nP + ' 로 어긋나 실패한다(7장).' }),
          UI.code(
            'rm = data.mean(axis=1, keepdims=True)   # shape ' + ND.shapeStr(rowMeanK.shape) + '\n' +
            'norm = data - rm                        # (' + nP + ', ' + nD + ') - (' + nP + ', 1)\n' +
            'print(rm.shape, norm.shape)'),
          UI.out(ND.shapeStr(rowMeanK.shape) + ' ' + ND.shapeStr(norm.shape)),
          el('p', { html:
            '<code>keepdims=True</code> 가 축을 <b>길이 1로 남겨</b> ' + ND.shapeStr(rowMeanK.shape) + ' 를 만든다. ' +
            '길이 1인 축은 브로드캐스팅이 늘려 주므로 각 행에 그 행의 평균이 빠진다.' }),
          el('p', { class: 'small', html:
            '0번 환자의 정규화 결과. 음수(평균보다 낮은 날)와 양수(높은 날)로 갈린다.' }),
          rowGrid(norm.idx('0'), {
            cellSize: 34,
            highlight: function (idx, v) { return v >= 0 ? 'r' : 'dim'; },
            label: function (idx, v) { return fx(v, 1); }
          }),
          UI.code('print(np.abs(norm.mean(axis=1)).max())   # 모든 행의 평균이 0인가?'),
          UI.out(String(normRowMeanMax)),
          UI.callout('tip',
            '정확히 0 이 아니라 ' + normRowMeanMax.toExponential(2) + ' 같은 아주 작은 수가 나온다. ' +
            '실수를 2진수로 저장하는 컴퓨터에서는 이 정도 오차가 정상이다. ' +
            '<b>부동소수점 값을 <code>== 0</code> 으로 비교하지 마라.</b> ' +
            '<code>np.allclose(norm.mean(axis=1), 0)</code> 처럼 "충분히 가까운가"를 물어야 한다.')
        ])
      ));

      /* ② 심한 환자 세기 */
      var any15 = ND.any(ND.ops.ge(data, 15), 1);
      var n15p = sc(ND.sum(any15));
      var nCell15 = sc(ND.sum(ND.ops.ge(data, 15)));
      var nMax20 = sc(ND.sum(ND.ops.eq(patMax, gMax)));
      var noneOver = ivals(ND.whereIdx(ND.ops.not(any15)));

      root.appendChild(UI.fold(
        '② 염증이 15 이상 기록된 환자는 몇 명인가? 최댓값이 20인 환자는?',
        el('div', null, [
          UI.code(
            'mask = data >= 15                  # (' + nP + ', ' + nD + ') 불리언 배열\n' +
            'print(mask.sum())                  # 15 이상인 칸의 개수\n' +
            'print(mask.any(axis=1).sum())      # 그런 날이 한 번이라도 있는 환자 수\n' +
            'print((data.max(axis=1) == 20).sum())   # 최댓값이 20인 환자 수'),
          UI.out(String(nCell15) + '\n' + String(n15p) + '\n' + String(nMax20)),
          el('p', { html:
            '<b>불리언 배열의 <code>sum()</code> 은 True 의 개수</b>다(True=1, False=0). ' +
            '<code>any(axis=1)</code> 을 먼저 걸면 "환자 단위"로 줄어들어 ' + nP + '명 중 <b>' + n15p + '명</b>이 남는다. ' +
            'axis 를 빼고 <code>mask.sum()</code> 만 하면 칸 개수 ' + nCell15 + ' 가 나와 질문과 다른 답이 된다.' }),
          UI.code('print(np.where(~(data >= 15).any(axis=1))[0])   # 15 이상이 한 번도 없던 환자'),
          UI.out(ND.format(ND.whereIdx(ND.ops.not(any15)))),
          el('p', { html:
            (noneOver.length === 1
              ? '단 한 명(' + noneOver[0] + '번 환자)만 40일 동안 15 이상을 기록하지 않았다. '
              : noneOver.length + '명이 15 이상을 기록하지 않았다. ') +
            '전체 최댓값 ' + py(gMax) + ' 을 찍은 환자는 ' + nMax20 + '명(' + top20.join(', ') + ')이다. ' +
            '<b>"심한 환자"의 기준을 무엇으로 잡느냐에 따라 답이 달라진다</b>는 것이 요점이다.' })
        ])
      ));

      /* ③ 앞 20일 vs 뒤 20일 */
      var half = Math.floor(nD / 2);
      var firstH = data.idx(':, 0:' + half), secondH = data.idx(':, ' + half + ':' + nD);
      var m1 = sc(ND.mean(firstH)), m2 = sc(ND.mean(secondH));

      root.appendChild(UI.fold(
        '③ 앞 ' + half + '일과 뒤 ' + half + '일의 평균을 비교하라 (np.hsplit 또는 슬라이싱)',
        el('div', null, [
          UI.code(
            'first, second = np.hsplit(data, 2)     # 열을 반으로 쪼갠다\n' +
            '# 슬라이싱으로 똑같이:\n' +
            'first  = data[:, :' + half + ']\n' +
            'second = data[:, ' + half + ':]\n' +
            'print(first.shape, second.shape)\n' +
            'print(first.mean(), second.mean())'),
          UI.out(
            ND.shapeStr(firstH.shape) + ' ' + ND.shapeStr(secondH.shape) + '\n' +
            String(m1) + ' ' + String(m2)),
          el('p', { html:
            '뒤 ' + half + '일 평균(' + fx(m2, 4) + ')이 앞 ' + half + '일(' + fx(m1, 4) + ')보다 ' +
            fx(m2 - m1, 4) + ' 만큼 높다. 차이가 작아서 "뒤쪽이 더 심하다"고 말하기 어렵다 — ' +
            '<b>정점(day ' + peakDay + ')이 뒤쪽 구간의 맨 앞에 걸려 있기 때문</b>이다. ' +
            '구간을 어디서 자르느냐가 결론을 바꾼다는 뜻이고, 이런 자르기는 항상 근거를 밝혀야 한다.' }),
          UI.callout('tip',
            '<code>np.hsplit(data, 2)</code> 는 <b>사본이 아니라 뷰</b>를 준다. ' +
            '쪼갠 조각을 고치면 원본이 바뀐다. 안전하게 만지려면 <code>.copy()</code> 를 붙여라.')
        ])
      ));

      /* ④ 환자별 평균의 분포 */
      var pmMin = Math.min.apply(null, patMeanV), pmMax = Math.max.apply(null, patMeanV);
      var binW = 0.25;
      var lo = Math.floor(pmMin / binW) * binW, hi = Math.ceil(pmMax / binW) * binW;
      var nb = Math.round((hi - lo) / binW);
      var counts = new Array(nb);
      (function () {
        var i, b;
        for (i = 0; i < nb; i++) counts[i] = 0;
        for (i = 0; i < patMeanV.length; i++) {
          b = Math.floor((patMeanV[i] - lo) / binW);
          if (b < 0) b = 0;
          if (b >= nb) b = nb - 1;
          counts[b]++;
        }
      })();
      var histText = (function () {
        var lines = [], i;
        lines.push(padR('구간', 14) + '│ 환자 수');
        lines.push('──────────────┼' + '──────────────────────');
        for (i = 0; i < nb; i++) {
          lines.push(padL(fx(lo + i * binW, 2), 5) + ' ~ ' + padL(fx(lo + (i + 1) * binW, 2), 5) +
            ' │ ' + padR(bar(counts[i]), 18) + padL(counts[i], 2) + '명');
        }
        return lines.join('\n');
      })();
      var meanOfMeans = sc(ND.mean(patMean));

      root.appendChild(UI.fold(
        '④ 환자별 평균은 어떻게 흩어져 있나? (히스토그램)',
        el('div', null, [
          UI.code(
            'pm = data.mean(axis=1)          # 환자별 40일 평균, shape (' + nP + ',)\n' +
            'print(pm.min(), pm.max())\n' +
            'print(pm.mean(), data.mean())   # 두 값이 같은 이유를 생각해 보라\n' +
            'counts, edges = np.histogram(pm, bins=np.arange(' + fx(lo, 2) + ', ' +
              fx(hi + binW, 2) + ', ' + binW + '))'),
          UI.out(
            String(pmMin) + ' ' + String(pmMax) + '\n' +
            String(meanOfMeans) + ' ' + String(gMean)),
          UI.ascii(histText),
          el('p', { html:
            '환자 ' + nP + '명의 평균이 <b>' + fx(pmMin, 3) + ' ~ ' + fx(pmMax, 3) +
            '</b> 안에만 들어 있다. 개인차라기엔 너무 좁다 — 10.2 에서 얻은 "합성 데이터" 심증을 하나 더 뒷받침한다. ' +
            '그리고 <code>pm.mean()</code> 과 <code>data.mean()</code> 이 같은 이유는 ' +
            '<b>모든 환자의 관측 일수가 똑같이 ' + nD + '일</b>이기 때문이다. ' +
            '환자마다 일수가 달랐다면 "평균의 평균"은 전체 평균과 달라진다.' }),
          UI.callout('ver',
            '실제 데이터라면 결측치가 섞여 있다. NumPy 에서 결측치는 <code>np.nan</code> 으로 표시하고 ' +
            '<code>np.nanmean</code>·<code>np.nanmax</code> 처럼 nan 을 건너뛰는 함수를 쓴다. ' +
            '이때 <b>NumPy 2.0 에서 <code>np.NaN</code>, <code>np.Inf</code>, <code>np.float_</code>, ' +

<script>
/* ===== webapp/src/modules/ch11-playground.js ===== */
/* ===========================================================================
 * ch11-playground.js — 11장 "코드 실습실"
 *
 * 학생이 직접 파이썬 비슷한 코드를 써서 돌려 보는 장이다. 두 탭으로 구성한다.
 *   탭 1: 브라우저 안 미니 엔진 위에서 도는 "제한된 파이썬 표현식 평가기".
 *         재귀 하강 파서를 직접 짰다(eval/new Function 없음). 인터넷 없이 항상 동작.
 *   탭 2: 버튼을 눌렀을 때만 Pyodide 를 CDN 에서 불러와 진짜 NumPy 를 돌린다.
 *         지연 로딩 + 실패 시 안내. 탭 1 은 이 기능과 무관하게 항상 동작한다.
 *
 * 화면의 숫자는 전부 이 파일의 평가기가 그 자리에서 계산한 값이다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el, D = window.LabData;

  /* =======================================================================
   * 0. 공용 값 표현
   *   ND 인스턴스 · JS number(파이썬 int) · {__float__} 래퍼(파이썬 float) ·
   *   JS boolean(True/False) · null(None) · JS string · {__pytype} 래퍼(list/tuple) ·
   *   {__dtypeval}(dtype) · {__call}(호출 가능한 값 — np 함수/메서드/print)
   * ===================================================================== */

  function PGErr(msg, pyType) {
    this.message = msg;
    this.pyType = pyType || null;
    this.unsupported = false;
  }
  PGErr.prototype = Object.create(Error.prototype);

  function unsupported(desc) {
    var e = new PGErr('지원하지 않는 문법이다: ' + desc);
    e.unsupported = true;
    throw e;
  }
  function nameError(name) {
    throw new PGErr("name '" + name + "' is not defined", 'NameError');
  }

  function mkFloat(x) { return { __float__: true, value: x }; }
  function isFloatVal(v) { return !!(v && typeof v === 'object' && v.__float__ === true); }
  function PyList(items) { return { __pytype: 'list', items: items }; }
  function PyTuple(items) { return { __pytype: 'tuple', items: items }; }
  function isListOrTuple(v) { return !!(v && typeof v === 'object' && (v.__pytype === 'list' || v.__pytype === 'tuple')); }
  function mkDtype(name) { return { __dtypeval: true, name: name }; }
  function makeCallable(fn, label) { return { __call: fn, __label: label }; }

  /* ---------------------------------------------------- 파이썬 스타일 표기 */

  function fmtPyFloat(x) {
    if (isNaN(x)) return 'nan';
    if (!isFinite(x)) return x > 0 ? 'inf' : '-inf';
    if (Number.isInteger(x)) return x.toFixed(1);
    return String(x);
  }

  function pyRepr(v) {
    if (v === null || v === undefined) return 'None';
    if (v === true) return 'True';
    if (v === false) return 'False';
    if (isFloatVal(v)) return fmtPyFloat(v.value);
    if (typeof v === 'number') return String(Math.trunc(v));
    if (typeof v === 'string') return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
    if (v instanceof ND.ND) return ND.format(v, { mode: 'repr' });
    if (v && v.__dtypeval) return "dtype('" + v.name + "')";
    if (isListOrTuple(v)) {
      var inner = v.items.map(pyRepr).join(', ');
      if (v.__pytype === 'tuple') return v.items.length === 1 ? '(' + inner + ',)' : '(' + inner + ')';
      return '[' + inner + ']';
    }
    if (v && typeof v.__call === 'function') return '<built-in function ' + (v.__label || '?') + '>';
    return String(v);
  }
  function pyStr(v) {
    if (typeof v === 'string') return v;
    if (v instanceof ND.ND) return ND.format(v);
    return pyRepr(v);
  }

  /* =======================================================================
   * 1. 토크나이저
   * ===================================================================== */

  var TWO_CHAR_OPS = ['**', '//', '==', '!=', '<=', '>='];

  function tokenizeLine(line) {
    var toks = [], i = 0, n = line.length;
    while (i < n) {
      var c = line[i];
      if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
      if (c >= '0' && c <= '9') {

      't = np.arange(24).reshape(2, 3, 4)',
      ''
    ].join('\n');
  }

  function runPyCode(pyodide, code) {
    var lines = code.replace(/\r\n/g, '\n').split('\n');
    while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
    var last = lines.length ? lines[lines.length - 1] : '';
    var rest = lines.slice(0, -1).join('\n');
    var wrapped = [
      'import sys, io, json',
      '_buf = io.StringIO()',
      '_old_stdout = sys.stdout',
      'sys.stdout = _buf',
      '_err = None',
      'try:',
      '    _rest_src = ' + JSON.stringify(rest),
      '    _last_src = ' + JSON.stringify(last),
      '    if _rest_src.strip():',
      '        exec(compile(_rest_src, "<cell>", "exec"))',
      '    if _last_src.strip():',
      '        exec(compile(_last_src, "<cell-last>", "single"))',
      'except Exception as e:',
      '    _err = type(e).__name__ + ": " + str(e)',
      'finally:',
      '    sys.stdout = _old_stdout',
      'json.dumps({"out": _buf.getvalue(), "err": _err})'
    ].join('\n');
    var resultStr = pyodide.runPython(wrapped);
    return JSON.parse(resultStr);
  }

        '<code>?</code> 를 붙이거나(<code>np.sum?</code>), 괄호 안에서 <b>Shift+Tab</b> 을 누르면 그 자리에서 ' +
        '문서가 뜬다.'
    }));

    /* ---------------------------------------------------------- 확인 문제 */

    root.appendChild(el('h2', { class: 'h-sec', text: '확인 문제' }));
    root.appendChild(UI.quiz([
      {
        q: '<code>a = np.arange(12).reshape(3,4)</code> 일 때, <code>np.shares_memory(a, a[0:2])</code> 의 결과는?',
        choices: [
          '<code>True</code> — 슬라이싱은 뷰(view)라서 메모리를 공유한다',
          '<code>False</code> — 슬라이싱은 항상 새 배열(사본)을 만든다',
          '<code>True</code> 지만 reshape 를 거쳤기 때문에 우연히 겹친 것이다'
        ],
        answer: 0,
        explain: '슬라이싱은 원본과 같은 버퍼를 다른 shape·strides·offset 으로 보는 <b>뷰</b>다. reshape 도 연속(contiguous)이면 뷰이므로 a 자체도 뷰이고, 그 슬라이스 역시 같은 메모리를 가리킨다.'
      },
      {
        q: '관절염 데이터 <code>data</code> 의 shape 는 (60, 40) 이다. <code>data.mean(axis=1)</code> 의 shape 는?',
        choices: ['<code>(40,)</code>', '<code>(60,)</code>', '<code>(60, 40)</code>'],
        answer: 1,
        explain: 'axis=1(날짜 축)이 사라지고 그 축을 따라 평균이 계산된다. 남는 축은 axis=0(환자), 그래서 shape 는 (60,) — "환자마다 40일 평균 하나".'
      },
      {
        q: '<code>np.round(np.array([2.5]))</code> 의 결과는?',
        choices: [
          '<code>array([3.])</code> — 0.5 는 항상 올림한다',
          "<code>array([2.])</code> — 은행가 반올림(banker's rounding)으로 짝수 쪽에 붙는다",
          '<code>array([2])</code> — 정수 dtype 으로 바뀐다'
        ],
        answer: 1,
        explain: "NumPy 의 np.round 는 가장 가까운 짝수로 반올림하는 은행가 반올림을 쓴다. 2.5 는 2와 3의 중간인데 짝수인 2 로, 1.5 도 짝수인 2 로 간다. dtype 은 float64 그대로 유지된다."
      },
      {
        q: '<code>a[a > 5]</code> 의 결과에 대한 설명으로 옳은 것은?',
        choices: [
          'a 와 같은 shape 을 갖고, 조건을 깬 자리는 0 으로 채운 배열',
          '조건을 만족한 값만 모은 <b>1차원 사본</b> — 원본 shape 정보는 사라진다',
          '조건을 만족한 위치의 인덱스로 이루어진 튜플'
        ],
        answer: 1,
        explain: '불리언 마스크 인덱싱은 조건이 참인 원소만 순서대로 뽑아 <b>항상 1차원 사본</b>으로 돌려준다. 원본과 메모리를 공유하지 않고, 원래 몇 행 몇 열이었는지도 결과에는 남지 않는다.'
      }
    ], { id: 'playground' }));
  }

  Lab.register({
    id: 'playground',
    n: '11',
    title: '코드 실습실',
    blurb: '브라우저 안 미니 엔진으로 파이썬 비슷한 코드를 직접 돌려 보고, 원한다면 Pyodide 로 진짜 NumPy 와 대조한다.',
    sim: '표현식 평가기(재귀 하강 파서) · Pyodide 실제 NumPy 실행',
    render: render
  });
})();

</script>
