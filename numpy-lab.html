<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NumPy Lab — 과학고 NumPy 심화 학습</title>
<meta name="description" content="브라우저에서 도는 미니 NumPy 엔진과 시뮬레이터로 배우는 NumPy 심화 학습 실습장.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3Enp%3C/text%3E%3C/svg%3E">
<!--
  NumPy Lab 단일 파일 배포본 — 모든 CSS/JS 가 인라인되어 있다.
  서버 없이 더블클릭으로 열린다. 학생에게 이 파일만 주면 된다.
  자동 생성물이다. 고치려면 webapp/src/ 를 고치고 npm run build 를 실행하라.
-->
<style>
/* ===== webapp/src/theme.css ===== */
/* ===========================================================================
 * theme.css — NumPy Lab 디자인 시스템
 * 팔레트는 검증된 기준 팔레트를 그대로 쓴다(validate_palette.js 라이트/다크 전항목 통과).
 * 라이트 모드에서 aqua(#1baf7a)·yellow(#eda100)는 대비 3:1 미만이므로
 * 반드시 셀 안에 보이는 숫자 라벨을 함께 렌더한다(relief rule).
 * =========================================================================== */

:root {
  color-scheme: light;

  /* 표면 */
  --page:        #f9f9f7;
  --surface:     #fcfcfb;
  --surface-2:   #f2f2ee;
  --surface-3:   #e9e9e3;

  /* 잉크 */
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --ink-muted:   #898781;
  --grid-line:   #e1e0d9;
  --axis:        #c3c2b7;
  --border:      rgba(11, 11, 11, 0.10);
  --border-2:    rgba(11, 11, 11, 0.18);

  /* 카테고리 (identity) — 검증된 순서 */
  --s1: #2a78d6;  /* blue    — A 배열 / 주 계열 */
  --s2: #eb6834;  /* orange  — B 배열 */
  --s3: #1baf7a;  /* aqua    — 결과 */
  --s4: #eda100;  /* yellow  — 강조 축 */
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #4a3aa7;
  --s8: #e34948;

  /* 상태 (state) — 절대 계열색으로 쓰지 않는다 */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --success-text: #006300;

  /* 순차 램프 (magnitude) — 파랑 단일 색조 */
  --seq-100: #cde2fb; --seq-150: #b7d3f6; --seq-200: #9ec5f4; --seq-250: #86b6ef;
  --seq-300: #6da7ec; --seq-350: #5598e7; --seq-400: #3987e5; --seq-450: #2a78d6;
  --seq-500: #256abf; --seq-550: #1c5cab; --seq-600: #184f95; --seq-650: #104281;
  --seq-700: #0d366b;

  /* 계열색의 옅은 배경(칸 채우기용) */
  --s1-wash: rgba(42, 120, 214, 0.14);
  --s2-wash: rgba(235, 104, 52, 0.14);
  --s3-wash: rgba(27, 175, 122, 0.16);
  --s4-wash: rgba(237, 161, 0, 0.18);
  --crit-wash: rgba(208, 59, 59, 0.14);

  --radius:    10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 14px rgba(11,11,11,.05);

  --font: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "D2Coding", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #232322;
    --surface-3: #2c2c2a;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --grid-line: #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255, 255, 255, 0.10);
    --border-2:  rgba(255, 255, 255, 0.18);

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --success-text: #0ca30c;

    --s1-wash: rgba(57, 135, 229, 0.22);
    --s2-wash: rgba(217, 89, 38, 0.22);
    --s3-wash: rgba(25, 158, 112, 0.24);
    --s4-wash: rgba(201, 133, 0, 0.26);
    --crit-wash: rgba(208, 59, 59, 0.22);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page:      #0d0d0d;
  --surface:   #1a1a19;
  --surface-2: #232322;
  --surface-3: #2c2c2a;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --ink-muted: #898781;
  --grid-line: #2c2c2a;
  --axis:      #383835;
  --border:    rgba(255, 255, 255, 0.10);
  --border-2:  rgba(255, 255, 255, 0.18);

  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --success-text: #0ca30c;

  --s1-wash: rgba(57, 135, 229, 0.22);
  --s2-wash: rgba(217, 89, 38, 0.22);
  --s3-wash: rgba(25, 158, 112, 0.24);
  --s4-wash: rgba(201, 133, 0, 0.26);
  --crit-wash: rgba(208, 59, 59, 0.22);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
}

/* ------------------------------------------------------------------ 리셋 */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--page);
  color: var(--ink);
  font-size: 15.5px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { line-height: 1.35; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 0.9em; }
a { color: var(--s1); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; font-size: inherit; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }

/* --------------------------------------------------------------- 타이포 */

.h-chapter {
  font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.15rem);
  margin: 0 0 .2em;
}
.h-sec  { font-size: 1.32rem; margin: 2.6em 0 .7em; }
.h-sub  { font-size: 1.06rem; margin: 1.9em 0 .5em; color: var(--ink); }
.lede   { color: var(--ink-2); font-size: 1.03rem; margin-bottom: 1.6em; }
.muted  { color: var(--ink-muted); }
.small  { font-size: .875rem; }
.mono   { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
code:not(pre code) {
  font-family: var(--mono);
  font-size: .89em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .08em .38em;
  white-space: nowrap;
}

/* ---------------------------------------------------------------- 코드 */

.code {
  font-family: var(--mono);
  font-size: .875rem;
  line-height: 1.62;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--s1);
  border-radius: var(--radius-sm);
  padding: .8em 1em;
  margin: 0 0 1em;
  overflow-x: auto;
  white-space: pre;
  tab-size: 4;
}
.code.out {
  border-left-color: var(--axis);
  color: var(--ink-2);
  background: transparent;
  border-style: dashed;
}
.code.err { border-left-color: var(--critical); background: var(--crit-wash); }
.tok-kw  { color: var(--s7); font-weight: 600; }
.tok-num { color: var(--s2); }
.tok-str { color: var(--s6); }
.tok-com { color: var(--ink-muted); font-style: italic; }
.tok-fn  { color: var(--s1); }
.tok-attr{ color: var(--s1); }
:root[data-theme="dark"] .tok-kw,
:root:where(:not([data-theme="light"])) .tok-kw { color: var(--s7); }

.out-label {
  font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-muted); margin: 0 0 .3em; font-weight: 600;
}

/* 코드 블록 + 복사 버튼 --------------------------------------------------- */

.codewrap { position: relative; margin: 0 0 1em; }
.codewrap > .code { margin: 0; padding-right: 5.2rem; }

.copy-btn {
  position: absolute; top: .38rem; right: .38rem; z-index: 2;
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink-2); border-radius: var(--radius-sm);
  padding: .16rem .5rem; cursor: pointer;
  font-size: .72rem; font-weight: 650; font-family: var(--font);
  line-height: 1.5; white-space: nowrap;
  opacity: .75; transition: opacity .12s, background .12s, color .12s, border-color .12s;
}
.copy-btn:hover { opacity: 1; border-color: var(--s1); color: var(--s1); }
.copy-btn.done {
  opacity: 1; background: rgba(12, 163, 12, .14);
  border-color: var(--good); color: var(--success-text);
}
.copy-btn.fail {
  opacity: 1; background: var(--crit-wash);
  border-color: var(--critical); color: var(--critical);
}
.code-tag {
  position: absolute; top: .5rem; right: 4.3rem; z-index: 2;
  font-size: .66rem; font-weight: 650; letter-spacing: .02em;
  color: var(--ink-muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px;
  padding: .06rem .42rem; white-space: nowrap;
}

/* 장 전체 코드 내려받기 줄 */
.code-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .6rem .85rem; margin: 1.6em 0 0;
}
.code-bar .cb-t { font-size: .88rem; font-weight: 650; }
.code-bar .cb-d { font-size: .8rem; color: var(--ink-muted); flex: 1 1 14rem; }

@media (max-width: 560px) {
  .code-tag { display: none; }
  .codewrap > .code { padding-right: 4rem; }
}

/* -------------------------------------------------------------- 카드/판 */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.15rem 1.3rem 1.3rem;
  margin: 1.5em 0;
  box-shadow: var(--shadow);
}
.card > .card-head {
  display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
  margin: 0 0 .3rem;
}
.card-title { font-weight: 650; font-size: 1.02rem; }
.card-kicker {
  font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--s1); background: var(--s1-wash);
  padding: .16em .5em; border-radius: 999px;
}
.card-note { color: var(--ink-2); font-size: .92rem; margin: 0 0 1rem; }

.callout {
  border-left: 3px solid var(--axis);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: .7rem .95rem;
  margin: 1.1em 0;
  font-size: .95rem;
}
.callout .callout-t {
  display: block; font-weight: 700; font-size: .8rem;
  letter-spacing: .03em; margin-bottom: .18em;
}
.callout.why      { border-left-color: var(--s1); }
.callout.why .callout-t { color: var(--s1); }
.callout.trap     { border-left-color: var(--critical); background: var(--crit-wash); }
.callout.trap .callout-t { color: var(--critical); }
.callout.tip      { border-left-color: var(--good); }
.callout.tip .callout-t { color: var(--success-text); }
.callout.ver      { border-left-color: var(--warning); }
.callout.ver .callout-t { color: var(--ink-2); }

/* -------------------------------------------------------------- 컨트롤 */

.controls {
  display: flex; flex-wrap: wrap; gap: .8rem 1.1rem;
  align-items: flex-end;
  padding: .75rem .9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 0 0 1.15rem;
}
.ctl { display: flex; flex-direction: column; gap: .28rem; }
.ctl > label {
  font-size: .74rem; font-weight: 650; letter-spacing: .04em;
  color: var(--ink-2); text-transform: uppercase;
}
.ctl input[type="text"], .ctl input[type="number"], .ctl select {
  font-family: var(--mono); font-size: .9rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  padding: .4rem .55rem; min-width: 5rem;
}
.ctl input[type="text"].wide { min-width: 15rem; }
.ctl input[type="range"] { width: 11rem; accent-color: var(--s1); }
.ctl .val { font-family: var(--mono); font-size: .82rem; color: var(--ink-2); }

.seg { display: inline-flex; background: var(--surface-3); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg > button {
  border: 0; background: transparent; color: var(--ink-2);
  padding: .32rem .68rem; border-radius: 4px; cursor: pointer;
  font-size: .85rem; font-weight: 600; font-family: var(--mono);
  white-space: nowrap;
}
.seg > button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg > button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.btn {
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink); border-radius: var(--radius-sm);
  padding: .4rem .8rem; cursor: pointer; font-weight: 600; font-size: .88rem;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip {
  font-family: var(--mono); font-size: .78rem;
  border: 1px solid var(--border-2); background: var(--surface);
  color: var(--ink-2); border-radius: 999px; padding: .2rem .6rem; cursor: pointer;
}
.chip:hover { border-color: var(--s1); color: var(--s1); }

/* ---------------------------------------------------------- 배열 그리드 */

.grid-wrap { overflow-x: auto; padding: 2px 0 6px; }
.gridv { display: inline-flex; flex-direction: column; gap: 3px; }
.gridv-row { display: flex; gap: 3px; }
.cell {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .82rem; font-variant-numeric: tabular-nums;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--ink);
  min-width: 2.1rem; height: 2.1rem; padding: 0 .3rem;
  transition: background .12s, border-color .12s, transform .12s;
  position: relative;
}
.cell.hl-a   { background: var(--s1-wash); border-color: var(--s1); color: var(--ink); font-weight: 650; }
.cell.hl-b   { background: var(--s2-wash); border-color: var(--s2); font-weight: 650; }
.cell.hl-r   { background: var(--s3-wash); border-color: var(--s3); font-weight: 650; }
.cell.hl-x   { background: var(--s4-wash); border-color: var(--s4); font-weight: 650; }
.cell.hl-err { background: var(--crit-wash); border-color: var(--critical); color: var(--critical); }
.cell.hl-dim { opacity: .32; }
.cell.hl-ghost { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, transparent 4px 8px); color: var(--ink-muted); border-style: dashed; }
.cell.pop { transform: scale(1.12); z-index: 2; }
.cell-idx {
  position: absolute; top: 1px; left: 3px;
  font-size: .55rem; color: var(--ink-muted); line-height: 1;
}
.axis-lab {
  font-family: var(--mono); font-size: .7rem; color: var(--ink-muted);
  display: flex; align-items: center; justify-content: center;
  min-width: 1.6rem; height: 2.1rem;
}
.layer { display: flex; flex-direction: column; gap: .25rem; }
.layer-t { font-family: var(--mono); font-size: .72rem; color: var(--ink-muted); }
.layers { display: flex; gap: 1.1rem; flex-wrap: wrap; }

.shape-badge {
  display: inline-flex; align-items: center; gap: .35rem;
  font-family: var(--mono); font-size: .82rem;
  background: var(--surface-3); border-radius: 999px; padding: .12rem .6rem;
  color: var(--ink-2);
}
.shape-badge b { color: var(--ink); font-weight: 650; }

.legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; margin: .7rem 0 0; font-size: .82rem; }
.legend-item { display: inline-flex; align-items: center; gap: .38rem; color: var(--ink-2); }
.legend-sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--border-2); flex: none; }

/* --------------------------------------------------------- 메모리 시각화 */

.membar { display: flex; flex-wrap: wrap; gap: 2px; margin: .4rem 0; }
.memcell {
  font-family: var(--mono); font-size: .7rem;
  min-width: 1.75rem; height: 1.55rem;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 3px; color: var(--ink-2); position: relative;
}
.memcell.used-a { background: var(--s1-wash); border-color: var(--s1); color: var(--ink); }
.memcell.used-b { background: var(--s2-wash); border-color: var(--s2); color: var(--ink); }
.memcell.used-ab {
  background: linear-gradient(135deg, var(--s1-wash) 50%, var(--s2-wash) 50%);
  border-color: var(--s7); color: var(--ink); font-weight: 650;
}

/* ---------------------------------------------------------------- 차트 */

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--grid-line); stroke-width: 1; }
.chart .axisline  { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-muted); font-size: 10.5px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.chart .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .crosshair { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
.chart .hit { fill: transparent; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 30;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); padding: .4rem .6rem;
  font-size: .8rem; font-family: var(--mono); white-space: nowrap;
  opacity: 0; transition: opacity .1s;
}
.tooltip.on { opacity: 1; }
.tooltip .tt-k { color: var(--ink-muted); }

.heat { display: grid; gap: 1px; }
.heat-c { width: 100%; aspect-ratio: 1; border-radius: 1px; }
.scalebar { display: flex; align-items: center; gap: .5rem; font-size: .78rem; color: var(--ink-2); margin-top: .6rem; }
.scalebar .ramp { display: flex; height: 10px; border-radius: 3px; overflow: hidden; width: 8rem; }
.scalebar .ramp > i { flex: 1; }

/* ---------------------------------------------------------------- 표 */

.tbl-wrap { overflow-x: auto; margin: 1em 0; }
table.tbl { border-collapse: collapse; font-size: .88rem; width: 100%; }
table.tbl th, table.tbl td {
  border-bottom: 1px solid var(--grid-line);
  padding: .42rem .6rem; text-align: left; vertical-align: top;
}
table.tbl th { color: var(--ink-2); font-weight: 650; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
table.tbl td.num, table.tbl th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl code { white-space: nowrap; }

/* ---------------------------------------------------------------- 퀴즈 */

.quiz { counter-reset: qn; }
.q { border-top: 1px solid var(--grid-line); padding: 1rem 0 .4rem; }
.q:first-child { border-top: 0; }
.q-stem { font-weight: 600; margin: 0 0 .6rem; }
.q-stem::before {
  counter-increment: qn; content: "Q" counter(qn) ". ";
  color: var(--s1); font-family: var(--mono);
}
.q-choices { display: flex; flex-direction: column; gap: .35rem; margin: 0 0 .5rem; }
.q-choice {
  display: flex; gap: .55rem; align-items: flex-start;
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: var(--radius-sm); padding: .45rem .7rem; cursor: pointer;
  font-size: .93rem; text-align: left; color: var(--ink);
}
.q-choice:hover { border-color: var(--s1); }
.q-choice .mk { font-family: var(--mono); color: var(--ink-muted); flex: none; font-weight: 700; }
.q-choice[data-state="right"] { border-color: var(--good); background: rgba(12,163,12,.12); }
.q-choice[data-state="wrong"] { border-color: var(--critical); background: var(--crit-wash); }
.q-choice[data-state="right"] .mk { color: var(--success-text); }
.q-choice[data-state="wrong"] .mk { color: var(--critical); }
.q-explain {
  font-size: .9rem; color: var(--ink-2);
  border-left: 3px solid var(--good); background: var(--surface-2);
  padding: .55rem .8rem; border-radius: var(--radius-sm); margin: .4rem 0 0;
}
.q-explain[hidden] { display: none; }

details.fold {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: .5rem .8rem; margin: 1em 0; background: var(--surface-2);
}
details.fold > summary { cursor: pointer; font-weight: 650; font-size: .92rem; color: var(--s1); }
details.fold[open] > summary { margin-bottom: .6rem; }

/* --------------------------------------------------------------- 배치 */

.stack-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; align-items: start; }
.stack-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; align-items: start; }
.flow { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: center; }
.flow .op { font-family: var(--mono); font-size: 1.3rem; color: var(--ink-muted); }
.panel-t { font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 .35rem; }
.panel-t.a { color: var(--s1); } .panel-t.b { color: var(--s2); } .panel-t.r { color: var(--s3); }
@media (max-width: 760px) {
  .stack-2, .stack-3 { grid-template-columns: 1fr; }
}

.stat-row { display: flex; flex-wrap: wrap; gap: .8rem; margin: 1em 0; }
.stat {
  flex: 1 1 8rem; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .65rem .85rem;
}
.stat .k { font-size: .74rem; color: var(--ink-muted); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.stat .v { font-size: 1.45rem; font-weight: 650; line-height: 1.25; }
.stat .sub { font-size: .78rem; color: var(--ink-muted); font-family: var(--mono); }

.steps { list-style: none; padding: 0; margin: 1em 0; counter-reset: st; }
.steps > li {
  position: relative; padding-left: 2.1rem; margin-bottom: .75rem;
  font-size: .95rem;
}
.steps > li::before {
  counter-increment: st; content: counter(st);
  position: absolute; left: 0; top: .12rem;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--s1-wash); color: var(--s1);
  display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 700; font-family: var(--mono);
}
.steps > li.done::before { background: rgba(12,163,12,.16); color: var(--success-text); content: "✓"; }
.steps > li.failed::before { background: var(--crit-wash); color: var(--critical); content: "✕"; }

.ascii {
  font-family: var(--mono); font-size: .8rem; line-height: 1.5;
  white-space: pre; overflow-x: auto; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: .7rem .9rem; margin: 1em 0;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}


/* ===== webapp/src/app.css ===== */
/* app.css — 셸 레이아웃 (사이드바 + 본문) */

.shell { display: flex; min-height: 100vh; }

/* ------------------------------------------------------------- 사이드바 */

.sidebar {
  width: 268px; flex: none;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand {
  padding: 1.1rem 1.2rem .75rem;
  border-bottom: 1px solid var(--border);
}
.brand .logo {
  display: flex; align-items: center; gap: .55rem;
  font-weight: 700; font-size: 1.06rem; letter-spacing: -0.01em;
}
.brand .logo .mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: var(--s1); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .78rem; font-weight: 700;
}
.brand .tag { font-size: .76rem; color: var(--ink-muted); margin-top: .15rem; }

.nav { flex: 1; overflow-y: auto; padding: .6rem .55rem 1.5rem; }
.nav-group { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); padding: .9rem .65rem .3rem; }
.nav a {
  display: flex; align-items: center; gap: .55rem;
  padding: .42rem .65rem; border-radius: var(--radius-sm);
  color: var(--ink-2); font-size: .9rem; text-decoration: none;
  line-height: 1.35;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.nav a.on { background: var(--s1-wash); color: var(--s1); font-weight: 650; }
.nav a .num {
  font-family: var(--mono); font-size: .74rem; color: var(--ink-muted);
  min-width: 1.1rem; flex: none; text-align: right;
}
.nav a.on .num { color: var(--s1); }
.nav a .dot {
  width: 6px; height: 6px; border-radius: 50%; flex: none; margin-left: auto;
  background: transparent;
}
.nav a .dot.seen { background: var(--axis); }
.nav a .dot.done { background: var(--good); }

.side-foot {
  border-top: 1px solid var(--border);
  padding: .7rem .9rem; display: flex; gap: .45rem; align-items: center; flex-wrap: wrap;
}
.side-foot .btn { padding: .28rem .6rem; font-size: .8rem; }
.prog-line { width: 100%; font-size: .74rem; color: var(--ink-muted); }
.prog-bar { height: 4px; background: var(--surface-3); border-radius: 999px; overflow: hidden; margin-top: .3rem; }
.prog-bar > i { display: block; height: 100%; background: var(--good); width: 0%; transition: width .3s; }

/* ---------------------------------------------------------------- 본문 */

.main { flex: 1; min-width: 0; }
.main-inner { max-width: 900px; margin: 0 auto; padding: 2.2rem 2rem 6rem; }
.crumb {
  font-size: .76rem; color: var(--ink-muted); font-weight: 650;
  letter-spacing: .06em; text-transform: uppercase; margin-bottom: .4rem;
}
.chapter-nav {

  margin-top: 3.5rem; padding-top: 1.2rem; border-top: 1px solid var(--grid-line);
}
.chapter-nav a {
  display: block; max-width: 46%; color: var(--ink-2); text-decoration: none;
  font-size: .9rem; padding: .6rem .9rem; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface);
}
.chapter-nav a:hover { border-color: var(--s1); color: var(--s1); text-decoration: none; }
.chapter-nav a .k { display: block; font-size: .7rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
.chapter-nav a.next { text-align: right; margin-left: auto; }

.topbar {
  display: none; position: sticky; top: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: .55rem .8rem; align-items: center; gap: .6rem;
}

.toc {
  position: fixed; right: 1.2rem; top: 2.4rem; width: 168px;
  font-size: .8rem; line-height: 1.5; color: var(--ink-muted);

  max-height: 70vh; overflow-y: auto;
}
.toc a { display: block; color: var(--ink-muted); padding: .16rem 0; text-decoration: none; }
.toc a:hover, .toc a.on { color: var(--s1); text-decoration: none; }
@media (max-width: 1320px) { .toc { display: none; } }

/* ------------------------------------------------------------ 모바일 */

@media (max-width: 900px) {
  .shell { flex-direction: column; }
  .topbar { display: flex; }
  .sidebar {
    position: fixed; z-index: 50; top: 0; left: 0; height: 100vh;

  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 45; }
  .scrim[hidden] { display: none; }
  .main-inner { padding: 1.3rem 1.1rem 4rem; }
}

.hero { padding: 1rem 0 .5rem; }
.hero h1 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 2.7rem); letter-spacing: -0.022em; }
.hero .sub { color: var(--ink-2); font-size: 1.06rem; max-width: 46rem; margin-top: .5rem; }

<noscript><p style="padding:2rem;font:15px system-ui,sans-serif">이 실습장은 자바스크립트가 필요하다.</p></noscript>
<script>
/* ===== webapp/src/core/nd.js ===== */
/* ===========================================================================
 * nd.js — 브라우저에서 도는 미니 NumPy 엔진
 * ---------------------------------------------------------------------------
 * 이 파일은 NumPy Lab의 모든 시뮬레이터가 올라서는 토대다.
 * 핵심 설계: NumPy와 똑같이 (buffer, shape, strides, offset) 4종 세트로
 * 배열을 모델링한다. 그래서 "뷰(view)는 같은 메모리를 다른 눈으로 보는 것",
 * "브로드캐스팅은 stride 0으로 늘리는 것"을 실제로 보여줄 수 있다.
 *
 * 전역: window.ND
 * 의존성 없음. 순수 스크립트(모듈 아님) — 빌드 시 그대로 인라인된다.
 * =========================================================================== */
(function (global) {
  'use strict';

  /* ---------------------------------------------------------------- dtype */

  var DTYPES = {
    int8:    { name: 'int8',    itemsize: 1, kind: 'i', min: -128, max: 127 },
    int16:   { name: 'int16',   itemsize: 2, kind: 'i', min: -32768, max: 32767 },
    int32:   { name: 'int32',   itemsize: 4, kind: 'i', min: -2147483648, max: 2147483647 },
    int64:   { name: 'int64',   itemsize: 8, kind: 'i', min: -9223372036854775808, max: 9223372036854775807 },
    uint8:   { name: 'uint8',   itemsize: 1, kind: 'u', min: 0, max: 255 },
    float32: { name: 'float32', itemsize: 4, kind: 'f' },
    float64: { name: 'float64', itemsize: 8, kind: 'f' },
    bool:    { name: 'bool',    itemsize: 1, kind: 'b' }
  };

  function dtypeInfo(dt) { return DTYPES[dt] || DTYPES.float64; }
  function isIntDtype(dt) { var k = dtypeInfo(dt).kind; return k === 'i' || k === 'u'; }
  function isFloatDtype(dt) { return dtypeInfo(dt).kind === 'f'; }

  /** 두 dtype을 연산할 때의 결과 dtype (NumPy 승격 규칙의 단순화 버전) */
  function promote(a, b) {
    if (a === b) return a;
    if (isFloatDtype(a) || isFloatDtype(b)) {
      if (a === 'float64' || b === 'float64') return 'float64';
      return 'float32';
    }
    if (a === 'bool') return b;
    if (b === 'bool') return a;
    // 정수끼리: 더 큰 쪽
    return dtypeInfo(a).itemsize >= dtypeInfo(b).itemsize ? a : b;
  }

  /** int dtype으로 값을 저장할 때의 랩어라운드(오버플로) 재현 */
  function castValue(v, dt) {
    var info = dtypeInfo(dt);
    if (info.kind === 'b') return v ? true : false;
    if (info.kind === 'f') return v;
    if (v === null || v === undefined) return 0;
    if (!isFinite(v)) return 0;
    var t = Math.trunc(v);
    if (dt === 'int64') return t; // JS 정밀도 한계 — 랩어라운드 재현 안 함
    var bits = info.itemsize * 8;
    var span = Math.pow(2, bits);
    var m = ((t % span) + span) % span;          // [0, span)
    if (info.kind === 'u') return m;
    return m >= span / 2 ? m - span : m;          // 부호 있는 정수로 접기
  }

  /* --------------------------------------------------------------- strides */

  function cStrides(shape) {
    var n = shape.length, s = new Array(n), acc = 1;
    for (var i = n - 1; i >= 0; i--) { s[i] = acc; acc *= shape[i]; }
    return s;
  }

  function fStrides(shape) {
    var n = shape.length, s = new Array(n), acc = 1;
    for (var i = 0; i < n; i++) { s[i] = acc; acc *= shape[i]; }
    return s;
  }

  function prod(a) { var p = 1; for (var i = 0; i < a.length; i++) p *= a[i]; return p; }

  /* -------------------------------------------------------------------- ND */

  /**
   * @param {Array} buf     공유 메모리(평평한 JS 배열)
   * @param {number[]} shape
   * @param {number[]} strides  원소 단위 보폭
   * @param {number} offset     buf 안에서의 시작 위치
   * @param {string} dtype
   * @param {ND|null} base      이 배열이 뷰라면 원본
   */
  function ND(buf, shape, strides, offset, dtype, base) {
    this.buf = buf;
    this.shape = shape.slice();
    this.strides = strides ? strides.slice() : cStrides(shape);
    this.offset = offset | 0;
    this.dtype = dtype || 'float64';
    this.base = base || null;
  }

  Object.defineProperties(ND.prototype, {
    ndim:     { get: function () { return this.shape.length; } },
    size:     { get: function () { return prod(this.shape); } },
    itemsize: { get: function () { return dtypeInfo(this.dtype).itemsize; } },
    nbytes:   { get: function () { return this.size * this.itemsize; } },
    T:        { get: function () { return this.transpose(); } }
  });

  /** 다차원 인덱스 → buf 위치 */
  ND.prototype.bufIndex = function (idx) {
    var p = this.offset;
    for (var i = 0; i < idx.length; i++) p += idx[i] * this.strides[i];
    return p;
  };

  ND.prototype.get = function (idx) {
    if (!Array.isArray(idx)) idx = Array.prototype.slice.call(arguments);
    return this.buf[this.bufIndex(idx)];
  };

  ND.prototype.set = function (idx, v) {
    this.buf[this.bufIndex(idx)] = castValue(v, this.dtype);
    return this;
  };

  /** C 순서 논리 인덱스 목록 (작은 배열 전용 — 시각화 목적) */
  ND.prototype.indices = function () {
    var out = [], sh = this.shape, n = sh.length;
    if (this.size === 0) return out;
    if (n === 0) return [[]];
    var idx = new Array(n).fill(0);
    while (true) {
      out.push(idx.slice());
      var k = n - 1;
      while (k >= 0) { idx[k]++; if (idx[k] < sh[k]) break; idx[k] = 0; k--; }
      if (k < 0) break;
    }
    return out;
  };

  /** C 순서 평평한 인덱스 → 다차원 인덱스 */
  ND.prototype.unravel = function (flat) {
    var sh = this.shape, n = sh.length, idx = new Array(n);
    for (var i = n - 1; i >= 0; i--) { idx[i] = flat % sh[i]; flat = Math.floor(flat / sh[i]); }
    return idx;
  };

  /** C 순서 평평한 값 배열 */
  ND.prototype.flatValues = function () {
    var self = this;
    return this.indices().map(function (i) { return self.get(i); });
  };

  /** buf 위치 목록 (메모리 시각화용) */
  ND.prototype.flatBufIndices = function () {
    var self = this;
    return this.indices().map(function (i) { return self.bufIndex(i); });
  };

  ND.prototype.toNested = function () {
    var self = this;
    if (this.ndim === 0) return this.buf[this.offset];
    function build(dim, prefix) {
      var out = [];
      for (var i = 0; i < self.shape[dim]; i++) {
        var idx = prefix.concat([i]);
        out.push(dim === self.ndim - 1 ? self.get(idx) : build(dim + 1, idx));
      }
      return out;
    }
    return build(0, []);
  };

  ND.prototype.isContiguous = function () {
    var want = cStrides(this.shape);
    for (var i = 0; i < this.shape.length; i++) {
      if (this.shape[i] === 1) continue;           // 크기 1 축의 보폭은 의미 없음
      if (this.strides[i] !== want[i]) return false;
    }
    return true;
  };

  ND.prototype.copy = function () {
    var vals = this.flatValues();
    return new ND(vals.slice(), this.shape, null, 0, this.dtype, null);
  };

  ND.prototype.astype = function (dt) {
    var vals = this.flatValues().map(function (v) { return castValue(v, dt); });
    return new ND(vals, this.shape, null, 0, dt, null);
  };

  /** 뷰인가? */
  ND.prototype.isView = function () { return this.base !== null; };

  /** 최종 원본 */
  ND.prototype.root = function () {
    var a = this;
    while (a.base) a = a.base;
    return a;
  };

  /**
   * reshape — 연속(contiguous)이면 뷰, 아니면 사본.
   * -1 은 한 번만 쓸 수 있다.
   */
  ND.prototype.reshape = function (shape) {
    if (!Array.isArray(shape)) shape = Array.prototype.slice.call(arguments);
    shape = shape.slice();
    var neg = -1, known = 1;
    for (var i = 0; i < shape.length; i++) {
      if (shape[i] === -1) {
        if (neg !== -1) throw new NDError("can only specify one unknown dimension");
        neg = i;
      } else {
        if (shape[i] < 0) throw new NDError("negative dimensions are not allowed");
        known *= shape[i];
      }
    }
    if (neg !== -1) {
      if (known === 0 || this.size % known !== 0) {
        throw new NDError("cannot reshape array of size " + this.size + " into shape " + shapeStr(shape));
      }
      shape[neg] = this.size / known;
    } else if (prod(shape) !== this.size) {
      throw new NDError("cannot reshape array of size " + this.size + " into shape " + shapeStr(shape));
    }
    if (this.isContiguous()) {
      return new ND(this.buf, shape, cStrides(shape), this.offset, this.dtype, this.base || this);
    }
    var c = this.copy();
    return new ND(c.buf, shape, cStrides(shape), 0, this.dtype, null);
  };

  /** ravel — 가능하면 뷰 */
  ND.prototype.ravel = function () { return this.reshape([this.size]); };

  /** flatten — 항상 사본 */
  ND.prototype.flatten = function () {
    var vals = this.flatValues();
    return new ND(vals, [this.size], null, 0, this.dtype, null);
  };

  /** transpose — 항상 뷰 */
  ND.prototype.transpose = function (axes) {
    var n = this.ndim, i;
    if (!axes) { axes = []; for (i = n - 1; i >= 0; i--) axes.push(i); }
    if (axes.length !== n) throw new NDError("axes don't match array");
    var sh = [], st = [];
    for (i = 0; i < n; i++) { sh.push(this.shape[axes[i]]); st.push(this.strides[axes[i]]); }
    return new ND(this.buf, sh, st, this.offset, this.dtype, this.base || this);
  };

  ND.prototype.swapaxes = function (a, b) {
    var axes = []; for (var i = 0; i < this.ndim; i++) axes.push(i);
    var t = axes[a]; axes[a] = axes[b]; axes[b] = t;
    return this.transpose(axes);
  };

  /**
   * 인덱싱/슬라이싱. spec 은 parseIndex()가 만들어 준다.
   *   {k:'i', v:n}            정수 → 축이 사라진다
   *   {k:'s', start,stop,step} 슬라이스 → 축이 남는다
   *   {k:'n'}                 np.newaxis / None → 축이 추가된다
   *   {k:'e'}                 ... (Ellipsis)
   * 반환: 항상 뷰
   */
  ND.prototype.index = function (spec) {
    var i, nInt = 0, hasEll = false;
    for (i = 0; i < spec.length; i++) {
      if (spec[i].k === 'i' || spec[i].k === 's') nInt++;
      if (spec[i].k === 'e') hasEll = true;
    }
    if (nInt > this.ndim) {
      throw new NDError("too many indices for array: array is " + this.ndim +
        "-dimensional, but " + nInt + " were indexed");
    }
    // Ellipsis 를 필요한 개수의 전체 슬라이스로 풀어 쓴다
    var expanded = [];
    for (i = 0; i < spec.length; i++) {
      if (spec[i].k === 'e') {
        var fill = this.ndim - nInt;
        for (var f = 0; f < fill; f++) expanded.push({ k: 's', start: null, stop: null, step: null });
      } else expanded.push(spec[i]);
    }

      try { ta.setSelectionRange(0, ta.value.length); } catch (e) { }
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error('이 브라우저에서는 자동 복사가 막혀 있다'));
    });
  }

  function copyText(text) {
    // 최신 API 가 있어도 실패할 수 있다(사용자 동작 없이 호출, 권한 정책 차단 등).
    // 그럴 때 예전 방식으로 한 번 더 시도해야 학생이 막히지 않는다.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () {
        return legacyCopy(text);
      });
    }
    return legacyCopy(text);
  }

  /** 주피터·Colab 에서만 되는 코드인가 (IDLE 에 붙여넣어도 실행되지 않는다) */
  var JUPYTER_ONLY = /(^|\n)\s*(!\s*pip|%{1,2}[a-zA-Z])|from\s+google\.colab|import\s+google\.colab|[\w)]\?\s*(#.*)?$/m;

  /** keras/tensorflow 처럼 따로 설치해야 하는 것 */
  var NEEDS_EXTRA = /\b(keras|tensorflow)\b/;

  /**
   * IDLE 에 붙여넣어 바로 돌릴 수 있게 다듬는다.
   * np. 를 쓰는데 import 가 없으면 붙여 준다.
   */
  function toRunnable(raw) {
    var out = raw;
    if (/\bnp\./.test(out) && !/^\s*import\s+numpy/m.test(out)) {
      out = 'import numpy as np\n\n' + out;
    }
    if (/\bplt\./.test(out) && !/^\s*import\s+matplotlib/m.test(out)) {
      out = out.replace(/^(import numpy as np\n\n)?/,
        '$1import matplotlib.pyplot as plt\n\n');
    }
    return out;
  }

  /**
   * 파이썬 코드 블록. 오른쪽 위에 복사 버튼이 붙는다.
   * opts.copy === false 로 끄면 <pre> 하나만 돌려준다.
   */
  function code(src, opts) {
    opts = opts || {};
    var raw = String(src).replace(/\s+$/, '');
    var pre = el('pre', {
      class: 'code' + (opts.class ? ' ' + opts.class : ''),
      html: highlightPy(raw)
    });
    if (opts.copy === false) return pre;

    // lang:'shell' → 파이썬이 아니라 명령 프롬프트에 칠 명령이다
    var shell = opts.lang === 'shell';
    var jupyterOnly = !shell && JUPYTER_ONLY.test(raw);
    var extra = !shell && NEEDS_EXTRA.test(raw);
    var payload = (shell || jupyterOnly) ? raw : toRunnable(raw);

    var btn = el('button', {
      class: 'copy-btn', type: 'button',
      title: jupyterOnly
        ? '이 코드는 주피터·Colab 전용이다. 그래도 복사할 수 있다.'
        : 'IDLE 편집창에 붙여넣어 바로 실행할 수 있게 복사한다',
      text: '복사',
      onclick: function () {
        copyText(payload).then(function () {
          btn.textContent = '복사됨';
          btn.classList.add('done');
          setTimeout(function () { btn.textContent = '복사'; btn.classList.remove('done'); }, 1400);
        }, function (e) {
          // 자동 복사가 막힌 경우(창에 포커스가 없거나 권한 정책) — 코드를 대신
          // 선택해 준다. 학생은 Ctrl+C 만 누르면 된다.
          try {
            var sel = window.getSelection();
            var rng = document.createRange();
            rng.selectNodeContents(pre);
            sel.removeAllRanges();
            sel.addRange(rng);
            btn.textContent = 'Ctrl+C';
            btn.title = '자동 복사가 막혀 있다(' + e.message + '). 코드를 선택해 두었으니 Ctrl+C 를 누르라.';
          } catch (e2) {
            btn.textContent = '실패';
            btn.title = e.message + ' — 코드를 직접 선택해 Ctrl+C 로 복사하라';
          }
          btn.classList.add('fail');
          setTimeout(function () { btn.textContent = '복사'; btn.classList.remove('fail'); }, 3000);
        });
      }
    });

    var wrap = el('div', { class: 'codewrap' }, [pre, btn]);
    if (shell) {
      wrap.appendChild(el('span', { class: 'code-tag', text: '명령 프롬프트' }));
    } else if (jupyterOnly) {
      wrap.appendChild(el('span', { class: 'code-tag', text: '주피터·Colab 전용' }));
    } else if (extra) {
      wrap.appendChild(el('span', { class: 'code-tag', text: '별도 설치 필요' }));
    }
    // 장 전체 코드 모으기(app.js)가 읽는 값
    wrap.__raw = raw;
    wrap.__payload = payload;
    wrap.__jupyterOnly = jupyterOnly;
    wrap.__needsExtra = extra;
    wrap.__notPython = shell;
    return wrap;
  }

  /** 출력 블록 (라벨 + 점선 테두리) */
  function out(text, opts) {
    opts = opts || {};
    var body = el('pre', { class: 'code out', text: String(text) });
    if (opts.label === false) return body;
    return el('div', null, [
      el('div', { class: 'out-label', text: opts.label || '출력' }),
      body
    ]);
  }

  /** 파이썬 예외처럼 보이는 에러 블록 */
  function errBlock(msg, kind) {
    var label = kind || (ND ? ND.errLabel(msg) : 'ValueError');
    return el('pre', {
      class: 'code err',
      html: '<span class="tok-kw">' + esc(label) + '</span>: ' + esc(msg)
    });
  }

  /* ----------------------------------------------------------- 배열 그리드 */

  var HL = { a: 'hl-a', b: 'hl-b', r: 'hl-r', x: 'hl-x', err: 'hl-err', dim: 'hl-dim', ghost: 'hl-ghost' };

  /**
   * ND 배열을 셀 격자로 그린다. 0~3차원 지원.
   * opts = {
   *   highlight(idx, val) -> 'a'|'b'|'r'|'x'|'err'|'dim'|'ghost'|null
   *   label(idx, val) -> string        (기본: 값)
   *   showIndex: bool                 (셀 좌상단에 인덱스 표시)
   *   axisLabels: bool                (행/열 번호 머리글)
   *   onHover(idx, val, ev)
   *   onClick(idx, val, ev)
   *   cellSize: px (기본 auto)
   *   title: string
   * }
   */
  function grid(a, opts) {
    opts = opts || {};
    var wrap = el('div', { class: 'grid-wrap' });
    if (a.ndim === 0) {
      var v = a.toNested();
      wrap.appendChild(el('div', { class: 'gridv' }, [
        el('div', { class: 'gridv-row' }, [cellFor(a, [], v, opts)])
      ]));
      return wrap;
    }
    if (a.ndim === 3) {
      var layers = el('div', { class: 'layers' });
      for (var L = 0; L < a.shape[0]; L++) {
        var sub = a.index([{ k: 'i', v: L }]);
        var subOpts = Object.create(opts);
        subOpts.highlight = opts.highlight ? wrapIdx(opts.highlight, L) : null;
        subOpts.label = opts.label ? wrapIdx(opts.label, L) : null;
        subOpts.onHover = opts.onHover ? wrapIdx3(opts.onHover, L) : null;
        subOpts.onClick = opts.onClick ? wrapIdx3(opts.onClick, L) : null;
        layers.appendChild(el('div', { class: 'layer' }, [
          el('div', { class: 'layer-t', text: (opts.layerLabel ? opts.layerLabel(L) : '[' + L + ']') }),
          grid2(sub, subOpts)
        ]));
      }
      wrap.appendChild(layers);
      return wrap;
    }
    wrap.appendChild(grid2(a, opts));
    return wrap;
  }

  function wrapIdx(fn, L) { return function (idx, val) { return fn([L].concat(idx), val); }; }
  function wrapIdx3(fn, L) { return function (idx, val, ev) { return fn([L].concat(idx), val, ev); }; }

  function grid2(a, opts) {
    var is1D = a.ndim === 1;
    var rows = is1D ? 1 : a.shape[0];
    var cols = is1D ? a.shape[0] : a.shape[1];
    var g = el('div', { class: 'gridv' });

    if (opts.axisLabels) {
      var head = el('div', { class: 'gridv-row' });
      if (!is1D) head.appendChild(el('div', { class: 'axis-lab' }));
      for (var c0 = 0; c0 < cols; c0++) head.appendChild(el('div', { class: 'axis-lab', text: c0 }));
      g.appendChild(head);
    }

    for (var r = 0; r < rows; r++) {
      var row = el('div', { class: 'gridv-row' });
      if (opts.axisLabels && !is1D) row.appendChild(el('div', { class: 'axis-lab', text: r }));
      else if (opts.axisLabels && is1D) row.appendChild(el('div', { class: 'axis-lab' }));
      for (var c = 0; c < cols; c++) {
        var idx = is1D ? [c] : [r, c];
        row.appendChild(cellFor(a, idx, a.get(idx), opts));
      }
      g.appendChild(row);
    }
    return g;
  }

  function cellFor(a, idx, val, opts) {
    var cls = 'cell';
    if (opts.highlight) { var h = opts.highlight(idx, val); if (h && HL[h]) cls += ' ' + HL[h]; }
    var txt = opts.label ? opts.label(idx, val) : fmtCell(val, a.dtype);
    var attrs = { class: cls, text: txt };
    if (opts.cellSize) attrs.style = { minWidth: opts.cellSize + 'px', height: opts.cellSize + 'px' };
    var e = el('div', attrs);
    if (opts.showIndex) e.appendChild(el('span', { class: 'cell-idx', text: idx.join(',') }));
    if (opts.onHover) {
      e.addEventListener('mouseenter', function (ev) { opts.onHover(idx, val, ev); });
      e.addEventListener('mouseleave', function (ev) { opts.onHover(null, null, ev); });
    }
    if (opts.onClick) { e.style.cursor = 'pointer'; e.addEventListener('click', function (ev) { opts.onClick(idx, val, ev); }); }
    return e;
  }

  function fmtCell(v, dtype) {
    if (typeof v === 'boolean') return v ? 'T' : 'F';
    if (dtype === 'bool') return v ? 'T' : 'F';
    if (v === null || v === undefined) return '';
    if (!isFinite(v)) return isNaN(v) ? 'nan' : (v > 0 ? 'inf' : '-inf');
    if (Number.isInteger(v)) return String(v);
    return (Math.abs(v) < 1000 ? v.toFixed(2) : v.toExponential(1));
  }

  /** shape 배지 */
  function shapeBadge(a, extra) {
    var sh = Array.isArray(a) ? a : a.shape;
    var kids = [el('span', { class: 'muted', text: 'shape' }), el('b', { text: ND.shapeStr(sh) })];
    if (!Array.isArray(a)) {
      kids.push(el('span', { class: 'muted', text: '· ndim ' }));
      kids.push(el('b', { text: a.ndim }));
      kids.push(el('span', { class: 'muted', text: '· size ' }));
      kids.push(el('b', { text: a.size }));
      if (extra !== false) {
        kids.push(el('span', { class: 'muted', text: '· ' }));
        kids.push(el('b', { text: a.dtype }));
      }
    }
    return el('span', { class: 'shape-badge' }, kids);
  }

  function legend(items) {
    return el('div', { class: 'legend' }, items.map(function (it) {
      return el('span', { class: 'legend-item' }, [
        el('span', { class: 'legend-sw', style: { background: it.color } }),
        it.label
      ]);
    }));
  }

  /* -------------------------------------------------------- 카드 / 콜아웃 */

  function card(o) {
    var head = el('div', { class: 'card-head' }, [
      o.kicker ? el('span', { class: 'card-kicker', text: o.kicker }) : null,
      el('span', { class: 'card-title', text: o.title || '' })
    ]);
    var c = el('div', { class: 'card' + (o.class ? ' ' + o.class : '') }, [head]);
    if (o.note) c.appendChild(el('div', { class: 'card-note', html: o.note }));
    append(c, o.body);
    return c;
  }

  var CALLOUT_T = { why: '왜 그런가', trap: '흔한 실수', tip: '알아두기', ver: 'NumPy 버전 주의' };

  function callout(kind, html, title) {
    return el('div', { class: 'callout ' + kind }, [
      el('span', { class: 'callout-t', text: title || CALLOUT_T[kind] || '' }),
      el('span', { html: html })
    ]);
  }

  function fold(summary, body) {
    return el('details', { class: 'fold' }, [el('summary', { text: summary }), body]);
  }

  function ascii(text) { return el('pre', { class: 'ascii', text: text }); }

  function steps(items) {
    return el('ol', { class: 'steps' }, items.map(function (s) {
      if (typeof s === 'string') return el('li', { html: s });
      return el('li', { class: s.state || '', html: s.html });
    }));
  }

  function statRow(stats) {
    return el('div', { class: 'stat-row' }, stats.map(function (s) {
      return el('div', { class: 'stat' }, [
        el('div', { class: 'k', text: s.k }),
        el('div', { class: 'v', text: s.v }),
        s.sub ? el('div', { class: 'sub', text: s.sub }) : null
      ]);
    }));
  }

  /** 표. cols: [{k, label, num?}] */
  function table(cols, rows, opts) {
    opts = opts || {};
    var thead = el('thead', null, [el('tr', null, cols.map(function (c) {
      return el('th', { class: c.num ? 'num' : '', text: c.label });
    }))]);
    var tbody = el('tbody', null, rows.map(function (r) {
      return el('tr', null, cols.map(function (c) {
        var v = r[c.k];
        var td = el('td', { class: c.num ? 'num' : '' });
        if (v && v.nodeType) td.appendChild(v);
        else td.innerHTML = (c.raw ? String(v == null ? '' : v) : esc(v == null ? '' : v));
        return td;
      }));
    }));
    return el('div', { class: 'tbl-wrap' }, [el('table', { class: 'tbl' }, [thead, tbody])]);
  }

  /* ------------------------------------------------------------- 컨트롤 */

  function controls(items) { return el('div', { class: 'controls' }, items); }

  function slider(o) {
    var valLab = el('span', { class: 'val', text: o.format ? o.format(o.value) : o.value });
    var input = el('input', {
      type: 'range', min: o.min, max: o.max, step: o.step || 1, value: o.value,
      oninput: function () {
        var v = parseFloat(input.value);
        valLab.textContent = o.format ? o.format(v) : v;
        o.onChange(v);
      }
    });
    var wrap = el('div', { class: 'ctl' }, [
      el('label', null, [o.label, ' ', valLab]), input
    ]);
    wrap.setValue = function (v) { input.value = v; valLab.textContent = o.format ? o.format(v) : v; };
    return wrap;
  }

  function select(o) {
    var sel = el('select', {
      onchange: function () { o.onChange(sel.value); }
    }, o.options.map(function (op) {
      var val = (typeof op === 'string') ? op : op.value;
      var lab = (typeof op === 'string') ? op : op.label;
      return el('option', { value: val, selected: String(val) === String(o.value) ? true : null, text: lab });
    }));
    var w = el('div', { class: 'ctl' }, [el('label', { text: o.label }), sel]);
    w.setValue = function (v) { sel.value = v; };
    w.getValue = function () { return sel.value; };
    return w;
  }

  function textInput(o) {
    var inp = el('input', {
      type: 'text', value: o.value || '', placeholder: o.placeholder || '',
      class: o.wide ? 'wide' : '',
      oninput: function () { o.onChange(inp.value); },
      onkeydown: function (e) { if (e.key === 'Enter' && o.onEnter) o.onEnter(inp.value); }
    });
    var w = el('div', { class: 'ctl' }, [o.label ? el('label', { text: o.label }) : null, inp]);
    w.setValue = function (v) { inp.value = v; if (o.onChange) o.onChange(v); };
    w.focus = function () { inp.focus(); };
    return w;
  }

  /** 세그먼트 버튼(탭). options: [{value,label}] 또는 문자열 배열 */
  function seg(o) {
    var cur = o.value;
    var btns = o.options.map(function (op) {
      var val = (typeof op === 'string') ? op : op.value;
      var lab = (typeof op === 'string') ? op : op.label;
      return el('button', {
        type: 'button', 'aria-pressed': String(val) === String(cur) ? 'true' : 'false',
        text: lab, title: (op && op.title) || null,
        onclick: function () { set(val); o.onChange(val); }
      });
    });
    var box = el('div', { class: 'seg', role: 'group' }, btns);
    function set(val) {
      cur = val;
      btns.forEach(function (b, i) {
        var v = (typeof o.options[i] === 'string') ? o.options[i] : o.options[i].value;
        b.setAttribute('aria-pressed', String(v) === String(val) ? 'true' : 'false');
      });
    }
    var w = el('div', { class: 'ctl' }, [o.label ? el('label', { text: o.label }) : null, box]);
    w.setValue = set;
    return w;
  }

  function chips(items, onPick) {
    return el('div', { class: 'chips' }, items.map(function (t) {
      var val = (typeof t === 'string') ? t : t.value;
      var lab = (typeof t === 'string') ? t : t.label;
      return el('button', { class: 'chip', type: 'button', text: lab, onclick: function () { onPick(val); } });
    }));
  }

  function btn(label, onClick, o) {
    o = o || {};
    return el('button', {
      class: 'btn' + (o.primary ? ' primary' : ''), type: 'button', text: label, onclick: onClick
    });
  }

  /* --------------------------------------------------------------- 퀴즈 */

  /**
   * quiz([{ q, choices:[...], answer: idx, explain }], {id})
   * localStorage 에 정답 여부를 저장한다.
   */
  function quiz(items, o) {
    o = o || {};
    var box = el('div', { class: 'quiz' });
    items.forEach(function (it, qi) {
      var explain = el('div', { class: 'q-explain', hidden: true, html: it.explain || '' });
      var choiceEls = it.choices.map(function (ch, ci) {
        return el('button', {
          class: 'q-choice', type: 'button',
          onclick: function () {
            choiceEls.forEach(function (e, i) {
              e.setAttribute('data-state', i === it.answer ? 'right' : (i === ci ? 'wrong' : ''));
            });
            explain.hidden = false;
            if (o.id) progress.mark(o.id + ':q' + qi, ci === it.answer);
          }
        }, [
          el('span', { class: 'mk', text: 'ABCDE'[ci] }),
          el('span', { html: ch })
        ]);
      });
      box.appendChild(el('div', { class: 'q' }, [
        el('div', { class: 'q-stem', html: it.q }),
        el('div', { class: 'q-choices' }, choiceEls),
        explain
      ]));
    });
    return box;
  }

  /* ----------------------------------------------------- 메모리 시각화 */

  /**
   * 버퍼(메모리)를 칸으로 그린다. 뷰 vs 사본 실험실의 핵심 위젯.
   * marks: {index -> 'a'|'b'|'ab'}
   */
  function memBar(buf, marks, opts) {
    opts = opts || {};
    var bar = el('div', { class: 'membar' });
    for (var i = 0; i < buf.length; i++) {
      var m = marks ? marks[i] : null;
      bar.appendChild(el('div', {
        class: 'memcell' + (m ? ' used-' + m : ''),
        text: fmtCell(buf[i], opts.dtype || 'int64'),
        title: 'buf[' + i + ']'
      }));
    }
    return bar;
  }

  /** 배열 두 개가 공유하는 메모리를 표시 */
  function memShare(a, b, labels) {
    var root = a.root();
    var marks = {};
    a.flatBufIndices().forEach(function (i) { marks[i] = 'a'; });
    b.flatBufIndices().forEach(function (i) { marks[i] = marks[i] === 'a' ? 'ab' : 'b'; });
    var shared = ND.sharesMemory(a, b);
    return el('div', null, [
      memBar(root.buf, marks, { dtype: a.dtype }),
      legend([
        { color: 'var(--s1)', label: (labels && labels[0]) || 'a 가 보는 칸' },
        { color: 'var(--s2)', label: (labels && labels[1]) || 'b 가 보는 칸' },
        { color: 'var(--s7)', label: '둘 다 보는 칸 (공유)' }
      ]),
      el('p', { class: 'small', style: { marginTop: '.6rem', color: shared ? 'var(--s7)' : 'var(--ink-muted)' },
        html: shared
          ? '<b>np.shares_memory(a, b) → True</b> — 같은 메모리다. 한쪽을 고치면 다른 쪽도 바뀐다.'
          : '<b>np.shares_memory(a, b) → False</b> — 서로 다른 메모리다. 독립적이다.' })
    ]);
  }

  /* ----------------------------------------------------------- 툴팁 */

  function tipLayer(host) {
    var t = el('div', { class: 'tooltip' });
    host.style.position = host.style.position || 'relative';
    host.appendChild(t);
    return {
      show: function (html, x, y) {
        t.innerHTML = html; t.classList.add('on');
        var w = t.offsetWidth, h = t.offsetHeight, hw = host.clientWidth;
        var left = Math.min(Math.max(x - w / 2, 2), Math.max(hw - w - 2, 2));
        t.style.left = left + 'px';
        t.style.top = Math.max(y - h - 10, 2) + 'px';
      },
      hide: function () { t.classList.remove('on'); }
    };
  }

  /* ----------------------------------------------------------- 선 그래프 */

  var SERIES_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

  /**
   * lineChart({series:[{name, values:[...], color?}], x:[...], xLabel, yLabel,
   *            height, yMin, yMax, markMax:bool, tableView:bool, fmtY})
   * 크로스헤어 + 툴팁 기본 제공. 2개 이상 계열이면 범례를 항상 넣는다.

  function lineChart(o) {

    ]));

    var tiles = el('div', { class: 'tiles' });
