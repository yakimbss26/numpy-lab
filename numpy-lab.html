<script>
/* ===== webapp/src/modules/ch04-reshape.js ===== */
/* ===========================================================================
 * ch04-reshape.js — 4장. 배열의 모양 바꾸기와 뷰
 * 노트북 셀 32~45 대응. 이 장의 진짜 주제는 "뷰(view)"다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el;

  /* ========================================================== 작은 헬퍼들 */

  /** 오른쪽 정렬 패딩 (아스키 그림 정렬용) */
  function pad(s, w) {
    s = String(s);
    while (s.length < w) s = ' ' + s;
    return s;
  }

  /** idx · strides 내적 — 평평한 위치 계산 */
  function dotIdx(idx, st) {
    var s = 0;
    for (var i = 0; i < idx.length; i++) s += idx[i] * st[i];
    return s;
  }

  /** C 순서 평평한 인덱스 → 다차원 인덱스 */
  function unravelC(q, shape) {
    var n = shape.length, idx = new Array(n);
    for (var i = n - 1; i >= 0; i--) { idx[i] = q % shape[i]; q = Math.floor(q / shape[i]); }
    return idx;
  }

  /** 배열을 F 순서(열 우선)로 읽는다. 값과 "원본 C 평평한 인덱스"를 함께 돌려준다. */
  function fOrderRead(a) {
    var sh = a.shape, n = sh.length, total = a.size;
    var cs = ND.cStrides(sh);
    var vals = [], orig = [];
    for (var p = 0; p < total; p++) {
      var rem = p, idx = new Array(n), k;
      for (k = 0; k < n; k++) { idx[k] = rem % sh[k]; rem = Math.floor(rem / sh[k]); }
      vals.push(a.get(idx));
      orig.push(dotIdx(idx, cs));
    }
    return { vals: vals, orig: orig };
  }

  /** C 순서로 읽기 (값 + 원본 평평한 인덱스) */
  function cOrderRead(a) {
    var vals = a.flatValues();
    return { vals: vals, orig: vals.map(function (_, i) { return i; }) };
  }

  /** 목표 shape 문자열 파싱. "3, 8" / "(2,3,4)" / "-1, 6" */
  function parseShapeStr(s) {
    var t = String(s).trim().replace(/^\(|\)$/g, '').replace(/^\[|\]$/g, '');
    var parts = t.split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return x !== ''; });
    if (!parts.length) throw new Error('목표 shape 가 비었다. 정수를 콤마로 구분해 적어라. 예: 3, 8');
    return parts.map(function (x) {
      if (!/^-?\d+$/.test(x)) {
        throw new Error("'" + x + "' 는 정수가 아니다. shape 에는 정수만 쓴다. 예: 2, 3, 4");
      }
      return parseInt(x, 10);
    });
  }

  /** np.expand_dims */
  function expandDims(a, axis) {
    var sh = a.shape.slice();
    if (axis < 0) axis += sh.length + 1;
    sh.splice(axis, 0, 1);
    return a.reshape(sh);
  }

  /** np.squeeze (axis 생략 = 크기 1 인 축 전부 제거) */
  function squeeze(a, axis) {
    var sh;
    if (axis === undefined || axis === null) {
      sh = a.shape.filter(function (d) { return d !== 1; });
    } else {
      if (a.shape[axis] !== 1) {
        throw new ND.NDError('cannot select an axis to squeeze out which has size not equal to one');
      }
      sh = a.shape.slice(); sh.splice(axis, 1);
    }
    return a.reshape(sh);
  }

  /** a[[r0, r1, …]] — 행 팬시 인덱싱. 새 메모리에 값을 복사한다(NumPy 와 같다). */
  function rowGather(a, rows) {
    var nested = rows.map(function (r) {
      var row = [];
      for (var j = 0; j < a.shape[1]; j++) row.push(a.get([r, j]));
      return row;
    });
    return ND.array(nested, a.dtype);
  }

  /** 버퍼 한 줄을 아스키 상자로. 칸 폭 3 으로 고정해 정렬을 코드로 보장한다. */
  function asciiBuf(vals, marks) {
    var n = vals.length, top = '┌', mid = '│', bot = '└', pos = ' ', mk = ' ';
    for (var i = 0; i < n; i++) {
      var last = (i === n - 1);
      top += '───' + (last ? '┐' : '┬');
      mid += pad(vals[i], 3) + '│';
      bot += '───' + (last ? '┘' : '┴');
      pos += pad(i, 3) + ' ';
      mk += pad(marks && marks[i] ? '^' : '', 3) + ' ';
    }
    var lines = [top, mid, bot, pos];
    if (marks) lines.push(mk);
    return lines.join('\n');
  }

  function strTuple(arr) { return '(' + arr.join(', ') + ')'; }

  function panel(cls, title, kids) {
    return el('div', null, [el('div', { class: 'panel-t ' + cls, text: title })].concat(kids || []));
  }

  function markAll(n, m) {
    var o = {};
    for (var i = 0; i < n; i++) o[i] = m;
    return o;
  }

  /* ================================================== 4.1 reshape 시뮬레이터 */

  function reshapeSim() {
    var SRC = {
      a12: { label: 'arange(12)', decl: 'a = np.arange(12)', name: 'a',
             make: function () { return ND.arange(12); } },
      a24: { label: 'arange(24)', decl: 'a = np.arange(24)', name: 'a',
             make: function () { return ND.arange(24); } },
      a30: { label: 'arange(30)', decl: 'a = np.arange(30)', name: 'a',
             make: function () { return ND.arange(30); } },
      m:   { label: 'matrix (2,4)', name: 'matrix',
             decl: 'matrix = np.array([[1, 2, 5, 8],\n                   [1, 2, 5, 8]])',
             make: function () { return ND.array([[1, 2, 5, 8], [1, 2, 5, 8]]); } }
    };

    var st = { src: 'a24', shape: '3, 8', order: 'C', show: 'val', track: null };

    var host = el('div');

    var srcCtl = UI.seg({
      label: '원본 배열', value: st.src,
      options: [
        { value: 'a12', label: 'arange(12)' },
        { value: 'a24', label: 'arange(24)' },
        { value: 'a30', label: 'arange(30)' },
        { value: 'm', label: 'matrix (2,4)' }
      ],
      onChange: function (v) { st.src = v; st.track = null; rebuild(); }
    });

    var shapeCtl = UI.textInput({
      label: '목표 shape', value: st.shape, wide: true, placeholder: '3, 8',
      onChange: function (v) { st.shape = v; st.track = null; rebuild(); }
    });

    var orderCtl = UI.seg({
      label: '읽는 순서', value: st.order,
      options: [
        { value: 'C', label: 'C 순서만', title: 'NumPy 기본값' },
        { value: 'both', label: 'C · F 나란히' }
      ],
      onChange: function (v) { st.order = v; rebuild(); }
    });

    var showCtl = UI.seg({
      label: '칸에 쓸 것', value: st.show,
      options: [
        { value: 'val', label: '값' },
        { value: 'orig', label: '원본 평평한 인덱스' }
      ],
      onChange: function (v) { st.show = v; rebuild(); }
    });

    var PRESETS = [
      { value: 'm|8', label: 'matrix.reshape(8,)' },
      { value: 'm|-1, 2', label: 'matrix.reshape(-1, 2)' },
      { value: 'm|2, 2, 2', label: 'matrix.reshape(2, 2, 2)' },
      { value: 'm|-1, 3', label: 'matrix.reshape(-1, 3) ← 에러' },
      { value: 'a24|-1, 6', label: 'arange(24).reshape(-1, 6)' },
      { value: 'a24|2, 3, 4', label: 'arange(24).reshape(2, 3, 4)' },
      { value: 'a30|-1, 6', label: 'arange(30).reshape(-1, 6)' },
      { value: 'a24|-1, -1', label: 'arange(24).reshape(-1, -1) ← 에러' },
      { value: 'a12|5, 3', label: 'arange(12).reshape(5, 3) ← 에러' }
    ];
    var presetCtl = UI.chips(PRESETS, function (v) {
      var bits = v.split('|');
      st.src = bits[0]; st.track = null;
      srcCtl.setValue(bits[0]);
      shapeCtl.setValue(bits[1]);      // setValue 안에서 onChange → rebuild 가 돈다
    });

    /** 목표 shape 로 배치한 결과 격자 하나 만들기 */
    function resultBlock(src, shape, order, engineNd) {
      var read = order === 'F' ? fOrderRead(src) : cOrderRead(src);
      var cs = ND.cStrides(shape), fs = ND.fStrides(shape), total = ND.prod(shape);
      var vals = new Array(total), orig = new Array(total);
      for (var q = 0; q < total; q++) {
        var idx = unravelC(q, shape);
        var p = (order === 'F') ? dotIdx(idx, fs) : q;
        vals[q] = read.vals[p];
        orig[q] = read.orig[p];
      }
      var nd = engineNd || new ND.ND(vals, shape, null, 0, src.dtype, null);
      var originAt = function (idx) { return orig[dotIdx(idx, cs)]; };

      var body = [];
      var codeTxt = order === 'F'
        ? 'np.reshape(' + SRC[st.src].name + ', ' + strTuple(shape) + ", order='F')"
        : SRC[st.src].name + '.reshape(' + shape.join(', ') + ')';
      body.push(UI.code(codeTxt));
      body.push(UI.shapeBadge(nd));
      if (nd.ndim <= 3) {
        body.push(UI.grid(nd, {
          showIndex: true, cellSize: 36,
          layerLabel: function (L) { return '층 [' + L + ']'; },
          label: function (idx, val) {
            return st.show === 'orig' ? String(originAt(idx)) : UI.fmtCell(val, nd.dtype);
          },
          highlight: function (idx) { return originAt(idx) === st.track ? 'x' : 'r'; },
          onClick: function (idx) { st.track = originAt(idx); rebuild(); }
        }));
      } else {
        body.push(el('p', { class: 'small muted',
          text: '4차원 이상은 격자로 그리지 않는다. 아래는 print() 출력이다.' }));
        body.push(UI.out(ND.format(nd)));
      }
      return body;
    }

    function rebuild() {
      UI.clear(host);
      var src = SRC[st.src].make();
      var srcCs = ND.cStrides(src.shape);

      host.appendChild(UI.code(SRC[st.src].decl));

      host.appendChild(panel('a', '원본 — 파랑. 칸을 누르면 그 원소를 노랑으로 추적한다', [
        UI.shapeBadge(src),
        UI.grid(src, {
          showIndex: true, cellSize: 36,
          label: function (idx, val) {
            return st.show === 'orig' ? String(dotIdx(idx, srcCs)) : UI.fmtCell(val, src.dtype);
          },
          highlight: function (idx) { return dotIdx(idx, srcCs) === st.track ? 'x' : 'a'; },
          onClick: function (idx) { st.track = dotIdx(idx, srcCs); rebuild(); }
        })
      ]));

      // 목표 shape 읽기
      var target;
      try {
        target = parseShapeStr(st.shape);
      } catch (e) {
        host.appendChild(UI.errBlock(e.message, 'TypeError'));
        return;
      }

      // -1 자동 계산 설명
      var negs = target.filter(function (d) { return d === -1; }).length;
      if (negs === 1) {
        var known = 1, parts = [];
        target.forEach(function (d) { if (d !== -1) { known *= d; parts.push(String(d)); } });
        if (known > 0 && src.size % known === 0) {
          host.appendChild(UI.callout('why',
            'size ' + src.size + ' ÷ 지정한 ' + (parts.length ? parts.join(' × ') : '1') +
            ' = ' + (src.size / known) + ' → <b>-1 은 ' + (src.size / known) + ' 이 된다.</b> ' +
            '나머지 한 축의 크기는 size 로부터 유일하게 정해지므로 NumPy 가 대신 계산해 준다.',
            '-1 은 이렇게 정해진다'));
        }
      }

      // 실제 reshape (엔진이 계산한다)
      var res;
      try {
        res = src.reshape(target);
      } catch (e) {
        host.appendChild(UI.code(SRC[st.src].name + '.reshape(' + target.join(', ') + ')'));
        host.appendChild(UI.errBlock(e.message));
        var why;
        if (negs > 1) {
          why = '-1 은 "네가 계산해라" 라는 뜻이다. 두 곳에 쓰면 답이 하나로 정해지지 않으므로 ' +
                'NumPy 는 계산을 포기한다. -1 은 <b>한 번만</b> 쓸 수 있다.';
        } else if (negs === 1) {
          var kn = 1;
          target.forEach(function (d) { if (d !== -1) kn *= d; });
          why = 'size ' + src.size + ' 를 지정한 ' + kn + ' 으로 나누면 ' +
                (src.size / kn).toFixed(4).replace(/0+$/, '') + ' — 정수가 아니다. ' +
                '<b>size 가 나누어떨어지지 않으면 -1 도 소용없다.</b> ' +
                '(수업자료 셀 40 이 바로 이 에러다. 일부러 남겨 둔 예제다.)';
        } else {
          why = '원소 개수는 늘거나 줄지 않는다. ' + ND.shapeStr(target) + ' 은 원소 ' +
                ND.prod(target) + '개가 필요한데 원본은 ' + src.size + '개뿐이다. ' +
                '<b>reshape 의 유일한 조건은 size 가 같은 것</b>이다.';
        }
        host.appendChild(UI.callout('trap', why));
        return;
      }

      var shared = ND.sharesMemory(src, res);
      if (st.order === 'both') {
        host.appendChild(el('div', { class: 'stack-2' }, [
          panel('r', 'C 순서 (NumPy 기본)', resultBlock(src, res.shape, 'C', res)),
          panel('r', "F 순서 (order='F')", resultBlock(src, res.shape, 'F', null))
        ]));
        host.appendChild(UI.callout('why',
          '같은 목표 shape 인데 원소 배치가 다르다. reshape 는 메모리를 옮기지 않는다 — ' +
          '<b>원소를 어떤 순서로 읽고 어떤 순서로 채울지</b>만 바꾼다. ' +
          'C 순서는 마지막 축이 가장 빨리 변하고(행을 다 채우고 다음 행), ' +
          'F 순서는 첫 축이 가장 빨리 변한다(열을 다 채우고 다음 열). ' +
          '"칸에 쓸 것" 을 <b>원본 평평한 인덱스</b>로 바꿔 보면 읽는 순서가 바로 보인다.'));
      } else {
        host.appendChild(panel('r', '결과 — 초록', resultBlock(src, res.shape, 'C', res)));
      }

      host.appendChild(el('p', { class: 'small', html:
        'size 는 <b>' + src.size + ' → ' + res.size + '</b> 로 그대로다. ' +
        'np.shares_memory(' + SRC[st.src].name + ', 결과) → <b>' + (shared ? 'True' : 'False') +
        '</b> — ' + (shared
          ? 'reshape 는 값을 복사하지 않았다. 같은 메모리를 다른 모양으로 보는 <b>뷰</b>다.'
          : '원본이 연속(contiguous)이 아니어서 어쩔 수 없이 사본이 만들어졌다.') }));

      return;
    }

    rebuild();

    return UI.card({
      kicker: '시뮬레이터 ①',
      title: 'reshape 시뮬레이터',
      note: '목표 shape 를 직접 적어 보라. 칸을 누르면 그 원소를 <b>노랑</b>으로 추적한다 — ' +
            '어느 칸이 어디로 갔는지 눈으로 따라갈 수 있다. ' +
            '아래 칩은 수업 노트북 셀 33~41 과 셀 61 을 그대로 재현한 것이다.',
      body: [
        UI.controls([srcCtl, shapeCtl, orderCtl, showCtl]),
        presetCtl,
        host
      ]
    });
  }

  /* ============================================== 4.2 flatten 대응 시각화 */

  function flattenSim() {
    var m2 = ND.array([[[1, 2, 3, 4], [1, 2, 5, 8]],
                       [[1, 2, 3, 4], [1, 2, 5, 8]]]);
    var flat = m2.flatten();
    var cs = ND.cStrides(m2.shape);
    var st = { track: null, show: 'val' };

    var host = el('div');

    var showCtl = UI.seg({
      label: '칸에 쓸 것', value: st.show,
      options: [{ value: 'val', label: '값' }, { value: 'ord', label: 'flatten 순서' }],
      onChange: function (v) { st.show = v; rebuild(); }
    });

    function rebuild() {
      UI.clear(host);

      host.appendChild(panel('a', '원본 matrix2 — 층으로 펼쳐 그린 3차원 배열', [
        UI.shapeBadge(m2),
        UI.grid(m2, {
          cellSize: 38,
          layerLabel: function (L) { return 'matrix2[' + L + ']'; },
          label: function (idx, val) {
            return st.show === 'ord' ? String(dotIdx(idx, cs)) : UI.fmtCell(val, m2.dtype);
          },
          highlight: function (idx) { return dotIdx(idx, cs) === st.track ? 'x' : 'a'; },
          onClick: function (idx) { st.track = dotIdx(idx, cs); rebuild(); }
        })
      ]));

      host.appendChild(el('div', { class: 'flow', style: { margin: '.4rem 0' } }, [
        el('span', { class: 'op', text: '↓' }),
        el('span', { class: 'small muted',
          text: '층 [0] 의 0행 → 층 [0] 의 1행 → 층 [1] 의 0행 → 층 [1] 의 1행 (C 순서)' })
      ]));

      host.appendChild(panel('r', 'matrix2.flatten() — 1차원', [
        UI.shapeBadge(flat),
        UI.grid(flat, {
          cellSize: 38, showIndex: true,
          label: function (idx, val) {
            return st.show === 'ord' ? String(idx[0]) : UI.fmtCell(val, flat.dtype);
          },
          highlight: function (idx) { return idx[0] === st.track ? 'x' : 'r'; },
          onClick: function (idx) { st.track = idx[0]; rebuild(); }
        })
      ]));

      if (st.track !== null) {
        var src = unravelC(st.track, m2.shape);
        host.appendChild(el('p', { class: 'small', html:
          'matrix2[' + src.join('][') + '] = <b>' + m2.get(src) + '</b> 는 ' +
          'flatten 결과의 <b>' + st.track + '</b>번 칸으로 갔다. ' +
          '평평한 위치 = ' + src[0] + '×' + cs[0] + ' + ' + src[1] + '×' + cs[1] +
          ' + ' + src[2] + '×' + cs[2] + ' = ' + st.track + '.' }));
      } else {
        host.appendChild(el('p', { class: 'small muted',
          text: '아무 칸이나 눌러 보라. 대응하는 칸이 양쪽에서 노랑으로 켜진다.' }));
      }
    }

    rebuild();

    return UI.card({
      kicker: '시각화',
      title: 'flatten — 3차원이 1차원으로 펴지는 순서',
      note: '수업 셀 43~45 의 배열이다. shape 는 <b>' + ND.shapeStr(m2.shape) + '</b>, ndim <b>' +
            m2.ndim + '</b> 이므로 flatten 결과 길이는 8 이 아니라 <b>' + flat.size +
            '</b> 이다. 2×2×4 = ' + m2.size + ' 를 세어 보면 당연하다.',
      body: [UI.controls([showCtl]), host]
    });
  }

  /* ============================================ 4.3 뷰 vs 사본 실험실 */

  function viewLab() {
    var OPS = [
      { key: 'slice', code: 'a[0:2, 1:3]', kind: '슬라이싱',
        make: function (a) { return a.idx('0:2, 1:3'); } },
      { key: 'reshape', code: 'a.reshape(2, 6)', kind: 'reshape',
        make: function (a) { return a.reshape([2, 6]); } },
      { key: 'ravel', code: 'a.ravel()', kind: 'ravel',
        make: function (a) { return a.ravel(); } },
      { key: 'flatten', code: 'a.flatten()', kind: 'flatten',
        make: function (a) { return a.flatten(); } },
      { key: 'T', code: 'a.T', kind: '전치',
        make: function (a) { return a.T; } },
      { key: 'copy', code: 'a.copy()', kind: 'copy',
        make: function (a) { return a.copy(); } },
      { key: 'bool', code: 'a[a > 5]', kind: '불리언 인덱싱',
        make: function (a) { return ND.maskSelect(a, ND.ops.gt(a, 5)); } },
      { key: 'fancy', code: 'a[[0, 2]]', kind: '팬시 인덱싱',
        make: function (a) { return rowGather(a, [0, 2]); } },
      { key: 'astype', code: 'a.astype(float)', kind: 'astype',
        make: function (a) { return a.astype('float64'); } }
    ];

    function opOf(k) {
      for (var i = 0; i < OPS.length; i++) if (OPS[i].key === k) return OPS[i];
      return OPS[0];
    }

    var st = { key: 'slice', a: null, b: null, a0: null, poked: false };

    function fresh() {
      st.a = ND.arange(12).reshape([3, 4]);
      st.a0 = st.a.flatValues();
      st.b = opOf(st.key).make(st.a);
      st.poked = false;
    }

    var host = el('div');

    var opCtl = UI.select({
      label: 'b 를 만드는 연산', value: st.key,
      options: OPS.map(function (o) { return { value: o.key, label: 'b = ' + o.code }; }),
      onChange: function (v) { st.key = v; fresh(); rebuild(); }
    });

    function rebuild() {
      UI.clear(host);
      var a = st.a, b = st.b, op = opOf(st.key);
      var shared = ND.sharesMemory(a, b);
      var zeroIdx = new Array(b.ndim).fill(0);
      var bLabel = 'b[' + zeroIdx.join(', ') + ']';
      var aCs = ND.cStrides(a.shape);

      host.appendChild(UI.code('a = np.arange(12).reshape(3, 4)\nb = ' + op.code));

      /* (ㄱ) 두 격자 */
      host.appendChild(el('div', { class: 'stack-2' }, [
        panel('a', 'a — 원본 (3, 4)', [
          UI.shapeBadge(a),
          UI.grid(a, {
            cellSize: 36, showIndex: true,
            highlight: function (idx, val) {
              return val !== st.a0[dotIdx(idx, aCs)] ? 'err' : 'a';
            }
          })
        ]),
        panel('r', 'b — ' + op.code, [
          UI.shapeBadge(b),
          UI.grid(b, {
            cellSize: 36, showIndex: true,
            highlight: function (idx) {
              return (st.poked && dotIdx(idx, ND.cStrides(b.shape)) === 0) ? 'err' : 'r';
            }
          })
        ])
      ]));

      /* 999 버튼 */
      host.appendChild(el('div', { class: 'controls' }, [
        UI.btn(bLabel + ' = 999 실행', function () {
          st.b.set(zeroIdx, 999);
          st.poked = true;
          rebuild();
        }, { primary: true }),
        UI.btn('처음으로 되돌리기', function () { fresh(); rebuild(); })
      ]));

      if (st.poked) {
        var aChanged = a.flatValues().some(function (v, i) { return v !== st.a0[i]; });
        host.appendChild(UI.callout(aChanged ? 'trap' : 'tip',
          aChanged
            ? 'b 만 고쳤는데 <b>a 도 함께 바뀌었다</b>(빨간 칸). b 는 a 와 같은 메모리를 보는 ' +
              '<b>뷰</b>였기 때문이다. a 를 건드리지도 않았는데 값이 변했다 — ' +
              '이것이 초보자를 가장 많이 괴롭히는 버그다.'
            : 'b 를 고쳐도 <b>a 는 그대로다</b>. b 는 값을 새 메모리에 복사해 둔 ' +
              '<b>사본</b>이라서 서로 영향이 없다.'));
      }

      /* (ㄴ)(ㄷ) 메모리 */
      host.appendChild(el('h4', { class: 'panel-t', text: '메모리는 하나인가 둘인가' }));
      if (shared) {
        host.appendChild(UI.memShare(a, b, ['a 만 보는 칸', 'b 만 보는 칸']));
      } else {
        host.appendChild(el('div', { class: 'stack-2' }, [
          panel('a', 'a 의 메모리', [
            UI.memBar(a.root().buf, markAll(a.root().buf.length, 'a'), { dtype: a.dtype })
          ]),
          panel('b', 'b 의 메모리 (새로 복사됨)', [
            UI.memBar(b.buf, markAll(b.buf.length, 'b'), { dtype: b.dtype })
          ])
        ]));
        host.appendChild(el('p', { class: 'small', html:
          '<b>np.shares_memory(a, b) → False</b> — 버퍼가 두 개다. 완전히 독립적이다.' }));
      }

      /* (ㄹ)(ㅁ) 표 */
      var baseTxt;
      if (b.base === null) baseTxt = 'None ← 스스로 메모리를 가진 배열';
      else if (b.base === a) baseTxt = 'a';
      else if (b.base === a.root()) baseTxt = 'a 와 같은 원본(np.arange(12))';
      else baseTxt = '다른 배열';

      host.appendChild(UI.table(
        [{ k: 'k', label: '항목' }, { k: 'a', label: 'a' }, { k: 'b', label: 'b' }],
        [
          { k: 'shape', a: ND.shapeStr(a.shape), b: ND.shapeStr(b.shape) },
          { k: 'strides (원소 단위)', a: strTuple(a.strides), b: strTuple(b.strides) },
          { k: 'strides (바이트 — NumPy 표시)',
            a: strTuple(a.strides.map(function (s) { return s * a.itemsize; })),
            b: strTuple(b.strides.map(function (s) { return s * b.itemsize; })) },
          { k: 'offset (버퍼 시작 위치)', a: String(a.offset), b: String(b.offset) },
          { k: 'dtype', a: a.dtype, b: b.dtype },
          { k: 'C 연속(contiguous)인가', a: a.isContiguous() ? 'True' : 'False',
            b: b.isContiguous() ? 'True' : 'False' },
          { k: 'base', a: 'np.arange(12)', b: baseTxt },
          { k: 'np.shares_memory(a, b)', a: '—', b: shared ? 'True' : 'False' },
          { k: '판정', a: '—', b: shared ? '뷰 (view)' : '사본 (copy)' }
        ]
      ));
    }

    fresh();
    rebuild();

    /* 규칙 표 — 하드코딩이 아니라 아홉 연산을 실제로 돌려서 채운다 */
    var ruleRows = OPS.map(function (o) {
      var a = ND.arange(12).reshape([3, 4]);
      var b = o.make(a);
      var sh = ND.sharesMemory(a, b);
      return {
        c: o.code, k: o.kind, s: ND.shapeStr(b.shape),
        v: sh ? '뷰 — 원본과 같은 메모리' : '사본 — 새 메모리'
      };
    });

    return {
      card: UI.card({
        kicker: '시뮬레이터 ②',
        title: '뷰 vs 사본 실험실',
        note: '연산을 하나 고르고 <b>' + '아래 버튼' + '</b>을 눌러 b 의 첫 칸을 999 로 바꿔 보라. ' +
              'a 가 함께 바뀌는지 안 바뀌는지가 뷰와 사본의 차이다. ' +
              '이 장에서 딱 하나만 가져간다면 이것이다.',
        body: [UI.controls([opCtl]), host]
      }),
      rules: UI.table(
        [{ k: 'c', label: '연산' }, { k: 'k', label: '종류' },
         { k: 's', label: '결과 shape' }, { k: 'v', label: '뷰인가 사본인가' }],
        ruleRows
      )
    };
  }

  /* ================================================ 4.3 strides 주소 계산기 */

  function stridesSim() {
    var base = ND.arange(12).reshape([3, 4]);
    var VIEWS = {
      a: { label: 'a', code: 'a = np.arange(12).reshape(3, 4)', make: function () { return base; } },
      T: { label: 'a.T', code: 'v = a.T', make: function () { return base.T; } },
      sl: { label: 'a[0:2, 1:3]', code: 'v = a[0:2, 1:3]', make: function () { return base.idx('0:2, 1:3'); } },
      st: { label: 'a[::2, ::2]', code: 'v = a[::2, ::2]', make: function () { return base.idx('::2, ::2'); } }
    };
    var st = { which: 'a', idx: [0, 0] };
    var host = el('div');

    var whichCtl = UI.seg({
      label: '보는 창(뷰)', value: st.which,
      options: Object.keys(VIEWS).map(function (k) { return { value: k, label: VIEWS[k].label }; }),
      onChange: function (v) { st.which = v; st.idx = [0, 0]; rebuild(); }
    });

    function rebuild() {
      UI.clear(host);
      var v = VIEWS[st.which].make();
      if (st.idx[0] >= v.shape[0] || st.idx[1] >= v.shape[1]) st.idx = [0, 0];
      var i = st.idx[0], j = st.idx[1];
      var s0 = v.strides[0], s1 = v.strides[1];
      var posn = v.offset + i * s0 + j * s1;

      host.appendChild(UI.code(VIEWS[st.which].code));

      host.appendChild(panel('a', '이 창이 보는 값 — 칸을 눌러 보라', [
        UI.shapeBadge(v),
        UI.grid(v, {
          cellSize: 38, showIndex: true,
          highlight: function (idx) { return (idx[0] === i && idx[1] === j) ? 'x' : 'a'; },
          onClick: function (idx) { st.idx = idx.slice(); rebuild(); }
        })
      ]));

      var marks = {};
      v.flatBufIndices().forEach(function (p) { marks[p] = 'a'; });
      marks[posn] = 'b';
      host.appendChild(panel('b', '메모리(버퍼) — 파랑은 이 창이 보는 칸, 주황은 지금 고른 칸', [
        UI.memBar(base.root().buf, marks, { dtype: 'int64' })
      ]));

      // 실행할 코드가 아니라 위치 계산을 보여 주는 식이다 → 다이어그램으로 그린다
      host.appendChild(UI.ascii(
        '인덱스 [' + i + ', ' + j + '] 이 앉은 메모리 위치\n\n' +
        '  buf_pos = offset + i*strides[0] + j*strides[1]\n' +
        '          = ' + v.offset + ' + ' + i + '*' + s0 + ' + ' + j + '*' + s1 + '\n' +
        '          = ' + posn + '        →  buf[' + posn + '] = ' + base.root().buf[posn]));

      host.appendChild(UI.table(
        [{ k: 'k', label: '항목' }, { k: 'v', label: '값' }, { k: 'd', label: '뜻' }],
        [

            d: '그 축으로 한 칸 갈 때 메모리에서 몇 칸을 뛰는가' },
          { k: 'strides (바이트)', v: strTuple(v.strides.map(function (s) { return s * v.itemsize; })),
            d: 'NumPy 가 실제로 출력하는 값 — 원소 단위 × itemsize(' + v.itemsize + ')' },
          { k: 'offset', v: String(v.offset), d: '버퍼에서 몇 번째 칸부터 시작하는가' },
          { k: 'v.flags[\'C_CONTIGUOUS\']', v: v.isContiguous() ? 'True' : 'False',
            d: v.isContiguous() ? '메모리에 쭉 이어져 있다 → reshape 가 뷰로 된다'
                                : '건너뛰며 본다 → reshape 는 사본을 만들어야 한다' }
        ]
      ));
    }

    rebuild();

    return UI.card({
      kicker: '시뮬레이터 ③',
      title: 'strides 주소 계산기',
      note: '뷰가 마법이 아니라 <b>덧셈과 곱셈</b>이라는 것을 확인하는 도구다. ' +
            '창을 바꿔 보면 값은 그대로인데 (shape, strides, offset) 세 숫자만 달라진다.',
      body: [UI.controls([whichCtl]), host]
    });
  }

  /* ============================================ 4.4 축 추가·제거 시뮬레이터 */

  function axisSim() {

      { code: 'a.reshape(1, -1)', make: function (a) { return a.reshape([1, -1]); } },
      { code: 'a.reshape(-1, 1)', make: function (a) { return a.reshape([-1, 1]); } },
      { code: 'np.expand_dims(a, 0)', make: function (a) { return expandDims(a, 0); } },
      { code: 'np.expand_dims(a, 1)', make: function (a) { return expandDims(a, 1); } },

        ])

      body: [ctl, host]

  /* ======================================= 4.4 전치 vs reshape 추적 비교 */

  function transposeVsReshape() {
    var m = ND.arange(1, 7).reshape([2, 3]);
    var t = m.T;
    var r = m.reshape([3, 2]);
    var st = { track: null };
    var host = el('div');

    function gridOf(nd, kind) {
      return UI.grid(nd, {
        cellSize: 40, showIndex: true,
        highlight: function (idx, val) { return val === st.track ? 'x' : kind; },
        onClick: function (idx, val) { st.track = val; rebuild(); }
      });
    }

    function rebuild() {
      UI.clear(host);
      host.appendChild(el('div', { class: 'stack-3' }, [
        panel('a', 'a — shape (2, 3)', [gridOf(m, 'a')]),
        panel('r', 'a.T — shape (3, 2)', [gridOf(t, 'r')]),
        panel('r', 'a.reshape(3, 2) — shape (3, 2)', [gridOf(r, 'r')])
      ]));
      host.appendChild(el('p', { class: 'small muted',
        text: st.track === null
          ? '아무 칸이나 눌러 그 값이 세 격자에서 어디에 있는지 확인해 보라.'
          : '값 ' + st.track + ' 의 자리를 노랑으로 표시했다. .T 와 reshape 의 자리가 다르다.' }));
      host.appendChild(UI.table(
        [{ k: 'k', label: '' }, { k: 'v', label: 'print() 출력', raw: true }],
        [
          { k: 'a.T', v: '<pre class="code out" style="margin:0">' + UI.esc(ND.format(t)) + '</pre>' },
          { k: 'a.reshape(3, 2)', v: '<pre class="code out" style="margin:0">' + UI.esc(ND.format(r)) + '</pre>' }
        ]
      ));
      host.appendChild(el('p', { class: 'small', html:
        'shape 는 둘 다 (3, 2) 지만 <b>값의 배치가 다르다.</b> ' +
        '.T 의 strides 는 ' + strTuple(t.strides) + ' 로 a 의 ' + strTuple(m.strides) +
        ' 를 뒤집은 것이고(메모리는 그대로), ' +
        'reshape 는 메모리에 놓인 순서대로 다시 끊어 읽은 것이다. ' +
        'a.T 가 연속인가 → <b>' + (t.isContiguous() ? 'True' : 'False') + '</b>, ' +
        'a.reshape(3, 2) 가 연속인가 → <b>' + (r.isContiguous() ? 'True' : 'False') + '</b>.' }));
    }

    rebuild();

    return UI.card({
      kicker: '시뮬레이터 ⑤',
      title: '전치(.T) 와 reshape 는 다르다',
      note: '학생이 가장 많이 헷갈리는 지점이다. shape 가 같아도 결과가 같지 않다.',
      body: [host]
    });
  }

  function transpose3D() {
    var a = ND.arange(24).reshape([2, 3, 4]);
    var t = a.transpose([1, 0, 2]);
    var s = a.swapaxes(0, 1);
    var box = el('div');

    box.appendChild(UI.code(

      'np.swapaxes(a, 0, 1).shape   # ' + ND.shapeStr(s.shape) + '   # 같은 결과'));

    box.appendChild(panel('a', 'a — shape ' + ND.shapeStr(a.shape) + ' (층 2개 × 3행 × 4열)', [
      UI.grid(a, { cellSize: 32, layerLabel: function (L) { return 'a[' + L + ']'; } })
    ]));
    box.appendChild(panel('r', 'a.transpose(1, 0, 2) — shape ' + ND.shapeStr(t.shape) +
      ' (층 3개 × 2행 × 4열)', [
      UI.grid(t, {
        cellSize: 32, highlight: function () { return 'r'; },
        layerLabel: function (L) { return '[' + L + ']'; }
      })
    ]));
    box.appendChild(el('p', { class: 'small', html:
      'transpose(1, 0, 2) 는 "새 배열의 0번 축에는 원래 1번 축을, 1번 축에는 원래 0번 축을, ' +
      '2번 축에는 원래 2번 축을 놓아라" 는 뜻이다. 축 0 과 1 만 맞바꾼 것이므로 ' +
      '<code>np.swapaxes(a, 0, 1)</code> 와 결과가 같다. ' +
      'np.shares_memory(a, 결과) → <b>' + (ND.sharesMemory(a, t) ? 'True' : 'False') + '</b> ' +

      (t.isContiguous() ? 'True' : 'False') + '</b>).' }));
    return box;
  }

  /* ==================================================== ravel vs flatten 증명 */

  function ravelProof() {
    var a = ND.arange(6).reshape([2, 3]);
    var rv = a.ravel();
    var shareR = ND.sharesMemory(a, rv);
    rv.set([0], 999);
    var afterR = ND.format(a);

    var a2 = ND.arange(6).reshape([2, 3]);
    var fl = a2.flatten();
    var shareF = ND.sharesMemory(a2, fl);
    fl.set([0], 999);
    var afterF = ND.format(a2);

    var box = el('div');
    box.appendChild(el('div', { class: 'stack-2' }, [
      el('div', null, [
        UI.code('a = np.arange(6).reshape(2, 3)\n' +
                'r = a.ravel()\n' +
                'np.shares_memory(a, r)   # ' + (shareR ? 'True' : 'False') + '\n' +
                'r[0] = 999\n' +
                'print(a)'),
        UI.out(afterR)
      ]),
      el('div', null, [
        UI.code('a = np.arange(6).reshape(2, 3)\n' +
                'f = a.flatten()\n' +
                'np.shares_memory(a, f)   # ' + (shareF ? 'True' : 'False') + '\n' +
                'f[0] = 999\n' +
                'print(a)'),
        UI.out(afterF)
      ])
    ]));
    box.appendChild(UI.callout('tip',
      '둘 다 1차원으로 펴 준다. 차이는 딱 하나다 — <b>ravel 은 가능하면 뷰</b>, ' +
      '<b>flatten 은 항상 사본</b>. 원본을 지키고 싶으면 flatten, ' +
      '큰 배열을 복사 없이 훑고 싶으면 ravel 이다. ' +
      '(원본이 연속이 아니면 ravel 도 어쩔 수 없이 사본을 만든다.)'));
    return box;
  }

      ], { id: 'reshape' }));
    }
  });
})();

<script>
/* ===== webapp/src/modules/ch05-indexing.js ===== */
/* ===========================================================================
 * ch05-indexing.js — 5장 인덱싱과 슬라이싱
 * 노트북 셀 46~56(기본 인덱싱·슬라이싱), 셀 150~154(불리언·팬시) 대응.
 *
 * 이 장의 축: "정수는 축을 없애고, 슬라이스는 축을 남긴다" 와
 *            "기본 인덱싱은 뷰, 불리언·팬시는 사본" 두 규칙을
 *            글로 외우게 하지 않고 조작해서 보게 만든다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el, D = window.LabData;

  var CS = 26;    // 2·3차원 격자 칸 크기. .axis-lab(1.6rem≈25.6px) 과 폭을 맞춘 값
  var CS1 = 32;   // 1차원 격자 칸 크기 (좌상단 인덱스 표시가 들어가므로 조금 크게)

  /* ------------------------------------------------------------- 도우미 */

  /** "a[1:4, ::2]" → "1:4, ::2" */
  function stripShell(s) {
    s = String(s).trim();
    var lb = s.indexOf('[');
    if (lb !== -1 && s[s.length - 1] === ']') return s.slice(lb + 1, -1).trim();
    return s;
  }

  /** 뷰가 차지한 buf 위치 집합 — 원본 격자에서 "선택된 칸"을 칠할 때 쓴다 */
  function bufMarks(v) {
    var m = {};
    v.flatBufIndices().forEach(function (i) { m[i] = 1; });
    return m;
  }

  /** 뷰 전체에 값 하나를 대입 (a[0, :] = 0 재현) */
  function fillView(v, x) {
    v.indices().forEach(function (i) { v.set(i, x); });
    return v;
  }

  /** np.argsort — 오름차순 인덱스 배열 */
  function argsortOf(a) {
    var v = a.flatValues();
    var ord = v.map(function (_, i) { return i; });
    ord.sort(function (x, y) { return (v[x] - v[y]) || (x - y); });
    return ND.array(ord);
  }

  /** a[mask] — mask 가 행 축과 길이가 같은 1차원 불리언 배열일 때: 행 고르기 */
  function rowSelect(a, mask) {
    if (mask.ndim !== 1 || mask.shape[0] !== a.shape[0]) {
      throw new ND.NDError('boolean index did not match indexed array along axis 0; ' +
        'size of axis is ' + a.shape[0] + ' but size of corresponding boolean axis is ' +
        (mask.ndim === 1 ? mask.shape[0] : mask.size));
    }
    var picks = [];
    mask.flatValues().forEach(function (m, i) { if (m) picks.push(i); });
    if (!picks.length) return ND.zeros([0, a.shape[1]], a.dtype);
    return ND.concatenate(picks.map(function (i) { return a.idx(i + ':' + (i + 1)); }), 0);
  }

  /** a[[r0,r1,…], [c0,c1,…]] — 짝지은 원소만 뽑는다 (1차원) */
  function pairSelect(a, rs, cs) {
    var out = rs.map(function (r, k) {
      var c = cs[k];
      if (r < 0 || r >= a.shape[0]) throw new ND.NDError('index ' + r + ' is out of bounds for axis 0 with size ' + a.shape[0]);
      if (c < 0 || c >= a.shape[1]) throw new ND.NDError('index ' + c + ' is out of bounds for axis 1 with size ' + a.shape[1]);
      return a.get([r, c]);
    });
    return ND.array(out, a.dtype);
  }

  /** a[np.ix_(rows, cols)] — 행×열 블록 */
  function ixBlock(a, rs, cs) {
    return ND.array(rs.map(function (r) {
      return cs.map(function (c) { return a.get([r, c]); });
    }), a.dtype);
  }

  function panel(title, kind, kids) {
    return el('div', null, [
      el('div', { class: 'panel-t' + (kind ? ' ' + kind : ''), text: title }),
      kids
    ]);
  }

  function opArrow(t) { return el('span', { class: 'op', text: t || '→' }); }
  function note(html) { return el('p', { class: 'small muted', html: html }); }
  function line(html) { return el('p', { class: 'small', html: html }); }

  /** 차원에 맞는 격자 (1차원은 axisLabels 대신 셀 안 인덱스를 쓴다) */
  function arrGrid(a, hl, lab) {
    var o = { highlight: hl, label: lab };
    if (a.ndim >= 2) { o.axisLabels = true; o.cellSize = CS; }
    else { o.showIndex = true; o.cellSize = CS1; }

  }

  function all(kind) { return function () { return kind; }; }

  /* =========================================================================

   * ======================================================================= */

  var DESC2 = {

    ':, ::-1': '열 순서를 뒤집는다.',
    '::2, ::2': '행·열 모두 한 칸씩 건너뛴다. 체스판처럼 성기게 뽑힌다.',

  var DESC3 = {
    '0': '0번 <b>장</b> 전체. mnist 로 치면 첫 번째 이미지 한 장이다.',
    '1': '1번 장 전체.',

    '..., 1': '맨 뒤 축의 1 번 → 모든 장·행의 1번 열. <code>[:, :, 1]</code> 과 같다.',
    '..., 0:2': '맨 뒤 축을 0~1 만. <code>[:, :, 0:2]</code> 와 같다.',

  };

  var GROUPS2 = [
    { t: '정수 vs 슬라이스 — 축이 사라지는가', items: ['0', '0:1', ':, 0', ':, 0:1', '2, 3', '2:3, 3:4'] },
    { t: '범위 · 방향 · 간격', items: ['1:4', '1:4, ::2', '-1', '-2:', '::-1', ':, ::-1', '::2, ::2', '::-2'] },

  function hintFor(m) {
    if (/out of bounds/.test(m)) {
      return '<b>정수</b> 인덱싱은 범위를 넘으면 그 자리에서 IndexError 다. ' +

    function buildChips() {
      UI.clear(chipHost);

      var inner = stripShell(st.expr);
      var shown = inner === '' ? ':' : inner;
      host.appendChild(UI.code(SRC[st.dim] + '\na[' + shown + ']'));

      var d = DESC[st.dim][inner];
      if (d) host.appendChild(line(d));

      var spec, res;
      try {
        spec = ND.parseIndex(st.expr);
        res = base.index(spec);
      } catch (e) {
        host.appendChild(el('div', { class: 'flow' }, [
          panel('a — 원본 ' + ND.shapeStr(base.shape), 'a', UI.grid(base, { axisLabels: true, cellSize: CS })),
          opArrow('✗'),
          panel('결과', null, el('div', { class: 'muted small', text: '없다 — 예외가 났다.' }))
        ]));
        host.appendChild(UI.errBlock(e.message));
        host.appendChild(note(hintFor(e.message)));
        return;
      }

      var marks = bufMarks(res);
      var left = UI.grid(base, {
        axisLabels: true, cellSize: CS,
        highlight: function (idx) { return marks[base.bufIndex(idx)] ? 'a' : 'dim'; }
      });

      var right;
      if (res.ndim > 3) {
        right = UI.out(ND.format(res), { label: '4차원 이상은 격자로 못 그린다' });
      } else if (res.size === 0) {
        right = el('div', { class: 'muted small', style: { padding: '.6rem 0' },
          text: '빈 배열이다 — 칠할 칸이 없다. 그래도 에러는 아니다.' });
      } else {
        right = arrGrid(res, all('r'));
      }

      host.appendChild(el('div', { class: 'flow' }, [
        panel('a — 원본 ' + ND.shapeStr(base.shape) + ' · 파랑이 선택된 칸', 'a', left),
        opArrow(),
        panel('a[' + shown + '] — 결과 ' + ND.shapeStr(res.shape), 'r', right)
      ]));

      var nInt = 0, nNew = 0;
      spec.forEach(function (s) { if (s.k === 'i') nInt++; else if (s.k === 'n') nNew++; });

      host.appendChild(el('div', { style: { margin: '.9rem 0 .2rem' } }, [UI.shapeBadge(res)]));

      if (base.ndim - nInt + nNew === res.ndim) {
        host.appendChild(line('<span class="mono">ndim: ' + base.ndim + ' − 정수 ' + nInt +
          '개 + None ' + nNew + '개 = <b>' + res.ndim + '</b></span> &nbsp; ' +
          '<span class="muted">정수는 축을 없애고, 슬라이스는 축을 남긴다.</span>'));
      }
      host.appendChild(line('<span class="mono">선택된 칸 ' + res.size + ' / 전체 ' + base.size + '</span>' +
        ' &nbsp; <span class="mono muted">strides (' + res.strides.join(', ') + ') · offset ' + res.offset + '</span>'));
      host.appendChild(el('p', { class: 'small', style: { color: 'var(--s3)' }, html:
        '<b>np.shares_memory(a, a[' + UI.esc(shown) + ']) → True</b> — 기본 인덱싱 결과는 <b>뷰(view)</b>다. ' +
        '값을 복사하지 않고 시작 위치(offset)와 보폭(strides)만 바꿔 같은 메모리를 다르게 본다.' }));
      host.appendChild(UI.fold('print(a[' + shown + ']) 출력 보기', UI.out(ND.format(res), { label: false })));
    }

    buildChips();
    draw();

    return UI.card({
      kicker: '시뮬레이터',
      title: '슬라이싱 플레이그라운드',
      note: '입력창에 인덱스식을 쓰면 <b>왼쪽 원본에서 뽑히는 칸</b>과 <b>결과 배열</b>이 바로 바뀐다. ' +
        '<code>a[1:4, ::2]</code> 처럼 껍질을 씌워 써도 된다. 아래 칩을 눌러 가며 shape 가 어떻게 변하는지 눈으로 따라가 보자.',
      body: [UI.controls([dimSeg, input]), chipHost, host]
    });
  }

  /* =========================================================================
   * 시뮬레이터 ② 슬라이스 눈금자 (1차원, start:stop:step)
   * ======================================================================= */

  function simRuler() {
    var a = ND.arange(10);
    var st = { start: 2, stop: 7, step: 1, useStart: 'v', useStop: 'v' };
    var host = el('div');

    function expr() {
      var s = (st.useStart === 'v' ? st.start : '') + ':' + (st.useStop === 'v' ? st.stop : '');
      return st.step === 1 ? s : s + ':' + st.step;
    }

    function draw() {
      UI.clear(host);
      var e = expr();
      host.appendChild(UI.code('a = np.arange(10)\na[' + e + ']'));
      var res;
      try { res = a.idx(e); } catch (err) { host.appendChild(UI.errBlock(err.message)); return; }
      var marks = bufMarks(res);
      host.appendChild(el('div', { class: 'flow' }, [
        panel('a — 원본 (10,)', 'a', UI.grid(a, {
          showIndex: true, cellSize: CS1,
          highlight: function (i) { return marks[a.bufIndex(i)] ? 'a' : 'dim'; }
        })),
        opArrow(),
        panel('a[' + e + '] — ' + ND.shapeStr(res.shape), 'r',
          res.size ? UI.grid(res, { showIndex: true, cellSize: CS1, highlight: all('r') })
            : el('div', { class: 'muted small', text: '빈 배열' }))
      ]));
      var s0 = st.useStart === 'v' ? st.start : (st.step > 0 ? 0 : 9);
      var s1 = st.useStop === 'v' ? st.stop : (st.step > 0 ? 10 : '끝');
      host.appendChild(line('실제로 쓰인 값 → <span class="mono">start=' + s0 + ', stop=' + s1 +
        ', step=' + st.step + '</span> · 개수 <b>' + res.size + '</b>개' +
        (st.step > 0 ? ' <span class="muted">(= ceil((stop − start) / step))</span>' : '')));
      host.appendChild(note(st.useStop === 'v'
        ? '<b>stop 인 ' + st.stop + ' 은 포함되지 않는다.</b> 마지막으로 뽑히는 인덱스는 ' +
          (res.size ? String(res.get([res.size - 1])) : '없다') + ' 다.'
        : 'stop 을 생략하면 ' + (st.step > 0 ? '끝까지' : '맨 앞까지') + ' 간다.'));
    }

    var ctl = UI.controls([
      UI.seg({ label: 'start', value: st.useStart,
        options: [{ value: 'v', label: '값 사용' }, { value: 'o', label: '생략' }],
        onChange: function (v) { st.useStart = v; draw(); } }),
      UI.slider({ label: 'start 값', min: -10, max: 10, step: 1, value: st.start,
        onChange: function (v) { st.start = v; draw(); } }),
      UI.seg({ label: 'stop', value: st.useStop,
        options: [{ value: 'v', label: '값 사용' }, { value: 'o', label: '생략' }],
        onChange: function (v) { st.useStop = v; draw(); } }),
      UI.slider({ label: 'stop 값', min: -10, max: 10, step: 1, value: st.stop,
        onChange: function (v) { st.stop = v; draw(); } }),
      UI.select({ label: 'step', options: ['-3', '-2', '-1', '1', '2', '3'], value: '1',
        onChange: function (v) { st.step = parseInt(v, 10); draw(); } })
    ]);

    draw();
    return UI.card({
      kicker: '시뮬레이터',
      title: '슬라이스 눈금자 — start : stop : step',
      note: '<code>stop</code> 이 포함되지 않는다는 것과, 음수 <code>step</code> 이 방향을 뒤집는다는 것을 ' +
        '슬라이더로 확인해 보자. <code>start</code>·<code>stop</code> 을 생략하면 어떤 값이 대신 들어가는지도 아래에 적힌다.',
      body: [ctl, host]
    });
  }

  /* =========================================================================
   * 시뮬레이터 ③ 마스크 만들기 (불리언 인덱싱)
   * ======================================================================= */

  function cmp(a, op, k) {
    if (op === '>') return ND.ops.gt(a, k);
    if (op === '>=') return ND.ops.ge(a, k);
    if (op === '<') return ND.ops.lt(a, k);
    if (op === '<=') return ND.ops.le(a, k);
    if (op === '==') return ND.ops.eq(a, k);
    return ND.ops.ne(a, k);
  }

  function simMask() {
    var TG = {};
    TG.t1 = {
      label: 'temp4 (1차원)', name: 'temp4',
      code: 'temp4 = np.array([10, 20, 30, 40, 50, 60])',
      a: ND.array([10, 20, 30, 40, 50, 60]), lo: 0, hi: 70, sp: 5, k1: 35, k2: 55
    };
    TG.t2 = {
      label: 'a = arange(48).reshape(6, 8)', name: 'a',
      code: 'a = np.arange(48).reshape(6, 8)',
      a: ND.arange(48).reshape([6, 8]), lo: 0, hi: 47, sp: 1, k1: 20, k2: 40
    };
    var inf = (D && D.nd) ? D.nd('inflammation') : null;
    if (inf) {
      var sub = inf.idx('0:8, 0:10').copy();
      TG.t3 = {
        label: '관절염 8명 × 10일', name: 'sub',
        code: "data = np.loadtxt('lab_inflammation-01.csv', delimiter=',')\nsub = data[:8, :10]   # 환자 8명의 첫 10일",
        a: sub, lo: 0, hi: ND.max(sub).toNested(), sp: 1, k1: 3, k2: 6
      };
    }

    var st = { tg: 't1', op1: '>', k1: 35, cb: 'none', op2: '<', k2: 55, neg: 'n' };
    var OPS = ['>', '>=', '<', '<=', '==', '!='];
    var ctlHost = el('div');
    var host = el('div');

    function buildCtl() {
      UI.clear(ctlHost);
      var t = TG[st.tg];
      var items = [
        UI.seg({
          label: '대상 배열', value: st.tg,
          options: Object.keys(TG).map(function (k) { return { value: k, label: TG[k].label }; }),
          onChange: function (v) {
            st.tg = v; st.k1 = TG[v].k1; st.k2 = TG[v].k2; buildCtl(); draw();
          }
        }),
        UI.select({ label: '조건 1', options: OPS, value: st.op1,
          onChange: function (v) { st.op1 = v; draw(); } }),
        UI.slider({ label: '임계값 1', min: t.lo, max: t.hi, step: t.sp, value: st.k1,
          onChange: function (v) { st.k1 = v; draw(); } }),
        UI.seg({
          label: '조건 조합', value: st.cb,
          options: [{ value: 'none', label: '하나만' }, { value: '&', label: '& 그리고' }, { value: '|', label: '| 또는' }],
          onChange: function (v) { st.cb = v; buildCtl(); draw(); }
        })
      ];
      if (st.cb !== 'none') {
        items.push(UI.select({ label: '조건 2', options: OPS, value: st.op2,
          onChange: function (v) { st.op2 = v; draw(); } }));
        items.push(UI.slider({ label: '임계값 2', min: t.lo, max: t.hi, step: t.sp, value: st.k2,
          onChange: function (v) { st.k2 = v; draw(); } }));
      }
      items.push(UI.seg({
        label: '뒤집기', value: st.neg,
        options: [{ value: 'n', label: '그대로' }, { value: 'y', label: '~ 반전' }],
        onChange: function (v) { st.neg = v; draw(); }
      }));
      ctlHost.appendChild(UI.controls(items));
    }

    function draw() {
      UI.clear(host);
      var t = TG[st.tg], a = t.a;
      var c1 = '(' + t.name + ' ' + st.op1 + ' ' + st.k1 + ')';
      var ex = st.cb === 'none' ? c1 : c1 + ' ' + st.cb + ' (' + t.name + ' ' + st.op2 + ' ' + st.k2 + ')';
      if (st.neg === 'y') ex = '~' + (st.cb === 'none' ? ex : '(' + ex + ')');
      host.appendChild(UI.code(t.code + '\ncond = ' + ex + '\n' + t.name + '[cond]'));

      var m, picked;
      try {
        m = cmp(a, st.op1, st.k1);
        if (st.cb === '&') m = ND.ops.and(m, cmp(a, st.op2, st.k2));
        else if (st.cb === '|') m = ND.ops.or(m, cmp(a, st.op2, st.k2));
        if (st.neg === 'y') m = ND.ops.not(m);
        picked = ND.maskSelect(a, m);
      } catch (e) { host.appendChild(UI.errBlock(e.message)); return; }

      var mv = m.flatValues();
      var flat = a.indices();
      var trueAt = {};
      flat.forEach(function (idx, i) { if (mv[i]) trueAt[idx.join(',')] = 1; });
      function hl(idx) { return trueAt[idx.join(',')] ? 'a' : 'dim'; }

      host.appendChild(el('div', { class: 'flow' }, [
        panel(t.name + ' — 원본 ' + ND.shapeStr(a.shape), 'a', arrGrid(a, hl)),
        opArrow('⇒'),
        panel('cond — 불리언 배열 ' + ND.shapeStr(m.shape), null, arrGrid(m, hl)),
        opArrow(),
        panel(t.name + '[cond] — ' + ND.shapeStr(picked.shape), 'r',
          picked.size ? arrGrid(picked, all('r'))
            : el('div', { class: 'muted small', text: '조건을 만족하는 칸이 없다 → 빈 배열' }))
      ]));

      var cnt = ND.sum(m).toNested();
      var ratio = ND.mean(m).toNested();
      host.appendChild(UI.statRow([
        { k: 'cond.sum()', v: String(cnt), sub: '참인 칸 수' },
        { k: 'cond.mean()', v: ratio.toFixed(4), sub: cnt + ' / ' + a.size },
        { k: '결과 shape', v: ND.shapeStr(picked.shape), sub: picked.ndim + '차원' },
        { k: '원본 shape', v: ND.shapeStr(a.shape), sub: a.ndim + '차원 · ' + a.size + '칸' }
      ]));
      host.appendChild(note(a.ndim >= 2
        ? '원본이 ' + a.ndim + '차원인데 결과는 <b>1차원</b>이다. 조건을 만족하는 칸이 격자 모양으로 모여 있을 이유가 없으니, ' +
          'NumPy 는 골라낸 값을 한 줄로 늘어놓는다.'
        : '<code>cond</code> 는 원본과 <b>shape 가 같은</b> 불리언 배열이다. True 인 자리의 값만 순서대로 뽑힌다.'));
      host.appendChild(UI.fold('cond 와 결과를 print() 로 보기', el('div', null, [
        UI.out(ND.format(m), { label: 'cond' }),
        UI.out(ND.format(picked), { label: t.name + '[cond]' })
      ])));
    }

    buildCtl();
    draw();

    return UI.card({
      kicker: '시뮬레이터',
      title: '마스크 만들기 — 조건으로 걸러내기',
      note: '연산자와 임계값을 움직이면 <b>불리언 배열(마스크)</b>과 걸러낸 결과가 함께 바뀐다. ' +
        '조건을 두 개 조합할 때 <code>&amp;</code>(그리고)·<code>|</code>(또는)·<code>~</code>(부정)를 쓴다는 것도 여기서 확인하자.',
      body: [ctlHost, host]
    });
  }

  /* =========================================================================
   * 시뮬레이터 ④ 팬시 인덱싱 조립기
   * ======================================================================= */

  function fancyDiagram(src, idxList, resVals) {
    var CW = 44, GP = 7, P = CW + GP, LM = 92, H = 200;
    var n = Math.max(src.shape[0], idxList.length);
    var W = LM + n * P + 10;
    var yS = 26, yI = 92, yR = 158, RH = 32;
    var svg = UI.svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': '인덱스 배열의 각 값이 원본의 어느 칸을 가리키는지 보여 주는 그림' });
    var defs = UI.svgEl('defs');
    svg.appendChild(defs);
    var mid = 'fa-' + Math.random().toString(36).slice(2, 8);
    var mk = UI.svgEl('marker', { id: mid, viewBox: '0 0 10 10', refX: 8, refY: 5,
      markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' });
    mk.appendChild(UI.svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--s4)' }));
    defs.appendChild(mk);

    function cx(k) { return LM + k * P + CW / 2; }
    function rowLabel(y, txt) {
      svg.appendChild(UI.svgEl('text', { x: LM - 10, y: y + 21, 'text-anchor': 'end',
        'font-size': 11, 'font-weight': 650, fill: 'var(--ink-2)', text: txt }));
    }
    function box(k, y, txt, wash, stroke, ink) {
      var r = UI.svgEl('rect', { x: LM + k * P, y: y, width: CW, height: RH, rx: 5,
        fill: wash, stroke: stroke, 'stroke-width': 1.3 });
      svg.appendChild(r);
      svg.appendChild(UI.svgEl('text', { x: cx(k), y: y + 21, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, monospace', 'font-size': 13, 'font-weight': 650,
        fill: ink, 'pointer-events': 'none', text: txt }));
      return r;
    }

    rowLabel(yS, 'temp5 (원본)');
    rowLabel(yI, 'temp6 (인덱스)');
    rowLabel(yR, '결과');

    var srcRects = [];
    for (var k = 0; k < src.shape[0]; k++) {
      svg.appendChild(UI.svgEl('text', { x: cx(k), y: yS - 6, 'text-anchor': 'middle',
        'font-size': 10, fill: 'var(--ink-muted)', text: '[' + k + ']' }));
      srcRects.push(box(k, yS, UI.fmtCell(src.get([k]), src.dtype),
        'var(--s1-wash)', 'var(--s1)', 'var(--ink)'));
    }

    var arcs = [];
    idxList.forEach(function (v, j) {
      var ok = v >= 0 && v < src.shape[0];
      var x1 = cx(j), x2 = cx(Math.max(0, Math.min(src.shape[0] - 1, v)));
      var up = UI.svgEl('path', {
        d: 'M ' + x1 + ',' + yI + ' C ' + x1 + ',' + (yI - 18) + ' ' + x2 + ',' + (yS + RH + 22) + ' ' + x2 + ',' + (yS + RH + 3),
        fill: 'none', stroke: ok ? 'var(--s4)' : 'var(--critical)', 'stroke-width': 1.4,
        opacity: 0.6, 'marker-end': 'url(#' + mid + ')'
      });
      svg.appendChild(up);
      var down = UI.svgEl('line', { x1: x1, y1: yI + RH, x2: x1, y2: yR - 2,
        stroke: 'var(--s3)', 'stroke-width': 1.4, opacity: 0.6 });
      svg.appendChild(down);
      arcs.push({ up: up, down: down, v: v });
    });

    var idxRects = idxList.map(function (v, j) {
      var ok = v >= 0 && v < src.shape[0];
      return box(j, yI, String(v), ok ? 'var(--s4-wash)' : 'var(--crit-wash)',
        ok ? 'var(--s4)' : 'var(--critical)', ok ? 'var(--ink)' : 'var(--critical)');
    });
    resVals.forEach(function (v, j) {
      box(j, yR, v === null ? '?' : UI.fmtCell(v, src.dtype),
        v === null ? 'var(--crit-wash)' : 'var(--s3-wash)',
        v === null ? 'var(--critical)' : 'var(--s3)', 'var(--ink)');
    });

    function focus(j) {
      arcs.forEach(function (A, k) {
        var on = (j === null || k === j);
        A.up.setAttribute('opacity', on ? (j === null ? 0.6 : 1) : 0.1);
        A.down.setAttribute('opacity', on ? (j === null ? 0.6 : 1) : 0.1);
        A.up.setAttribute('stroke-width', k === j ? 2.6 : 1.4);
      });
      srcRects.forEach(function (R, k) {
        R.setAttribute('stroke-width', (j !== null && arcs[j] && arcs[j].v === k) ? 3 : 1.3);
      });
    }
    idxRects.forEach(function (R, j) {
      R.style.cursor = 'pointer';
      R.addEventListener('mouseenter', function () { focus(j); });
    });
    svg.addEventListener('mouseleave', function () { focus(null); });

    return el('div', { class: 'grid-wrap' }, [svg]);
  }

  function simFancy() {
    var src = ND.array([2, 4, 6, 8]);
    var st = { idx: [0, 0, 3, 2, 1, 2], two: false };
    var host = el('div');
    var ctlHost = el('div');

    function buildCtl() {
      UI.clear(ctlHost);
      var items = [
        UI.chips([
          { value: '0', label: '+ 0' }, { value: '1', label: '+ 1' },
          { value: '2', label: '+ 2' }, { value: '3', label: '+ 3' },
          { value: '-1', label: '+ -1 (음수)' }, { value: '9', label: '+ 9 (범위 밖!)' }
        ], function (v) { st.idx.push(parseInt(v, 10)); sync(); }),
        el('div', { class: 'flow', style: { gap: '.4rem', marginTop: '.5rem' } }, [
          UI.btn('마지막 삭제', function () { st.idx.pop(); sync(); }),
          UI.btn('비우기', function () { st.idx = []; sync(); }),
          UI.btn('수업 예제 0,0,3,2,1,2', function () { st.idx = [0, 0, 3, 2, 1, 2]; sync(); }, { primary: true })
        ])
      ];
      var even = st.idx.length >= 2 && st.idx.length % 2 === 0;
      items.push(el('div', { style: { marginTop: '.6rem' } }, [
        even ? UI.seg({
          label: '인덱스 배열의 shape', value: st.two ? 'y' : 'n',
          options: [{ value: 'n', label: '1차원 (' + st.idx.length + ',)' },
                    { value: 'y', label: '2차원 (2, ' + (st.idx.length / 2) + ')' }],
          onChange: function (v) { st.two = (v === 'y'); draw(); }
        }) : note('인덱스 개수가 짝수일 때 2차원으로 바꿔 볼 수 있다.')
      ]));
      ctlHost.appendChild(el('div', { class: 'controls', style: { display: 'block' } }, items));
    }

    function sync() {
      if (st.idx.length % 2 !== 0) st.two = false;
      buildCtl(); draw();
    }

    function draw() {
      UI.clear(host);
      var code = 'temp5 = np.array([2, 4, 6, 8])\ntemp6 = np.array([' + st.idx.join(', ') + '])';
      if (st.two) code += '.reshape(2, ' + (st.idx.length / 2) + ')';
      host.appendChild(UI.code(code + '\ntemp5[temp6]'));

      if (!st.idx.length) {
        host.appendChild(note('인덱스 배열이 비었다. 위의 칩으로 값을 넣어 보자.'));
        return;
      }

      var idxArr = ND.array(st.idx);
      if (st.two) idxArr = idxArr.reshape([2, st.idx.length / 2]);

      var res = null, err = null;
      try { res = ND.fancySelect(src, idxArr); } catch (e) { err = e; }

      if (!st.two) {
        var vals = st.idx.map(function (v) {
          return (v >= 0 && v < src.shape[0]) ? src.get([v]) : (v < 0 && v + src.shape[0] >= 0 ? src.get([v + src.shape[0]]) : null);
        });
        host.appendChild(fancyDiagram(src, st.idx, vals));
        host.appendChild(note('인덱스 칸에 마우스를 올리면 그 값이 원본의 어느 칸을 가리키는지 진하게 표시된다.'));
      } else {
        host.appendChild(el('div', { class: 'flow' }, [
          panel('temp5 — 원본 (4,)', 'a', arrGrid(src, all('a'))),
          opArrow('⇒'),
          panel('temp6 — 인덱스 ' + ND.shapeStr(idxArr.shape), null, arrGrid(idxArr, all('x'))),
          opArrow(),
          panel('결과', 'r', err ? el('div', { class: 'muted small', text: '에러' }) : arrGrid(res, all('r')))
        ]));
      }

      if (err) {
        host.appendChild(UI.errBlock(err.message, 'IndexError'));
        host.appendChild(note('팬시 인덱싱도 <b>정수 인덱싱</b>이다. 범위를 넘으면 슬라이싱처럼 봐 주지 않고 IndexError 를 낸다. ' +
          '음수는 뒤에서부터 세므로 <code>-1</code> 은 정상이다.'));
        return;
      }

      if (!st.two) {
        host.appendChild(el('div', { class: 'flow' }, [
          panel('결과 ' + ND.shapeStr(res.shape), 'r', arrGrid(res, all('r')))
        ]));
      }
      host.appendChild(el('div', { style: { margin: '.7rem 0 .2rem' } }, [UI.shapeBadge(res)]));
      host.appendChild(line('원본은 <b>' + src.size + '칸</b>인데 결과는 <b>' + res.size + '칸</b>이다. ' +
        '결과의 shape 는 원본이 아니라 <b>인덱스 배열의 shape</b>(' + ND.shapeStr(idxArr.shape) + ')를 그대로 따른다.' +
        (res.size > src.size ? ' 같은 칸을 여러 번 가리켜도 되니 <b>원본보다 길어질 수 있다.</b>' : '')));
      host.appendChild(el('p', { class: 'small', style: { color: 'var(--s3)' }, html:
        '<b>np.shares_memory(temp5, temp5[temp6]) → False</b> — 팬시 인덱싱 결과는 <b>사본</b>이다. ' +
        '뽑는 순서가 규칙적이지 않으니 offset·strides 로는 표현할 수 없고, 새 메모리에 값을 복사해야 한다.' }));
    }

    buildCtl();
    draw();

    return UI.card({
      kicker: '시뮬레이터',
      title: '팬시 인덱싱 조립기',
      note: '인덱스 배열 <code>temp6</code> 를 직접 만들어 보자. 같은 인덱스를 여러 번 넣어도 되고, ' +
        '원본보다 길게 만들어도 된다. 범위를 벗어나면 어떻게 되는지도 눌러 보라.',
      body: [ctlHost, host]
    });
  }

    ]));
    boolDemo();
    root.appendChild(bHost);
    root.appendChild(UI.callout('why',
      '<code>b = a[a &gt; 5]</code> 는 값을 <b>읽어 오는</b> 식이다. 뽑히는 자리가 규칙적이지 않아 ' +
      'offset·strides 로 표현할 수 없으니, NumPy 는 새 메모리를 잡아 값을 복사한다 → 사본. ' +
      '<code>a[a &gt; 5] = 0</code> 은 파이썬이 <code>a.__setitem__</code> 을 부르는 식이다. ' +
      '중간 배열을 만들 필요 없이 <b>원본의 해당 칸에 바로 쓴다</b> → 원본이 바뀐다.'));
  }

  /* ------------------------------------------------ 5.5 팬시 인덱싱 */

  function partFancy(root) {
    sec(root, '5.5  팬시 인덱싱 — 정수 배열로 골라 뽑기');

      '그 배열의 각 값이 원본의 몇 번 칸인지를 가리키고, 가리킨 순서대로 값이 나온다. ' +
      '순서를 바꾸거나, 같은 값을 여러 번 뽑거나, 원하는 몇 개만 골라올 때 쓴다.');

    root.appendChild(UI.code(

      'temp6 = np.array([0, 0, 3, 2, 1, 2])   # temp5 의 인덱스들\n' +
      'temp5[temp6]'));
    var t5 = ND.array([2, 4, 6, 8]), t6 = ND.array([0, 0, 3, 2, 1, 2]);
    root.appendChild(UI.out(ND.format(ND.fancySelect(t5, t6))));

    root.appendChild(simFancy());

    sub(root, '2차원에서 — 블록이 아니다');
    p(root, '여기서 거의 모두가 한 번은 틀린다. <code>a[[0, 2], [1, 3]]</code> 은 ' +
      '"0·2행 × 1·3열 블록" 이 아니다. 두 리스트를 <b>자리마다 짝지어</b> ' +
      '<code>(0, 1)</code> 과 <code>(2, 3)</code> <b>두 원소</b>만 뽑는다.');

    var a34 = ND.arange(12).reshape([3, 4]);
    var rs = [0, 2], cs = [1, 3];
    var real = pairSelect(a34, rs, cs);
    var block = ixBlock(a34, rs, cs);
    root.appendChild(UI.code('a = np.arange(12).reshape(3, 4)\na[[0, 2], [1, 3]]'));
    root.appendChild(el('div', { class: 'flow' }, [
      panel('실제로 뽑히는 칸 — 2개', 'r', UI.grid(a34, {

    root.appendChild(UI.callout('why',

      '<code>[0, 2]</code> 와 <code>[1, 3]</code> 은 둘 다 길이 2 이므로 짝은 ' +
      '<code>(0,1)</code>, <code>(2,3)</code> 두 개뿐이다. ' +
      '그래서 결과도 원소 2개인 1차원 배열이다.'));

    p(root, '정말 블록을 원한다면 두 가지 방법이 있다.');
    root.appendChild(UI.code(
      'a[np.ix_([0, 2], [1, 3])]     # 방법 1: 좌표 짝을 격자로 펼쳐 준다\n' +
      'a[[0, 2]][:, [1, 3]]          # 방법 2: 행 고른 뒤 열 고르기 (사본이 두 번 생긴다)'));
    root.appendChild(el('div', { class: 'flow' }, [
      panel('a[np.ix_([0,2], [1,3])]', 'r', UI.grid(block, { axisLabels: true, cellSize: CS, highlight: all('r') })),
      UI.shapeBadge(block),
      opArrow('='),
      panel('a[[0,2]][:, [1,3]]', 'r', UI.grid(
        ixBlock(a34, rs, cs), { axisLabels: true, cellSize: CS, highlight: all('r') }))
    ]));
    root.appendChild(note('<code>np.ix_</code> 는 <code>[0, 2]</code> 를 ' +
      '<span class="mono">(2, 1)</span> 로, <code>[1, 3]</code> 을 <span class="mono">(1, 2)</span> 로 ' +
      '바꿔 준다. 브로드캐스팅되면 <span class="mono">(2, 2)</span> 좌표 격자가 되므로 블록이 나온다.'));

    sub(root, 'np.argsort — 정렬 순서를 인덱스로 받아 쓰기');
    p(root, '팬시 인덱싱이 가장 빛나는 곳이다. <code>np.argsort</code> 는 값을 정렬하지 않고 ' +
      '<b>정렬했을 때의 순서</b>를 인덱스 배열로 준다. 그 인덱스를 그대로 넣으면 정렬된 배열이 된다.');
    var score = ND.array([88, 72, 95, 61, 79]);

    root.appendChild(el('div', { class: 'flow' }, [

    root.appendChild(UI.table(

       { k: 'u', label: '언제 쓰나' }],
      [
        { t: '기본 (정수·슬라이스)', e: '<code>a[1:4, ::2]</code>',
          v: '<b style="color:var(--s3)">뷰</b>', s: '규칙적으로 줄어든다 (정수는 축 삭제)',
          u: '부분을 통째로 다룰 때. 고쳐서 원본에 반영할 때' },
        { t: '불리언', e: '<code>a[a &gt; 5]</code>',
          v: '<b>사본</b>', s: '항상 1차원 (행 마스크면 예외)',
          u: '조건으로 걸러낼 때. 개수·비율을 셀 때' },
        { t: '팬시 (정수 배열)', e: '<code>a[[0, 2, 2]]</code>',
          v: '<b>사본</b>', s: '인덱스 배열의 shape 를 따른다',
          u: '순서를 바꿀 때. 중복해서 뽑을 때. argsort 와 함께' }
      ]));
    root.appendChild(UI.callout('tip',
      '헷갈릴 때 판단 기준은 하나다. <b>offset 과 strides 만으로 그 칸들을 훑을 수 있는가?</b> ' +
      '가능하면 뷰를 줄 수 있고(기본 인덱싱), 불가능하면 복사밖에 방법이 없다(불리언·팬시). ' +
      '확실하지 않으면 <code>np.shares_memory(a, b)</code> 로 물어보면 된다.'));
  }

  /* =========================================================================
   * 등록

  Lab.register({
    id: 'indexing',
    n: '5',
    title: '인덱싱과 슬라이싱',
    blurb: '배열에서 원하는 부분만 꺼내는 네 가지 방법과, 꺼낸 것이 원본과 메모리를 나눠 쓰는지를 직접 확인한다.',
    sim: '슬라이싱 플레이그라운드 · 슬라이스 눈금자 · 마스크 만들기 · 팬시 인덱싱 조립기',
    render: function (root) {
      root.appendChild(el('p', { class: 'lede', html:
        '배열을 만드는 것보다 <b>필요한 부분만 꺼내는 일</b>이 훨씬 자주 필요하다. ' +
        'NumPy 의 인덱싱은 파이썬 list 에서 출발하지만, 축이 둘 이상이 되는 순간부터 ' +
        '표기도 규칙도 달라진다. 이 장의 목표는 두 가지 규칙을 손에 익히는 것이다 — ' +
        '<b>정수는 축을 없애고 슬라이스는 축을 남긴다</b>, 그리고 ' +
        '<b>기본 인덱싱은 뷰, 불리언·팬시는 사본이다.</b>' }));

      root.appendChild(simPlayground());
      root.appendChild(note('이 플레이그라운드는 이 장 전체에서 계속 참조한다. ' +
        '새 규칙을 읽을 때마다 여기로 돌아와 직접 넣어 보는 것이 가장 빠른 길이다.'));

      part1D(root);
      partND(root);
      partSlice(root);
      partBool(root);
      partFancy(root);

      sec(root, '확인 문제');
      root.appendChild(UI.quiz([
        {
          q: '<code>a = np.arange(12).reshape(3, 4)</code> 일 때 ' +
             '<code>a[1]</code> 과 <code>a[1:2]</code> 의 shape 는 각각 무엇인가?',
          choices: [
            '<code>(4,)</code> 와 <code>(1, 4)</code>',
            '둘 다 <code>(4,)</code> — 값이 같으니 shape 도 같다',
            '둘 다 <code>(1, 4)</code>',
            '<code>(1, 4)</code> 와 <code>(4,)</code>'
          ],
          answer: 0,
          explain: '값은 둘 다 1행의 네 숫자지만 차원이 다르다. <b>정수 인덱스는 그 축을 없애고</b> ' +
            '<code>a[1]</code> → <code>(4,)</code>, <b>슬라이스는 축을 남겨</b> ' +
            '<code>a[1:2]</code> → <code>(1, 4)</code> 가 된다. ' +
            '플레이그라운드에서 <code>0</code> 과 <code>0:1</code> 을 번갈아 눌러 확인할 수 있다.'
        },
        {
          q: '행이 3개인 배열 <code>a</code> 에 <code>a[1:9]</code> 와 <code>a[9]</code> 를 각각 실행하면?',
          choices: [
            '둘 다 IndexError 가 난다',
            '<code>a[1:9]</code> 는 있는 만큼 2행을 주고, <code>a[9]</code> 는 IndexError 다',
            '<code>a[1:9]</code> 는 빈 배열이고, <code>a[9]</code> 는 마지막 행을 준다',
            '둘 다 부족한 자리를 0 으로 채워서 준다'
          ],
          answer: 1,
          explain: '<b>슬라이스는 범위를 넘어도 에러가 아니다</b> — 요청 범위와 실제 범위의 교집합인 1·2행을 준다. ' +
            '반면 <b>정수 인덱싱은 값 하나를 돌려줘야 하므로</b> 없는 자리를 요구받으면 ' +
            '<code>IndexError: index 9 is out of bounds for axis 0 with size 3</code> 를 낸다. ' +
            'NumPy 가 없는 값을 만들어 채우는 일은 절대 없다.'
        },
        {
          q: '<code>a = np.arange(10)</code> 다. 다음 중 <b>원본 <code>a</code> 가 바뀌는</b> 것은?',
          choices: [
            '<code>b = a[a &gt; 5]</code> 뒤에 <code>b[0] = 99</code>',
            '<code>c = a[[0, 1, 2]]</code> 뒤에 <code>c[0] = 99</code>',
            '<code>d = a[2:5]</code> 뒤에 <code>d[0] = 99</code>',
            '세 개 모두 원본이 바뀐다'
          ],
          answer: 2,
          explain: '<code>a[2:5]</code> 는 <b>기본 인덱싱</b>이라 <b>뷰</b>다 — 같은 메모리를 보고 있으니 ' +
            '<code>d[0] = 99</code> 는 <code>a[2]</code> 를 바꾼다. ' +
            '<b>불리언</b>(<code>a[a &gt; 5]</code>)과 <b>팬시</b>(<code>a[[0,1,2]]</code>)는 ' +
            '새 메모리에 값을 복사한 <b>사본</b>이므로 원본과 무관하다. ' +
            '단, <code>a[a &gt; 5] = 0</code> 처럼 <b>대입문 왼쪽</b>에 쓰면 사본이 만들어지지 않고 ' +
            '원본이 바로 바뀐다는 점은 따로 기억해야 한다.'
        },
        {
          q: '<code>a = np.arange(12).reshape(3, 4)</code> 에서 <code>a[[0, 2], [1, 3]]</code> 의 결과는?',
          choices: [
            '0·2행과 1·3열이 만나는 <code>(2, 2)</code> 블록',
            '<code>(0, 1)</code> 과 <code>(2, 3)</code> 두 원소, shape <code>(2,)</code>',
            '0·2행 전체인 <code>(2, 4)</code>',
            '인덱스 배열을 두 개 쓸 수 없으므로 에러'
          ],
          answer: 1,
          explain: '두 인덱스 배열은 <b>자리마다 짝지어</b> 좌표를 만든다. ' +
            '<code>[0, 2]</code> 와 <code>[1, 3]</code> 에서 나오는 짝은 <code>(0,1)</code>, <code>(2,3)</code> ' +
            '두 개뿐이므로 결과는 원소 2개인 1차원 배열 <code>[1, 11]</code> 이다. ' +
            '블록이 필요하면 <code>a[np.ix_([0,2], [1,3])]</code> 또는 ' +
            '<code>a[[0,2]][:, [1,3]]</code> 를 쓴다.'
        }
      ], { id: 'indexing' }));
    }
  });
})();

<script>
/* ===== webapp/src/modules/ch06-create.js ===== */
/* ===========================================================================
 * ch06-create.js — 6장 "배열을 만드는 여러 방법"
 * 노트북 셀 57~89 대응: 생성 함수(arange·linspace·zeros·ones·full·empty·
 * *_like·identity·eye·diag) + 난수 표본추출 + 합치기/쪼개기.
 * 모든 숫자는 ND 엔진이 그 자리에서 계산한다.
 * =========================================================================== */
(function () {
  'use strict';

  var UI = window.UI, ND = window.ND, el = UI.el, D = window.LabData;

  /* ------------------------------------------------------------- 소도구 */

  var DT_PY = { float64: 'float', int64: 'int', int32: 'np.int32', bool: 'bool' };

  /** dtype 인자를 파이썬 코드 문자열로 */
  function dtArg(v) { return (v && v !== 'auto') ? ', dtype=' + (DT_PY[v] || v) : ''; }
  /** 'auto' 를 엔진용 undefined 로 */
  function dtOf(v) { return v === 'auto' ? undefined : v; }

  var DT_OPTIONS = [
    { value: 'auto', label: '지정 안 함' },
    { value: 'float64', label: 'float' },
    { value: 'int64', label: 'int' },
    { value: 'int32', label: 'np.int32' },
    { value: 'bool', label: 'bool' }
  ];

  /** 제목 붙은 칸 (panel-t 색: a 파랑 / b 주황 / r 초록) */
  function panel(title, cls, kids) {
    return el('div', null, [el('div', { class: 'panel-t' + (cls ? ' ' + cls : ''), text: title })]
      .concat(Array.isArray(kids) ? kids : [kids]));
  }

  /** 파이썬 리스트 리터럴 문자열 */
  function pyLit(a) {
    return JSON.stringify(a.toNested()).replace(/,/g, ', ');
  }

  /** 예외를 학생이 볼 그대로 보여 준다 */
  function errOf(e) {
    var msg = (e && e.message) ? e.message : String(e);
    var kind = /out of bounds for array of dimension/.test(msg) ? 'AxisError' : null;
    return UI.errBlock(msg, kind);
  }

  /** 결과 격자 + shape 배지 + print 출력 한 묶음 */
  function resultBlock(a, hl) {
    return el('div', null, [
      UI.grid(a, { highlight: hl || function () { return 'r'; }, axisLabels: a.ndim === 2 }),
      UI.shapeBadge(a),
      UI.out(ND.format(a))
    ]);
  }

  /** 재현 가능한 의사난수 생성기(mulberry32). NumPy 의 MT19937 과는 다른 알고리즘이다. */
  function rngOf(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 표준정규 난수 (Box–Muller) */
  function normalPair(r) {
    var u = 1 - r(), v = r();
    var m = Math.sqrt(-2 * Math.log(u));
    return [m * Math.cos(2 * Math.PI * v), m * Math.sin(2 * Math.PI * v)];
  }

  /** 오차함수 근사 (Abramowitz & Stegun 7.1.26) — 이론 분포 곡선용 */
  function erf(x) {
    var sign = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * x);
    var y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
      - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return sign * y;
  }
  function Phi(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }

  /* --------------------------------------------------- np.split 계열 구현 */

  /** 축 axis 를 n 조각으로. even=true 면 np.split(균등 필수), false 면 np.array_split */
  function splitParts(a, n, axis, even) {
    var L = a.shape[axis], sizes = [], i;
    if (even) {
      if (L % n !== 0) {
        throw new ND.NDError('array split does not result in an equal division');
      }
      for (i = 0; i < n; i++) sizes.push(L / n);
    } else {
      var q = Math.floor(L / n), r = L % n;
      for (i = 0; i < n; i++) sizes.push(q + (i < r ? 1 : 0));
    }
    var out = [], start = 0;
    for (var k = 0; k < n; k++) {
      var spec = [];
      for (var d = 0; d < a.ndim; d++) {
        if (d === axis) spec.push({ k: 's', start: start, stop: start + sizes[k], step: null });
        else spec.push({ k: 's', start: null, stop: null, step: null });
      }
      out.push(a.index(spec));
      start += sizes[k];
    }
    return out;
  }
